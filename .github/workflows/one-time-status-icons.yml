name: One-time restore contact status icons
on:
  push:
    branches: [ui-refresh-light-v1]
    paths:
      - '.github/workflows/one-time-status-icons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
      - name: Restore status icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client-portal.html')
          s=p.read_text()
          s=s.replace("function contactStatusLabel(status){return({new:'جديد',in_progress:'قيد التنفيذ',completed:'مكتمل',closed:'مغلق'})[status]||status||'—'}", "function contactStatusLabel(status){return({new:'🆕 جديد',in_progress:'⏳ قيد التنفيذ',completed:'✅ مكتمل',closed:'📁 مغلق'})[status]||status||'—'}")
          s=s.replace('>جديد</option><option value="in_progress"', '>🆕 جديد</option><option value="in_progress"')
          s=s.replace('>قيد التنفيذ</option><option value="completed"', '>⏳ قيد التنفيذ</option><option value="completed"')
          s=s.replace('>مكتمل</option><option value="closed"', '>✅ مكتمل</option><option value="closed"')
          s=s.replace('>مغلق</option></select>', '>📁 مغلق</option></select>')
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-portal.html
          git commit -m "Restore contact status icons in client portal" || true
          git rm .github/workflows/one-time-status-icons.yml
          git commit -m "Remove one-time status icons workflow"
          git push origin ui-refresh-light-v1
