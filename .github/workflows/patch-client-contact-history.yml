name: Patch client contact history
on:
  push:
    branches: [ui-refresh-light-v1]
    paths: ['.github/workflows/patch-client-contact-history.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
      - name: Patch client portal contact history
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('client-portal.html')
          s=p.read_text()
          old='''<section><h3>آخر طلبات التواصل</h3><div class="muted" style="margin-bottom:10px">يمكنك تحديث حالة كل طلب من هنا.</div><div id="contactTable"></div></section>'''
          new='''<section><h3>طلبات التواصل الحالية</h3><div class="muted" style="margin-bottom:10px">تظهر هنا الطلبات الجديدة وقيد التنفيذ فقط.</div><div id="contactTable"></div></section><section><h3>سجل طلبات التواصل</h3><div class="muted" style="margin-bottom:10px">تُحفظ هنا الطلبات المكتملة والمغلقة للرجوع إليها لاحقًا.</div><div id="contactHistoryTable"></div></section>'''
          if old not in s:
              raise SystemExit('contact section not found')
          s=s.replace(old,new,1)
          marker='async function updateContactStatus(id)'
          helper='''function contactStatusLabel(status){return({new:'جديد',in_progress:'قيد التنفيذ',completed:'مكتمل',closed:'مغلق'})[status]||status||'—'}\nfunction contactTypeLabel(type){return type==='callback'?'طلب اتصال':type==='human_handoff'?'التحدث مع مسؤول':type||'—'}\nfunction renderContactRows(items,editable){return (items||[]).map(x=>{const base=`<td>${esc(x.customer_name||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(contactTypeLabel(x.request_type))}</td>`;if(!editable)return `<tr>${base}<td>${esc(contactStatusLabel(x.status))}</td></tr>`;return `<tr>${base}<td><select id="contact-status-${esc(x.id)}" class="status-select"><option value="new" ${x.status==='new'?'selected':''}>جديد</option><option value="in_progress" ${x.status==='in_progress'?'selected':''}>قيد التنفيذ</option><option value="completed" ${x.status==='completed'?'selected':''}>مكتمل</option><option value="closed" ${x.status==='closed'?'selected':''}>مغلق</option></select><button id="contact-save-${esc(x.id)}" class="status-save" onclick="updateContactStatus('${esc(x.id)}')">حفظ الحالة</button></td></tr>`})}\n'''
          if marker not in s:
              raise SystemExit('updateContactStatus marker not found')
          s=s.replace(marker,helper+marker,1)
          pat=re.compile(r"el\('contactTable'\)\.innerHTML=table\(\['الاسم','الهاتف','النوع','الحالة'\],\(d\.recent_contacts\|\|\[\]\)\.map\(x=>`<tr>.*?</tr>`\)\);",re.S)
          repl="const allContacts=d.recent_contacts||[];const activeContacts=allContacts.filter(x=>x.status==='new'||x.status==='in_progress');const historyContacts=allContacts.filter(x=>x.status==='completed'||x.status==='closed');el('contactTable').innerHTML=table(['الاسم','الهاتف','النوع','الحالة'],renderContactRows(activeContacts,true));el('contactHistoryTable').innerHTML=table(['الاسم','الهاتف','النوع','الحالة'],renderContactRows(historyContacts,false));"
          s2,n=pat.subn(repl,s,count=1)
          if n!=1:
              raise SystemExit(f'contact render replacement count={n}')
          p.write_text(s2)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/patch-client-contact-history.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client-portal.html .github/workflows/patch-client-contact-history.yml
          git commit -m 'Archive completed contact requests in client portal'
          git push origin ui-refresh-light-v1
