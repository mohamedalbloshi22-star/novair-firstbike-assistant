name: Remove temporary contact diagnostic exposure
on:
  push:
    branches: [ui-refresh-light-v1]
    paths:
      - '.github/workflows/remove-contact-diagnostic.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
      - name: Remove diagnostic exposure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-light.html')
          s=p.read_text()
          old="const detail=clientSlug==='nsr-test-20'?String(error?.message||'').trim():'';contactMessage.textContent=detail?(language==='en'?`Send failed: ${detail}`:`فشل الإرسال: ${detail}`):(language==='en'?'Could not send the request. Please try again.':'تعذر إرسال الطلب. حاول مرة أخرى.')}"
          new="contactMessage.textContent=language==='en'?'Could not send the request. Please try again.':'تعذر إرسال الطلب. حاول مرة أخرى.'}"
          if old not in s:
              raise SystemExit('target diagnostic code not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/remove-contact-diagnostic.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-light.html .github/workflows/remove-contact-diagnostic.yml
          git commit -m 'Remove temporary contact error diagnostics'
          git push origin HEAD:ui-refresh-light-v1