name: BSR1 Vercel Env Metadata
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsr1-vercel-env-metadata.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect environment metadata only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_ACQC3PWsJuPZ1lELmsKql0iVf9hc
          TEAM_ID: team_wNsChKTb2m3lG5H9DWEBktDu
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request
          token=os.environ['VERCEL_TOKEN']; pid=os.environ['PROJECT_ID']; tid=os.environ['TEAM_ID']
          req=urllib.request.Request(f'https://api.vercel.com/v10/projects/{pid}/env?teamId={tid}',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          for key in ('SUPABASE_SERVICE_ROLE_KEY','SUPABASE_URL'):
              rows=[e for e in data.get('envs',[]) if e.get('key')==key]
              print(key+'_ENTRY_COUNT='+str(len(rows)))
              for i,e in enumerate(rows,1):
                  meta={k:v for k,v in e.items() if k not in ('value','key')}
                  print(f'{key}_{i}_META='+json.dumps(meta,sort_keys=True,separators=(',',':')))
          PY