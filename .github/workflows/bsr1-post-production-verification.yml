name: BSR1 Post Production Verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsr1-post-production-verification.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify admin production authentication secret
        shell: bash
        env:
          ADMIN_PASSWORD: ${{ secrets.BSR1_PROD_ADMIN_PASSWORD }}
          BASE_URL: https://novaire-nsr-01.vercel.app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,http.cookiejar
          pw=os.environ.get('ADMIN_PASSWORD','')
          if not pw: raise SystemExit('BSR1_PROD_ADMIN_PASSWORD is unavailable to this workflow')
          cj=http.cookiejar.CookieJar(); op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          def call(path,method='GET',body=None):
              req=urllib.request.Request(os.environ['BASE_URL']+path,data=(json.dumps(body).encode() if body is not None else None),headers={'Content-Type':'application/json'},method=method)
              try:
                  with op.open(req,timeout=30) as r:return r.status,r.read().decode()
              except urllib.error.HTTPError as e:return e.code,e.read().decode()
          st,tx=call('/api/admin-auth','POST',{'password':pw})
          assert st==200 and json.loads(tx).get('authenticated') is True,('admin_login',st)
          st,tx=call('/api/admin-auth')
          assert st==200 and json.loads(tx).get('authenticated') is True,('admin_session',st)
          st,tx=call('/api/admin-auth','POST',{'action':'logout'})
          assert st==200 and json.loads(tx).get('authenticated') is False,('admin_logout',st)
          print('ADMIN_LOGIN=PASS')
          print('ADMIN_SESSION=PASS')
          print('ADMIN_LOGOUT=PASS')
          PY