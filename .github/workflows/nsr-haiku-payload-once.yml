name: NSR Haiku Payload One-Time Patch

on:
  push:
    branches: [ui-refresh-light-v1]
    paths: [.github/workflows/nsr-haiku-payload-once.yml]

permissions:
  contents: write

jobs:
  patch-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
          fetch-depth: 0

      - name: Reduce Haiku payload while preserving Sonnet context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/chat.js')
          s=p.read_text()
          old='''    const relevantKnowledge=selectRelevantKnowledge(knowledgeBase,latestUserMessage);\n    const knowledgeText=buildKnowledgeText(relevantKnowledge);\n    const baseBusinessInfo=buildBaseBusinessInfo(client,safeLanguage);'''
          new='''    const selectedModel=selectModelForRequest(latestUserMessage,messages);\n    const isFastModel=selectedModel===HAIKU_MODEL;\n    const selectedKnowledge=selectRelevantKnowledge(knowledgeBase,latestUserMessage);\n    const relevantKnowledge=isFastModel?selectedKnowledge.slice(0,4):selectedKnowledge;\n    const claudeMessages=prepareMessagesForClaude(messages);\n    const requestMessages=isFastModel?claudeMessages.slice(-4):claudeMessages;\n    const knowledgeText=buildKnowledgeText(relevantKnowledge);\n    const baseBusinessInfo=buildBaseBusinessInfo(client,safeLanguage);'''
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          s=s.replace('model:selectModelForRequest(latestUserMessage,messages)', 'model:selectedModel', 1)
          s=s.replace('messages:prepareMessagesForClaude(messages)', 'messages:requestMessages', 1)
          p.write_text(s)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "NOVAIRE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api/chat.js
          git rm .github/workflows/nsr-haiku-payload-once.yml
          git add -A
          git commit -m "Trim Haiku context for faster NSR-1 responses"
          git push origin ui-refresh-light-v1
