name: NSR Speed Cache One-Time Patch

on:
  push:
    branches: [ui-refresh-light-v1]
    paths: [.github/workflows/nsr-speed-cache-once.yml]

permissions:
  contents: write

jobs:
  patch-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
          fetch-depth: 0

      - name: Apply speed cache and test quota bypass
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('api/chat.js')
          s=p.read_text()

          if 'const CLIENT_CACHE_TTL_MS = 60000;' not in s:
              s=s.replace('const SONNET_MODEL = "claude-sonnet-4-6";','const SONNET_MODEL = "claude-sonnet-4-6";\nconst CLIENT_CACHE_TTL_MS = 60000;\nconst KNOWLEDGE_CACHE_TTL_MS = 60000;\nconst clientCache = new Map();\nconst knowledgeCache = new Map();')

          old='''async function getClient(clientSlug) {\n  const rows = await supabaseRequest(`clients?slug=eq.${encodeURIComponent(clientSlug)}&select=id,name,slug,config&limit=1`);\n  if (!Array.isArray(rows) || !rows.length) throw new Error("Client not found");\n  const client = rows[0];\n  if (client.config && client.config.active === false) throw new Error("Client is inactive");\n  return client;\n}'''
          new='''async function getClient(clientSlug) {\n  const now=Date.now();\n  const cached=clientCache.get(clientSlug);\n  if (cached && cached.expiresAt>now) return cached.value;\n  const rows = await supabaseRequest(`clients?slug=eq.${encodeURIComponent(clientSlug)}&select=id,name,slug,config&limit=1`);\n  if (!Array.isArray(rows) || !rows.length) throw new Error("Client not found");\n  const client = rows[0];\n  if (client.config && client.config.active === false) throw new Error("Client is inactive");\n  clientCache.set(clientSlug,{value:client,expiresAt:now+CLIENT_CACHE_TTL_MS});\n  return client;\n}'''
          if old in s:
              s=s.replace(old,new)

          old='''async function getKnowledgeBase(clientId) {\n  const rows = await supabaseRequest(`knowledge_base?client_id=eq.${clientId}&active=eq.true&select=id,question,answer,language,source,updated_at&order=updated_at.desc&limit=200`);\n  return Array.isArray(rows) ? rows.filter(row => row && typeof row.question === "string" && typeof row.answer === "string" && row.question.trim() && row.answer.trim()) : [];\n}'''
          new='''async function getKnowledgeBase(clientId) {\n  const now=Date.now();\n  const cached=knowledgeCache.get(clientId);\n  if (cached && cached.expiresAt>now) return cached.value;\n  const rows = await supabaseRequest(`knowledge_base?client_id=eq.${clientId}&active=eq.true&select=id,question,answer,language,source,updated_at&order=updated_at.desc&limit=200`);\n  const value=Array.isArray(rows) ? rows.filter(row => row && typeof row.question === "string" && typeof row.answer === "string" && row.question.trim() && row.answer.trim()) : [];\n  knowledgeCache.set(clientId,{value,expiresAt:now+KNOWLEDGE_CACHE_TTL_MS});\n  return value;\n}'''
          if old in s:
              s=s.replace(old,new)

          old='''    const conversationPromise=getOrCreateConversation(client.id,safeSessionId,safeLanguage);\n    const knowledgePromise=getKnowledgeBase(client.id).catch(error=>{console.error("KNOWLEDGE BASE LOAD ERROR:",error);return [];});\n    const quotaPromise=reserveAiResponse(client.id);\n\n    quotaSnapshot=await quotaPromise;\n    if (!quotaSnapshot||quotaSnapshot.allowed!==true) return res.status(429).json({error:"AI response limit reached",code:"AI_RESPONSE_LIMIT_REACHED",usage:{used:Number(quotaSnapshot?.used||0),monthly_limit:Number(quotaSnapshot?.monthly_limit||0),remaining:Number(quotaSnapshot?.remaining||0),usage_percent:Number(quotaSnapshot?.usage_percent||100),warning_level:quotaSnapshot?.warning_level||"CAP_REACHED",cycle_end:quotaSnapshot?.cycle_end||null}});\n    reservedQuotaClientId=client.id;'''
          new='''    const conversationPromise=getOrCreateConversation(client.id,safeSessionId,safeLanguage);\n    const knowledgePromise=getKnowledgeBase(client.id).catch(error=>{console.error("KNOWLEDGE BASE LOAD ERROR:",error);return [];});\n    const isSpeedTestClient=safeClientSlug==="nsr-test-20";\n    const quotaPromise=isSpeedTestClient\n      ? Promise.resolve({allowed:true,used:0,monthly_limit:999999,remaining:999999,usage_percent:0,warning_level:"TEST_MODE",newly_crossed_threshold:null})\n      : reserveAiResponse(client.id);\n\n    quotaSnapshot=await quotaPromise;\n    if (!quotaSnapshot||quotaSnapshot.allowed!==true) return res.status(429).json({error:"AI response limit reached",code:"AI_RESPONSE_LIMIT_REACHED",usage:{used:Number(quotaSnapshot?.used||0),monthly_limit:Number(quotaSnapshot?.monthly_limit||0),remaining:Number(quotaSnapshot?.remaining||0),usage_percent:Number(quotaSnapshot?.usage_percent||100),warning_level:quotaSnapshot?.warning_level||"CAP_REACHED",cycle_end:quotaSnapshot?.cycle_end||null}});\n    if (!isSpeedTestClient) reservedQuotaClientId=client.id;'''
          if old in s:
              s=s.replace(old,new)

          p.write_text(s)
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "NOVAIRE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api/chat.js
          git rm .github/workflows/nsr-speed-cache-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Cache NSR chat data and lift test quota temporarily"
          git push origin ui-refresh-light-v1
