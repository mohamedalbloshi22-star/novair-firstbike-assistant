name: BSR1 Secret Access Preflight
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsr1-secret-access-preflight.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secret values are accessible without exposing them
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_ACQC3PWsJuPZ1lELmsKql0iVf9hc
          TEAM_ID: team_wNsChKTb2m3lG5H9DWEBktDu
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,sys
          token=os.environ['VERCEL_TOKEN']; pid=os.environ['PROJECT_ID']; tid=os.environ['TEAM_ID']
          req=urllib.request.Request(f'https://api.vercel.com/v10/projects/{pid}/env?decrypt=true&teamId={tid}',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          envs=data.get('envs',[])
          required=['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','NOVAIRE_ADMIN_PASSWORD']
          missing=[]
          for key in required:
              row=next((e for e in envs if e.get('key')==key and 'production' in (e.get('target') or [])),None)
              ok=bool(row and isinstance(row.get('value'),str) and row.get('value'))
              print(f'{key}_DECRYPT_ACCESS='+('PASS' if ok else 'FAIL'))
              if not ok: missing.append(key)
          print('SECRET_PREFLIGHT='+('PASS' if not missing else 'FAIL'))
          if missing: sys.exit(3)
          PY