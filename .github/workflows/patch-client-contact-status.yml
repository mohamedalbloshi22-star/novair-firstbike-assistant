name: Patch client contact status
on:
  push:
    branches: [ui-refresh-light-v1]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
      - name: Patch portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client-portal.html')
          s=p.read_text()
          s=s.replace(".ok{color:#16765f}.bad{color:#a13a33}", ".ok{color:#16765f}.bad{color:#a13a33}.status-select{padding:8px;border:1px solid #cadde8;border-radius:9px;background:#fff;color:#10233f}.status-save{margin-top:6px;border:0;border-radius:9px;padding:8px 10px;background:#0f6fa6;color:#fff;font-weight:700;cursor:pointer}.status-save:disabled{opacity:.55}")
          anchor="function renderUnanswered(items){"
          insert="function contactStatusLabel(s){return({new:'جديد',in_progress:'قيد التنفيذ',completed:'مكتمل',closed:'مغلق'})[s]||'جديد'}\nasync function updateContactStatus(id){const select=el(`contact-status-${id}`),btn=el(`contact-save-${id}`);if(!select||!btn)return;btn.disabled=true;const old=btn.textContent;btn.textContent='جاري الحفظ...';try{const r=await fetch('/api/contact-client',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update_status',request_id:id,status:select.value})});const d=await r.json();if(r.status===401){location='/client-login.html';return}if(!r.ok||!d.success)throw Error(d.error||'تعذر تحديث الحالة');btn.textContent='تم الحفظ ✓';setTimeout(loadPortal,400)}catch(e){btn.textContent='تعذر الحفظ';setTimeout(()=>{btn.textContent=old;btn.disabled=false},1200)}}\n"
          if insert not in s:
              s=s.replace(anchor,insert+anchor)
          old="el('contactTable').innerHTML=table(['الاسم','الهاتف','النوع','الحالة'],(d.recent_contacts||[]).map(x=>`<tr><td>${esc(x.customer_name||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.request_type||'-')}</td><td>${esc(x.status||'-')}</td></tr>`));"
          new="el('contactTable').innerHTML=table(['الاسم','الهاتف','النوع','الحالة'],(d.recent_contacts||[]).map(x=>`<tr><td>${esc(x.customer_name||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.request_type==='callback'?'طلب اتصال':'التحدث مع مسؤول')}</td><td><select id=\"contact-status-${esc(x.id)}\" class=\"status-select\"><option value=\"new\" ${x.status==='new'?'selected':''}>جديد</option><option value=\"in_progress\" ${x.status==='in_progress'?'selected':''}>قيد التنفيذ</option><option value=\"completed\" ${x.status==='completed'?'selected':''}>مكتمل</option><option value=\"closed\" ${x.status==='closed'?'selected':''}>مغلق</option></select><button id=\"contact-save-${esc(x.id)}\" class=\"status-save\" onclick=\"updateContactStatus('${esc(x.id)}')\">حفظ الحالة</button></td></tr>`));"
          if old not in s:
              raise SystemExit('target contact table snippet not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-client-contact-status.yml
          git add client-portal.html .github/workflows/patch-client-contact-status.yml
          git commit -m "Enable contact status management in client portal"
          git push origin ui-refresh-light-v1
