name: BSR1 Promote Approved Production
on:
  push:
    branches: [main]
    paths: [.github/workflows/bsr1-promote-approved-production.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Point production traffic to approved deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_ACQC3PWsJuPZ1lELmsKql0iVf9hc
          TEAM_ID: team_wNsChKTb2m3lG5H9DWEBktDu
          DEPLOYMENT_ID: dpl_66hWD5H2igu7R8FXJ3Rm4FpYhLBc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,urllib.request,urllib.error
          token=os.environ['VERCEL_TOKEN']; pid=os.environ['PROJECT_ID']; tid=os.environ['TEAM_ID']; did=os.environ['DEPLOYMENT_ID']
          req=urllib.request.Request(f'https://api.vercel.com/v10/projects/{pid}/promote/{did}?teamId={tid}',data=b'{}',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=30) as r: print('PROMOTE_HTTP_STATUS='+str(r.status))
          except urllib.error.HTTPError as e:
              print('PROMOTE_HTTP_ERROR='+str(e.code)); print(e.read().decode('utf-8','replace')); raise
          PY