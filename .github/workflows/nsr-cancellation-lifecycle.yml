name: NSR cancellation lifecycle
on:
  workflow_dispatch:
  push:
    branches: [ui-refresh-light-v1]
    paths: ['.github/workflows/nsr-cancellation-lifecycle.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
      - name: Patch billing lifecycle and agreement
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('lib/nsr-billing.js')
          s=p.read_text()

          marker="async function persistStripeSubscription(clientId,stripeSub,customerId=null){"
          fn=r'''async function sendSubscriptionEndedEmail(clientId,subscription){if(!RESEND_API_KEY)return {sent:false,skipped:true};const client=await readClient(clientId);const cfg=client?.config&&typeof client.config==='object'?client.config:{};const recipient=String(cfg.billing_email||cfg.contact_email||'').trim();if(!recipient)return {sent:false,skipped:true};const endedAt=subscription?.ended_at?new Date(subscription.ended_at*1000).toISOString():new Date().toISOString();const subject='NOVAIRE | تأكيد انتهاء اشتراك NSR-1';const notificationType=`subscription_ended_${subscription?.id||'unknown'}`;const cycleStart=endedAt.slice(0,10);const logRow={client_id:clientId,cycle_start:cycleStart,notification_type:notificationType,recipient,subject,status:'sent',provider_message_id:null,metadata:{subscription_id:subscription?.id||null,ended_at:endedAt}};const inserted=await logNotification(logRow);if(inserted===false)return {sent:false,duplicate:true};const clientName=cfg.brand_name||client?.name||client?.slug||'Client';const html=`<div dir="rtl" style="font-family:Arial,Tahoma,sans-serif;max-width:650px;margin:auto;color:#111827;line-height:1.8"><h2>NOVAIRE Smart Response</h2><p>مرحبًا ${escapeHtml(cfg.contact_name||clientName)}،</p><p>نؤكد انتهاء اشتراك <strong>NSR-1</strong> الخاص بـ <strong>${escapeHtml(clientName)}</strong>.</p><p>توقفت خدمة المساعد بعد انتهاء الدورة المدفوعة. وتبقى بوابة العميل متاحة للاطلاع على الحساب وإعادة الاشتراك في أي وقت بعقد ودورة جديدة.</p><p>أي فاتورة أو إيصال نهائي متاح سيبقى ضمن سجل الدفع لدى مزود الدفع المعتمد.</p><p style="color:#6b7280;font-size:13px">هذه رسالة تشغيلية آلية لتأكيد انتهاء التعاقد التشغيلي الحالي.</p></div>`;try{const r=await fetch('https://api.resend.com/emails',{method:'POST',headers:{Authorization:`Bearer ${RESEND_API_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({from:NOTIFICATION_FROM,to:[recipient],subject,html})});const text=await r.text();if(!r.ok)throw new Error(`Resend ${r.status}: ${text}`);return {sent:true};}catch(error){console.error('SUBSCRIPTION ENDED EMAIL ERROR:',error);try{await sb(`nsr_notification_log?client_id=eq.${encodeURIComponent(clientId)}&notification_type=eq.${encodeURIComponent(notificationType)}&recipient=eq.${encodeURIComponent(recipient)}`,{method:'PATCH',prefer:'return=minimal',body:{status:'failed',metadata:{subscription_id:subscription?.id||null,ended_at:endedAt,error:String(error.message||error)}}});}catch{}return {sent:false,error:true};}}
'''
          if fn.strip() not in s:
              if marker not in s: raise SystemExit('billing insertion marker not found')
              s=s.replace(marker,fn+marker,1)

          old="""if(clientId){if(event.type.startsWith('customer.subscription.')){await persistStripeSubscription(clientId,obj,typeof obj.customer==='string'?obj.customer:obj.customer?.id||null);}else if(event.type==='checkout.session.completed'&&obj.subscription){"""
          new="""if(clientId){if(event.type==='customer.subscription.deleted'){await persistStripeSubscription(clientId,obj,typeof obj.customer==='string'?obj.customer:obj.customer?.id||null);await sb(`nsr_client_subscriptions?client_id=eq.${encodeURIComponent(clientId)}`,{method:'PATCH',prefer:'return=minimal',body:{status:'cancelled',auto_renew:false,cancel_at_period_end:false,stripe_status:'canceled',billing_updated_at:new Date().toISOString()}});try{await sendSubscriptionEndedEmail(clientId,obj);}catch(error){console.error('SUBSCRIPTION END NOTIFICATION ERROR:',error);}}else if(event.type.startsWith('customer.subscription.')){await persistStripeSubscription(clientId,obj,typeof obj.customer==='string'?obj.customer:obj.customer?.id||null);}else if(event.type==='checkout.session.completed'&&obj.subscription){"""
          if old not in s: raise SystemExit('billing webhook marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('commercial/NSR1_CLIENT_AGREEMENT_TEMPLATE_AR.md')
          s=p.read_text()
          old="""## 12. الإنهاء
يجوز للعميل طلب إيقاف الاشتراك وفق شروط الإلغاء المتفق عليها. وتظل المبالغ المستحقة قبل تاريخ الإنهاء واجبة السداد.

يجوز لـ NOVAIRE إنهاء الاتفاقية عند وجود مخالفة جوهرية أو خطر قانوني أو أمني أو إساءة استخدام، وفق ما يسمح به القانون.
"""
          new="""## 12. الإلغاء والإنهاء وإتاحة الخدمة بعد طلب الإلغاء
يجوز للعميل إلغاء التجديد التلقائي في أي وقت وفق سياسة الإلغاء المعتمدة. ولا يؤدي طلب الإلغاء وحده إلى إيقاف الخدمة فورًا؛ إذ يستمر حق العميل في الاستفادة من الدورة المدفوعة الحالية حتى نهاية مدتها أو حتى استهلاك كامل حد الباقة، أيهما يحدث أولًا، ما لم يوجد سبب قانوني أو أمني أو تشغيلي يبرر الإيقاف الفوري.

عند نهاية الدورة المدفوعة بعد إلغاء التجديد، أو عند انتهاء الاشتراك بسبب عدم السداد بعد انقضاء أي مهلة دفع معتمدة، تتوقف خدمة المساعد ولا تستمر الردود المدفوعة. وتبقى بوابة العميل متاحة لأغراض إدارة الحساب والاطلاع على بيانات الاشتراك وإعادة الاشتراك مستقبلاً.

إعادة الاشتراك بعد انتهاء التعاقد الحالي تعد دورة تعاقدية جديدة تبدأ من تاريخ التفعيل والدفع الجديد، ويجوز أن تتطلب قبول عقد أو شروط اشتراك جديدة بحسب النسخة السارية وقت إعادة الاشتراك.

عند الإنهاء النهائي ترسل NOVAIRE إلى البريد المسجل إشعارًا بتأكيد انتهاء الاشتراك، وتتيح الفاتورة أو الإيصال أو بيان التسوية النهائي المتاح بحسب حالة الحساب ومزود الدفع. وتظل المبالغ المستحقة قبل تاريخ الإنهاء واجبة السداد.

يجوز لـ NOVAIRE إنهاء الاتفاقية أو إيقاف الخدمة فورًا عند وجود مخالفة جوهرية أو خطر قانوني أو أمني أو إساءة استخدام، وفق ما يسمح به القانون.
"""
          if old not in s: raise SystemExit('agreement termination marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/nsr-cancellation-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/nsr-billing.js commercial/NSR1_CLIENT_AGREEMENT_TEMPLATE_AR.md .github/workflows/nsr-cancellation-lifecycle.yml
          git commit -m "Add cancellation lifecycle and end-of-contract notice" || exit 0
          git push
