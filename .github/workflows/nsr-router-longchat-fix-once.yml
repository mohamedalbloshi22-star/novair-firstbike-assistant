name: NSR Router Long Chat Fix One-Time

on:
  push:
    branches: [ui-refresh-light-v1]
    paths: [.github/workflows/nsr-router-longchat-fix-once.yml]

permissions:
  contents: write

jobs:
  patch-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-refresh-light-v1
          fetch-depth: 0
      - name: Remove long-conversation Sonnet trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/chat.js')
          s=p.read_text()
          s=s.replace('  const longConversation=Array.isArray(messages)&&messages.length>=10;\n  const complex=raw.length>220||longConversation||complexTerms.some(term=>q.includes(normalizeText(term)));','  const complex=raw.length>220||complexTerms.some(term=>q.includes(normalizeText(term)));')
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "NOVAIRE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add api/chat.js
          git rm .github/workflows/nsr-router-longchat-fix-once.yml
          git add -A
          git commit -m "Keep long NSR-1 chats on Haiku unless question is complex"
          git push origin ui-refresh-light-v1
