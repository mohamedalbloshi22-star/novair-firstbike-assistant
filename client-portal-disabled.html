<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVAIRE Client Portal</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#171717;
  color:#f5f1e8;
  font-family:Arial,Tahoma,sans-serif;
}
header{
  padding:20px 5%;
  background:#202020;
  border-bottom:1px solid #353535;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.brand h1{
  margin:0;
  color:#f2a93b;
  font-size:24px;
}
.brand div{
  margin-top:5px;
  color:#aaa;
  font-size:13px;
}
button{
  border:0;
  border-radius:8px;
  padding:10px 16px;
  cursor:pointer;
  font-weight:bold;
}
.logout{
  background:#333;
  color:white;
}
main{
  width:min(1200px,92%);
  margin:30px auto;
}
.welcome{
  margin-bottom:25px;
}
.welcome h2{
  margin-bottom:5px;
}
.welcome p{
  margin:0;
  color:#aaa;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}
.card{
  background:#232323;
  border:1px solid #353535;
  border-radius:12px;
  padding:20px;
}
.card .label{
  color:#aaa;
  font-size:13px;
}
.card .value{
  margin-top:10px;
  font-size:30px;
  font-weight:bold;
  color:#f2a93b;
}
section{
  margin-top:30px;
}
section h3{
  margin-bottom:15px;
}
table{
  width:100%;
  border-collapse:collapse;
  background:#232323;
  border-radius:10px;
  overflow:hidden;
}
th,td{
  padding:12px;
  border-bottom:1px solid #353535;
  text-align:right;
  font-size:13px;
}
th{
  background:#292929;
  color:#f2a93b;
}
.empty{
  color:#999;
  padding:20px;
  background:#232323;
  border-radius:10px;
}
#error{
  display:none;
  background:#3a2020;
  color:#ff9c90;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}
.loading{
  padding:50px;
  text-align:center;
  color:#aaa;
}
@media(max-width:650px){
  header{
    align-items:flex-start;
  }
  table{
    font-size:12px;
  }
  th,td{
    padding:8px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <h1>NOVAIRE</h1>
    <div>بوابة العميل</div>
  </div>

  <button class="logout" onclick="logout()">
    تسجيل الخروج
  </button>
</header>

<main>

<div id="loading" class="loading">
جاري تحميل البيانات...
</div>

<div id="error"></div>

<div id="content" style="display:none">

  <div class="welcome">
    <h2 id="clientName"></h2>
    <p>لوحة مؤشرات NOVAIRE Smart Response</p>
  </div>

  <div class="grid">

    <div class="card">
      <div class="label">إجمالي المحادثات</div>
      <div class="value" id="totalConversations">0</div>
    </div>

    <div class="card">
      <div class="label">نسبة الحل بالذكاء الاصطناعي</div>
      <div class="value" id="aiRate">0%</div>
    </div>

    <div class="card">
      <div class="label">طلبات التواصل</div>
      <div class="value" id="contacts">0</div>
    </div>

    <div class="card">
      <div class="label">الأسئلة غير المجابة</div>
      <div class="value" id="unanswered">0</div>
    </div>

    <div class="card">
      <div class="label">التحويل للموظف</div>
      <div class="value" id="handoffs">0</div>
    </div>

    <div class="card">
      <div class="label">طلبات الاتصال</div>
      <div class="value" id="callbacks">0</div>
    </div>

  </div>

  <section>
    <h3>استخدام اللغة</h3>

    <div class="grid">
      <div class="card">
        <div class="label">العربية</div>
        <div class="value" id="arabic">0%</div>
      </div>

      <div class="card">
        <div class="label">الإنجليزية</div>
        <div class="value" id="english">0%</div>
      </div>
    </div>
  </section>

  <section>
    <h3>أوقات الذروة</h3>
    <div id="peakHours"></div>
  </section>

  <section>
    <h3>آخر طلبات التواصل</h3>
    <div id="contactTable"></div>
  </section>

  <section>
    <h3>الأسئلة غير المجابة</h3>
    <div id="unansweredTable"></div>
  </section>

</div>

</main>

<script>

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadPortal(){

  try{

    const response = await fetch(
      "/api/client-portal",
      {
        method:"GET",
        credentials:"same-origin"
      }
    );

    if(response.status === 401){
      location.href="/client-login.html";
      return;
    }

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        data.error || "تعذر تحميل البيانات"
      );
    }

    document.getElementById("clientName").textContent =
      data.client.name;

    document.getElementById("totalConversations").textContent =
      data.stats.total_conversations;

    document.getElementById("aiRate").textContent =
      data.stats.ai_resolution_rate + "%";

    document.getElementById("contacts").textContent =
      data.stats.contact_requests;

    document.getElementById("unanswered").textContent =
      data.stats.unanswered_questions;

    document.getElementById("handoffs").textContent =
      data.stats.human_handoffs;

    document.getElementById("callbacks").textContent =
      data.stats.callback_requests;

    document.getElementById("arabic").textContent =
      data.languages.arabic_percent + "%";

    document.getElementById("english").textContent =
      data.languages.english_percent + "%";

    renderPeakHours(data.peak_hours);
    renderContacts(data.recent_contacts);
    renderUnanswered(data.recent_unanswered);

    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";

  }catch(error){

    document.getElementById("loading").style.display="none";

    const box=document.getElementById("error");
    box.style.display="block";
    box.textContent=
      "تعذر تحميل بوابة العميل. حاول مرة أخرى.";
  }
}

function renderPeakHours(items){

  const container =
    document.getElementById("peakHours");

  if(!items || !items.length){
    container.innerHTML =
      '<div class="empty">لا توجد بيانات كافية بعد.</div>';
    return;
  }

  let html="<table><tr><th>الساعة</th><th>المحادثات</th></tr>";

  items.forEach(item=>{
    html += `
      <tr>
        <td>${escapeHtml(item.hour)}:00</td>
        <td>${escapeHtml(item.conversations)}</td>
      </tr>
    `;
  });

  html+="</table>";
  container.innerHTML=html;
}

function renderContacts(items){

  const container =
    document.getElementById("contactTable");

  if(!items || !items.length){
    container.innerHTML =
      '<div class="empty">لا توجد طلبات تواصل.</div>';
    return;
  }

  let html=`
    <table>
      <tr>
        <th>الاسم</th>
        <th>الهاتف</th>
        <th>النوع</th>
        <th>الحالة</th>
      </tr>
  `;

  items.forEach(item=>{
    html += `
      <tr>
        <td>${escapeHtml(item.customer_name || "-")}</td>
        <td>${escapeHtml(item.phone || "-")}</td>
        <td>${escapeHtml(item.request_type || "-")}</td>
        <td>${escapeHtml(item.status || "-")}</td>
      </tr>
    `;
  });

  html+="</table>";
  container.innerHTML=html;
}

function renderUnanswered(items){

  const container =
    document.getElementById("unansweredTable");

  if(!items || !items.length){
    container.innerHTML =
      '<div class="empty">لا توجد أسئلة مسجلة.</div>';
    return;
  }

  let html=`
    <table>
      <tr>
        <th>السؤال</th>
        <th>الحالة</th>
      </tr>
  `;

  items.forEach(item=>{
    html += `
      <tr>
        <td>${escapeHtml(item.question)}</td>
        <td>${item.resolved ? "تمت المعالجة" : "بانتظار المعالجة"}</td>
      </tr>
    `;
  });

  html+="</table>";
  container.innerHTML=html;
}

function logout(){

  document.cookie =
    "novaire_client_session=; Max-Age=0; path=/";

  location.href="/client-login.html";
}

loadPortal();

</script>

</body>
</html>
