<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASEERA | طلبات التواصل</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#eef6fb;color:#10233f}.wrap{width:min(1050px,92%);margin:28px auto}.card{background:#fff;border:1px solid #d7e6ef;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 20px rgba(16,35,63,.05)}h1,h2{margin-top:0}.muted{color:#6b8094}.request{border:1px solid #dbe8f0;border-radius:14px;padding:16px;margin-top:12px;background:#fbfdff}.row{display:flex;gap:8px;flex-wrap:wrap}.status-btn{border:1px solid #cddce7;background:#fff;color:#0f5f91;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.status-btn.active{background:#0f6fa6;color:#fff;border-color:#0f6fa6}.status-btn:disabled{opacity:.5;cursor:wait}.top-btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.back{background:#e7f0f6;color:#17304e}.logout{background:#a13a33;color:#fff}.msg{margin-top:9px;font-size:13px}.ok{color:#16765f}.bad{color:#a13a33}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf5fa;color:#0f5f91;font-size:12px;font-weight:700}select{width:100%;padding:11px;border:1px solid #d1e1ec;border-radius:10px;background:#fff;margin-top:8px}.brand-logo{width:220px;max-width:60vw;height:auto;margin-bottom:10px}@media(max-width:650px){.status-btn{flex:1 1 45%}}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><img class="brand-logo" src="/baseera-logo.svg" alt="BASEERA Digital Solutions"><h2>طلبات التواصل</h2><label>العميل</label><select id="clientSelect"></select><div class="row" style="margin-top:12px"><button class="top-btn back" onclick="location='/control.html'">لوحة التحكم</button><button class="top-btn logout" onclick="logout()">تسجيل الخروج</button></div></div>
<div id="message" class="card" style="display:none"></div>
<div class="card"><div id="count" class="muted"></div><div id="list">جاري التحميل...</div></div>
</div>
<script>
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(r.status===401){location='/control.html';throw Error('Unauthorized')}if(!r.ok)throw Error(d.error||d.details||'تعذر تنفيذ الطلب');return d}async function checkAuth(){const r=await fetch('/api/admin-auth',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.authenticated){location='/control.html';return false}return true}function statusLabel(s){return({new:'جديد',in_progress:'قيد التنفيذ',completed:'مكتمل',closed:'مغلق'})[s]||'جديد'}function typeLabel(t){return t==='callback'?'طلب اتصال':'التحدث مع مسؤول'}function showMessage(t,ok=true){const b=$('message');b.style.display='block';b.textContent=t;b.className='card '+(ok?'ok':'bad');setTimeout(()=>b.style.display='none',2200)}async function loadClients(){const d=await api('/api/client-admin',{action:'list'});const clients=d.clients||[];$('clientSelect').innerHTML=clients.map(c=>`<option value="${esc(c.slug)}">${esc(c.name||c.slug)}</option>`).join('');const wanted=new URLSearchParams(location.search).get('client')||localStorage.getItem('novaire_control_client');if(wanted&&[...$('clientSelect').options].some(o=>o.value===wanted))$('clientSelect').value=wanted;await loadRequests()}async function loadRequests(){const slug=$('clientSelect').value;if(!slug)return;localStorage.setItem('novaire_control_client',slug);const d=await api('/api/contact-admin',{action:'list',client_slug:slug});const items=d.requests||[];$('count').textContent=`إجمالي الطلبات: ${items.length}`;if(!items.length){$('list').innerHTML='<p class="muted">لا توجد طلبات.</p>';return}$('list').innerHTML=items.map(x=>`<div class="request"><span class="badge">${esc(statusLabel(x.status))}</span><h3>${esc(typeLabel(x.request_type))}</h3><p><b>الاسم:</b> ${esc(x.customer_name||'—')}</p><p><b>الهاتف:</b> ${esc(x.phone||'—')}</p><p><b>السبب:</b> ${esc(x.reason||'—')}</p><div class="muted">اختر الحالة:</div><div class="row" style="margin-top:8px">${['new','in_progress','completed','closed'].map(s=>`<button class="status-btn ${x.status===s?'active':''}" onclick="setStatus('${esc(x.id)}','${s}',this)">${statusLabel(s)}</button>`).join('')}</div><div id="m-${esc(x.id)}" class="msg"></div></div>`).join('')}async function setStatus(id,status,btn){const parent=btn.parentElement;[...parent.querySelectorAll('button')].forEach(b=>b.disabled=true);const m=$(`m-${id}`);m.textContent='جاري الحفظ...';m.className='msg';try{await api('/api/contact-admin',{action:'update_status',client_slug:$('clientSelect').value,request_id:id,status});m.textContent='تم تحديث الحالة ✓';m.className='msg ok';setTimeout(loadRequests,400)}catch(e){m.textContent=e.message;m.className='msg bad';[...parent.querySelectorAll('button')].forEach(b=>b.disabled=false)}}async function logout(){await fetch('/api/admin-auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});location='/control.html'}$('clientSelect').onchange=loadRequests;(async()=>{if(!(await checkAuth()))return;await loadClients()})().catch(e=>showMessage(e.message,false));
</script>
</body>
</html>
