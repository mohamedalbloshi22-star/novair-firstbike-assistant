<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVAIRE | طلبات التواصل</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f6f8;
  color:#1f2937
}
.container{
  max-width:1050px;
  margin:auto;
  padding:24px
}
.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06)
}
.request{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  background:#fafafa
}
input,select,button{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
  margin:6px 0 12px
}
button{
  border:0;
  cursor:pointer;
  font-weight:bold
}
.primary{
  background:#111827;
  color:white
}
.secondary{
  background:#e5e7eb;
  color:#111827
}
.success{
  background:#047857;
  color:white
}
.danger{
  background:#b91c1c;
  color:white
}
.muted{
  color:#6b7280;
  font-size:14px
}
.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  background:#e5e7eb
}
.top-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
#app{
  display:none
}
#loadingBox{
  max-width:420px;
  margin:90px auto;
  text-align:center
}
#message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px
}
#message.ok{
  display:block;
  background:#d1fae5;
  color:#065f46
}
#message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b
}
@media(max-width:700px){
  .top-actions{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loadingBox">
<h1>NOVAIRE</h1>
<h2>طلبات التواصل</h2>
<p class="muted">جاري التحقق من جلسة الإدارة...</p>
</div>


<div id="app">

<div id="message"></div>

<div class="card">

<h1>NOVAIRE</h1>
<h2>طلبات التواصل</h2>

<label>العميل</label>

<select id="clientSelect" onchange="clientChanged()">
<option value="">اختر العميل</option>
</select>

<div class="top-actions">

<button
class="secondary"
onclick="goControl()">
لوحة التحكم
</button>

<button
class="danger"
onclick="logout()">
تسجيل الخروج
</button>

</div>

</div>


<div class="card">

<h2>طلبات التواصل</h2>

<div id="count" class="muted"></div>

<div id="list">
جاري التحميل...
</div>

</div>

</div>
</div>


<script>

function requestedClient(){

  return (
    new URLSearchParams(
      window.location.search
    ).get("client") || ""
  )
    .trim()
    .toLowerCase();
}


/*
================================
AUTH
================================
*/

async function checkAuth(){

  try{

    const response =
      await fetch(
        "/api/admin-auth",
        {
          method:"GET",
          credentials:"same-origin",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.authenticated
    ){

      window.location.href =
        "/control.html";

      return false;
    }

    return true;

  }catch{

    window.location.href =
      "/control.html";

    return false;
  }
}


async function logout(){

  try{

    await fetch(
      "/api/admin-auth",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        credentials:"same-origin",

        body:JSON.stringify({
          action:"logout"
        })
      }
    );

  }catch{}

  window.location.href =
    "/control.html";
}


function goControl(){

  window.location.href =
    "/control.html";
}


/*
================================
API
================================
*/

async function api(
  url,
  payload
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        credentials:"same-origin",

        body:JSON.stringify(
          payload
        )
      }
    );

  let data = {};

  try{
    data =
      await response.json();
  }catch{}

  if(!response.ok){

    if(
      response.status === 401
    ){

      window.location.href =
        "/control.html";
    }

    throw new Error(
      data.error ||
      data.details ||
      "حدث خطأ"
    );
  }

  return data;
}


/*
================================
MESSAGE
================================
*/

function showMessage(
  text,
  type="ok"
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    type;

  box.style.display =
    "block";

  setTimeout(
    ()=>{
      box.style.display =
        "none";
    },
    3000
  );
}


/*
================================
LOAD CLIENTS
================================
*/

async function loadClients(){

  const data =
    await api(
      "/api/client-admin",
      {
        action:"list"
      }
    );

  const clients =
    Array.isArray(data.clients)
      ? data.clients
      : Array.isArray(data.items)
        ? data.items
        : Array.isArray(data)
          ? data
          : [];

  const select =
    document.getElementById(
      "clientSelect"
    );

  select.innerHTML =
    '<option value="">اختر العميل</option>';


  clients.forEach(
    client=>{

      if(!client?.slug){
        return;
      }

      const option =
        document.createElement(
          "option"
        );

      option.value =
        String(
          client.slug
        )
        .trim()
        .toLowerCase();

      option.textContent =
        client.name ||
        client.config?.brand_name ||
        client.slug;

      select.appendChild(
        option
      );
    }
  );


  const wanted =
    requestedClient();


  if(wanted){

    const exists =
      clients.some(
        client =>
          String(
            client.slug || ""
          )
          .trim()
          .toLowerCase() ===
          wanted
      );

    if(exists){

      select.value =
        wanted;

      await loadRequests();

      return;
    }
  }


  if(clients.length){

    select.value =
      String(
        clients[0].slug
      )
      .trim()
      .toLowerCase();

    await loadRequests();

  }else{

    document.getElementById(
      "list"
    ).innerHTML =
      "لا يوجد عملاء.";
  }
}


/*
================================
CLIENT CHANGE
================================
*/

async function clientChanged(){

  const slug =
    document.getElementById(
      "clientSelect"
    ).value;

  if(slug){

    const url =
      new URL(
        window.location.href
      );

    url.searchParams.set(
      "client",
      slug
    );

    history.replaceState(
      {},
      "",
      url.pathname +
      url.search
    );
  }

  await loadRequests();
}


/*
================================
LOAD REQUESTS
================================
*/

async function loadRequests(){

  const slug =
    document.getElementById(
      "clientSelect"
    ).value;

  const list =
    document.getElementById(
      "list"
    );

  const count =
    document.getElementById(
      "count"
    );


  if(!slug){

    list.innerHTML =
      "اختر العميل.";

    count.textContent =
      "";

    return;
  }


  list.innerHTML =
    "جاري التحميل...";


  try{

    const data =
      await api(
        "/api/contact-admin",
        {
          action:"list",
          client_slug:slug
        }
      );

    const items =
      Array.isArray(
        data.requests
      )
        ? data.requests
        : [];

    count.textContent =
      "إجمالي الطلبات: " +
      items.length;

    render(items);

  }catch(error){

    list.innerHTML = "";

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
================================
RENDER
================================
*/

function render(items){

  const list =
    document.getElementById(
      "list"
    );

  list.innerHTML = "";


  if(!items.length){

    list.innerHTML =
      '<p class="muted">لا توجد طلبات تواصل لهذا العميل.</p>';

    return;
  }


  items.forEach(
    item=>{

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "request";


      const type =
        item.request_type ===
        "callback"
          ? "طلب معاودة اتصال"
          : "طلب التواصل مع موظف";


      const date =
        item.created_at
          ? new Date(
              item.created_at
            ).toLocaleString(
              "ar-AE"
            )
          : "";


      div.innerHTML = `

<span class="badge">
${escapeHtml(
  statusLabel(
    item.status
  )
)}
</span>

<h3>
${escapeHtml(type)}
</h3>

<p>
<strong>الاسم:</strong>
${escapeHtml(
  item.customer_name || ""
)}
</p>

<p>
<strong>الهاتف:</strong>
${escapeHtml(
  item.phone || ""
)}
</p>

<p>
<strong>السبب:</strong>
${escapeHtml(
  item.reason ||
  "غير محدد"
)}
</p>

<p class="muted">
${escapeHtml(date)}
</p>

<label>حالة الطلب</label>

<select id="status-${item.id}">

<option
value="new"
${item.status==="new"
  ? "selected"
  : ""}>
جديد
</option>

<option
value="in_progress"
${item.status==="in_progress"
  ? "selected"
  : ""}>
قيد المتابعة
</option>

<option
value="completed"
${item.status==="completed"
  ? "selected"
  : ""}>
مكتمل
</option>

<option
value="closed"
${item.status==="closed"
  ? "selected"
  : ""}>
مغلق
</option>

</select>

<button
class="success"
onclick="updateStatus('${item.id}')">
حفظ الحالة
</button>
`;

      list.appendChild(
        div
      );
    }
  );
}


/*
================================
STATUS LABEL
================================
*/

function statusLabel(status){

  if(
    status ===
    "in_progress"
  ){
    return "قيد المتابعة";
  }

  if(
    status ===
    "completed"
  ){
    return "مكتمل";
  }

  if(
    status ===
    "closed"
  ){
    return "مغلق";
  }

  return "جديد";
}


/*
================================
UPDATE STATUS
================================
*/

async function updateStatus(id){

  const slug =
    document.getElementById(
      "clientSelect"
    ).value;

  const status =
    document.getElementById(
      "status-"+id
    ).value;


  try{

    await api(
      "/api/contact-admin",
      {
        action:
          "update_status",

        client_slug:
          slug,

        request_id:
          id,

        status
      }
    );

    showMessage(
      "تم تحديث الحالة."
    );

    await loadRequests();

  }catch(error){

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
================================
ESCAPE
================================
*/

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/*
================================
START
================================
*/

async function start(){

  const authenticated =
    await checkAuth();

  if(!authenticated){
    return;
  }

  document.getElementById(
    "loadingBox"
  ).style.display =
    "none";

  document.getElementById(
    "app"
  ).style.display =
    "block";


  try{

    await loadClients();

  }catch(error){

    showMessage(
      error.message,
      "error"
    );
  }
}


start();

</script>

</body>
</html>
