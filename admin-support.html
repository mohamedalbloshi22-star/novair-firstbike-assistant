<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASEERA | دعم العملاء</title><link rel="stylesheet" href="/novaire-light.css"><style>.wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:10px;border-bottom:1px solid #dfe8ef;text-align:right;vertical-align:top}.tbl th{background:#f5f9fc}.reply{width:100%;min-width:240px;min-height:80px;border:1px solid #cfdce7;border-radius:8px;padding:9px}.small{font-size:12px;color:#64798d}.brand{display:flex;align-items:center;gap:12px}.brand img{width:150px;height:64px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.brand h1{margin:0}.brand small{display:block;color:#cbd5e1;margin-top:3px}</style></head><body><header class="nv-header"><div class="nv-header-inner"><div class="brand"><img src="/baseera-logo.svg" alt="BASEERA | بصيرة للحلول الرقمية"><div><h1>BASEERA | بصيرة — دعم العملاء</h1><small>بصيرة للحلول الرقمية · BASEERA Digital Solutions</small></div></div><p>استفسارات BSR-1 المحولة للإدارة</p></div></header><main class="nv-container"><section class="nv-panel"><div class="nv-row"><div style="flex:1;min-width:230px"><label><b>العميل</b></label><select id="client" class="nv-select"></select></div><div class="nv-actions"><button id="refresh" class="nv-btn">تحديث</button><button class="nv-btn secondary" onclick="location='/admin-light.html'">العودة للوحة الإدارة</button></div></div></section><section class="nv-section"><h2>طلبات الدعم</h2><div id="list">جاري التحميل...</div></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(r.status===401){location='/control.html';throw Error('Unauthorized')}if(!r.ok)throw Error(d.error||'تعذر تنفيذ الطلب');return d}async function clients(){const d=await api('/api/client-admin',{action:'list'});return d.clients||[]}async function load(){const slug=$('client').value;if(!slug)return;const d=await api('/api/support-admin',{action:'list',client_slug:slug});const rows=d.requests||[];if(!rows.length){$('list').innerHTML='<div class="nv-message">لا توجد طلبات دعم.</div>';return}$('list').innerHTML=`<div class="wrap"><table class="tbl"><thead><tr><th>الاستفسار</th><th>الحالة</th><th>الرد</th><th>الإجراء</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.message)}<div class="small">${esc(x.created_at||'')}</div></td><td>${esc(x.status)}</td><td><textarea id="r-${esc(x.id)}" class="reply">${esc(x.admin_reply||'')}</textarea></td><td><button class="nv-btn" onclick="reply('${esc(x.id)}')">إرسال الرد</button></td></tr>`).join('')}</tbody></table></div>`}async function reply(id){const text=$(`r-${id}`).value.trim();if(text.length<2)return alert('اكتب الرد أولًا');await api('/api/support-admin',{action:'reply',client_slug:$('client').value,request_id:id,reply:text});await load()}async function start(){const c=await clients();$('client').innerHTML=c.map(x=>`<option value="${esc(x.slug)}">${esc(x.name||x.slug)}</option>`).join('');await load()}$('client').onchange=load;$('refresh').onclick=load;start();</script></body></html>
