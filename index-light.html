<style>
:root{--navy:#0b2c5f;--blue:#1769e0;--sky:#49b8ff;--teal:#19b8a6;--bg:#f4f9ff;--line:#d8e8f7;--text:#17304e;--muted:#6d839b;--shadow:0 18px 50px rgba(35,90,145,.14);--chat-vh:calc(100dvh - 34px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);font-family:Arial,Tahoma,sans-serif;background:linear-gradient(180deg,#fbfdff 0%,var(--bg) 100%);min-height:100vh}button,input{font-family:inherit}.topbar{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;text-align:center;padding:9px 14px;font-size:11px;font-weight:700}.container{width:min(900px,calc(100% - 28px));margin:auto;padding:18px 0 120px}.language-area{display:flex;justify-content:flex-end;margin-bottom:14px}html[dir="ltr"] .language-area{justify-content:flex-start}.language-switch{display:flex;background:#fff;border:1px solid var(--line);padding:4px;border-radius:14px}.lang-btn{border:0;padding:9px 15px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.lang-btn.active{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff}.hero{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:15px}.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;background:#fff}.subtitle{color:var(--blue);font-size:14px;font-weight:700;margin-top:6px}h1{margin:0;font-size:31px;color:var(--navy)}.info{color:var(--muted);font-size:14px;line-height:1.9;margin-top:20px;padding:14px 16px;border-radius:16px;background:#f4f9ff;border:1px solid #deedfa}.section{margin-top:22px}.section h2{font-size:19px;color:var(--navy);margin:0 0 12px}.price-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}.price{background:#fff3cb;border:1px solid #f4d27c;color:#7a5612;padding:7px 12px;border-radius:11px;font-size:13px;font-weight:800}.services{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.service{border:1px solid #cfe6f7;background:#fff;color:var(--navy);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700}.note{margin-top:20px;border:1px solid #d5ece7;background:#f4fffc;padding:16px;border-radius:17px;line-height:1.8;color:#55768a;font-size:14px}.loading-screen,.error-screen{text-align:center;padding:80px 20px;color:var(--muted)}.error-screen{color:#c85050}.chat-launcher{position:fixed;left:22px;bottom:22px;border:0;border-radius:18px;padding:14px 18px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-weight:800;cursor:pointer;z-index:20;box-shadow:0 18px 38px rgba(23,105,224,.30)}html[dir="ltr"] .chat-launcher{left:auto;right:22px}.chat{position:fixed;left:22px;bottom:22px;width:min(430px,calc(100vw - 30px));height:min(700px,var(--chat-vh));max-height:var(--chat-vh);background:#fff;border:1px solid #d3e7f7;border-radius:24px;overflow:hidden;display:none;flex-direction:column;z-index:30;box-shadow:0 28px 80px rgba(18,67,115,.25)}html[dir="ltr"] .chat{left:auto;right:22px}.chat.open{display:flex}.chat-header{flex:0 0 auto;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:15px 17px;display:flex;justify-content:space-between;align-items:center}.chat-header-title{font-weight:800;font-size:15px}.status{color:#d7efff;font-size:11px;margin-top:4px}.close-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);width:34px;height:34px;border-radius:11px;color:#fff;font-size:21px;cursor:pointer}.chat-body{flex:1 1 auto;min-height:0;padding:15px;overflow-y:auto;overscroll-behavior:contain;background:#f7fbff;display:flex;flex-direction:column;gap:10px;scrollbar-gutter:stable}.msg{max-width:86%;border-radius:17px;padding:11px 13px;line-height:1.65;font-size:14px;word-break:break-word}.msg.bot{align-self:flex-start;background:#fff;border:1px solid #dbeaf6}.msg.user{align-self:flex-end;background:linear-gradient(135deg,#1769e0,#2c8df2);color:#fff}.typing{align-self:flex-start;color:var(--muted);background:#fff;border:1px solid #dbeaf6;padding:9px 12px;border-radius:14px;font-size:13px}.quick-area,.contact-actions,.contact-form,.input-area,.powered{flex:0 0 auto}.quick-area{padding:9px 12px;background:#f7fbff;display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid #edf4fa;max-height:94px;overflow-y:auto}.quick-btn{background:#fff;border:1px solid #cfe3f4;color:var(--blue);border-radius:999px;padding:7px 11px;cursor:pointer;font-size:12px;font-weight:700}.contact-actions{padding:9px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f7fbff}.contact-action-btn{border:1px solid #d5e6f3;background:#fff;color:var(--navy);border-radius:12px;padding:10px 8px;cursor:pointer;font-size:12px;font-weight:800}.contact-form{margin:0 12px 9px;padding:13px;background:#f8fbfe;border:1px solid #d9e9f5;border-radius:15px;max-height:46%;overflow-y:auto}.contact-form input{width:100%;background:#fff;border:1px solid #d1e2ef;border-radius:11px;padding:10px 11px;margin-bottom:8px}.privacy-note{color:var(--muted);font-size:10px;margin:2px 0 9px}.contact-form-buttons{display:flex;gap:7px}.contact-form-buttons button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:800}.submit-contact{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff}.cancel-contact{background:#e8f0f6;color:#536b7e}.contact-message{margin-top:8px;font-size:12px}.input-area{padding:11px;padding-bottom:max(11px,env(safe-area-inset-bottom));border-top:1px solid #dbeaf4;display:flex;gap:8px;background:#fff;position:relative;z-index:3}.input-area input{min-width:0;flex:1;border:1px solid #cfdfeb;background:#fbfdff;border-radius:13px;padding:11px 12px}.input-area button{flex:0 0 44px;border:0;width:44px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;font-size:18px}.powered{padding:7px 12px;text-align:center;font-size:10px;color:#75879a;background:#fff;border-top:1px solid #edf2f7}.powered a{color:#54708c;text-decoration:none}@media(max-width:560px){.container{width:min(100% - 20px,900px)}.hero{padding:20px}.chat{left:10px;bottom:10px;width:calc(100vw - 20px);height:var(--chat-vh);max-height:var(--chat-vh);border-radius:18px}html[dir="ltr"] .chat{right:10px;left:auto}.quick-area{max-height:78px}}
</style></head><body>
<div class="topbar" id="topbar">NOVAIRE Smart Response</div><main class="container"><div class="loading-screen" id="loadingScreen">جاري تحميل بيانات المنشأة...</div><div id="clientContent" style="display:none"><div class="language-area"><div class="language-switch"><button id="arabicBtn" class="lang-btn">العربية</button><button id="englishBtn" class="lang-btn">English</button></div></div><header class="hero"><div class="brand"><div class="logo" id="logo">NV</div><div><h1 id="businessName"></h1><div class="subtitle" id="subtitle"></div></div></div><div class="info" id="info"></div></header><section class="section" id="pricesSection"><h2 id="pricesTitle"></h2><div id="pricesContainer"></div></section><div class="services" id="servicesContainer"></div><div class="note" id="note"></div></div></main>
<button class="chat-launcher" id="launcher" style="display:none"></button><section class="chat" id="chat"><div class="chat-header"><div><div class="chat-header-title" id="chatName"></div><div class="status" id="chatStatus"></div></div><button class="close-btn" id="closeBtn">×</button></div><div class="chat-body" id="chatBody"></div><div class="quick-area" id="quickArea"></div><div class="contact-actions"><button id="humanBtn" class="contact-action-btn"></button><button id="callbackBtn" class="contact-action-btn"></button></div><div class="contact-form" id="contactForm" style="display:none"><div id="contactFormTitle" style="font-weight:800;margin-bottom:10px"></div><input id="customerName"><input id="customerPhone" inputmode="tel"><input id="contactReason"><div class="privacy-note" id="privacyNote"></div><div class="contact-form-buttons"><button id="submitContactBtn" class="submit-contact"></button><button id="cancelContactBtn" class="cancel-contact"></button></div><div class="contact-message" id="contactMessage"></div></div><div class="input-area"><input id="messageInput" autocomplete="off"><button id="sendBtn">➤</button></div><div class="powered" id="powered"></div></section>
<script>
const urlParams=new URLSearchParams(location.search);let clientSlug=String(urlParams.get('client')||'first-bike').trim().toLowerCase();if(!/^[a-z0-9_-]{2,80}$/.test(clientSlug))clientSlug='first-bike';let clientConfig=null;const translations={ar:{dir:'rtl',topbar:'مدعوم بواسطة NOVAIRE Smart Response',launcher:'✦ تحدث مع المساعد الذكي',chatStatus:'متصل الآن',placeholder:'اكتب سؤالك هنا...',typing:'يكتب...',error:'عذرًا، حدث خطأ. حاول مرة أخرى.',limit:'تم الوصول إلى الحد الشهري لردود المساعد الذكي.',rateLimit:'تم إرسال طلبات كثيرة خلال وقت قصير. حاول مرة أخرى بعد قليل.',humanBtn:'👤 التحدث مع مسؤول',callbackBtn:'📞 طلب اتصال',submit:'إرسال الطلب',cancel:'إلغاء',powered:'NOVAIRE | نوفاير للحلول المتكاملة',quickQuestions:[{key:'location',label:'📍 الموقع',message:'وين موقعكم؟'},{key:'hours',label:'🕒 أوقات الدوام',message:'ما هي أوقات الدوام؟'},{key:'services',label:'🧾 الخدمات',message:'ما هي الخدمات التي تقدمونها؟'},{key:'prices',label:'💰 الأسعار',message:'ما هي الأسعار؟'}]},en:{dir:'ltr',topbar:'Powered by NOVAIRE Smart Response',launcher:'✦ Chat with Smart Assistant',chatStatus:'Online now',placeholder:'Type your question here...',typing:'Typing...',error:'Sorry, something went wrong.',limit:'The monthly AI response limit has been reached.',rateLimit:'Too many requests were sent in a short time. Please try again shortly.',humanBtn:'👤 Talk to a person',callbackBtn:'📞 Request a callback',submit:'Send request',cancel:'Cancel',powered:'NOVAIRE Integrated Solutions',quickQuestions:[{key:'location',label:'📍 Location',message:'Where are you located?'},{key:'hours',label:'🕒 Opening hours',message:'What are your opening hours?'},{key:'services',label:'🧾 Services',message:'What services do you provide?'},{key:'prices',label:'💰 Prices',message:'What are your prices?'}]}};let language=localStorage.getItem('novaire_language')||'ar';const SESSION_TIMEOUT=30*60*1000,sessionStorageKey=`novaire_session_${clientSlug}_v7`,activityStorageKey=`novaire_session_activity_${clientSlug}_v7`;let sessionId='',lastActivity=0,history=[],selectedContactType=null;const $=id=>document.getElementById(id),loadingScreen=$('loadingScreen'),clientContent=$('clientContent'),chat=$('chat'),chatBody=$('chatBody'),launcher=$('launcher'),messageInput=$('messageInput'),sendBtn=$('sendBtn'),quickArea=$('quickArea'),contactForm=$('contactForm'),customerName=$('customerName'),customerPhone=$('customerPhone'),contactReason=$('contactReason'),contactMessage=$('contactMessage'),submitContactBtn=$('submitContactBtn'),contactActions=document.querySelector('.contact-actions');
function syncViewport(){const h=window.visualViewport?window.visualViewport.height:window.innerHeight;document.documentElement.style.setProperty('--chat-vh',`${Math.max(300,h-20)}px`)}syncViewport();window.addEventListener('resize',syncViewport);window.visualViewport?.addEventListener('resize',()=>{syncViewport();requestAnimationFrame(()=>{chatBody.scrollTop=chatBody.scrollHeight})});
function uuid(){return window.crypto?.randomUUID?`${clientSlug}-${crypto.randomUUID()}`:`${clientSlug}-${Date.now()}`}function createNewSession(){sessionId=uuid();lastActivity=Date.now();sessionStorage.setItem(sessionStorageKey,sessionId);sessionStorage.setItem(activityStorageKey,String(lastActivity));history=[];chatBody.innerHTML=''}function loadSession(){const s=sessionStorage.getItem(sessionStorageKey),a=Number(sessionStorage.getItem(activityStorageKey)||0);if(!s||!a||Date.now()-a>SESSION_TIMEOUT)createNewSession();else{sessionId=s;lastActivity=a}}function markActivity(){lastActivity=Date.now();sessionStorage.setItem(activityStorageKey,String(lastActivity))}async function loadClientConfig(){const r=await fetch(`/api/client-config?client=${encodeURIComponent(clientSlug)}`,{cache:'no-store'});if(!r.ok)throw new Error('config');const d=await r.json();clientConfig=d.client;if(!localStorage.getItem('novaire_language'))language=clientConfig.default_language==='en'?'en':'ar'}function localized(k){return String(clientConfig?.[`${k}${language==='en'?'_en':'_ar'}`]||'').trim()}function businessName(){return String(clientConfig?.brand_name||clientConfig?.name||'NOVAIRE Client').trim()}function assistantName(){return String((language==='en'?clientConfig?.assistant_name_en:clientConfig?.assistant_name_ar)||businessName()).trim()}function initials(n){return String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'NV'}function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function fmt(t){return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}function norm(t){return String(t||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}
function render(){const t=translations[language],name=businessName();document.documentElement.dir=t.dir;document.documentElement.lang=language;$('topbar').textContent=t.topbar;$('businessName').textContent=name;const logo=$('logo'),url=String(clientConfig?.logo_url||'').trim();logo.innerHTML=url?`<img src="${esc(url)}" alt="${esc(name)}" onerror="this.parentElement.textContent='${esc(initials(name))}'">`:esc(initials(name));$('subtitle').textContent=localized('business_type');const lines=[];if(localized('location'))lines.push(`<strong>${language==='en'?'Location':'الموقع'}:</strong> ${esc(localized('location'))}`);if(localized('working_hours'))lines.push(`<strong>${language==='en'?'Hours':'الدوام'}:</strong> ${esc(localized('working_hours'))}`);$('info').innerHTML=lines.join('<br>');const prices=Array.isArray(clientConfig.rental_prices)?clientConfig.rental_prices:[];$('pricesTitle').textContent=language==='en'?'Prices':'الأسعار';$('pricesContainer').innerHTML=prices.map(x=>`<div class="price-row"><strong>${esc(x.label||'')}</strong><span class="price">${esc(x.price??'')} ${esc(language==='en'?x.unit_en||'':x.unit_ar||'')}</span></div>`).join('');$('pricesSection').style.display=prices.length?'block':'none';const services=Array.isArray(clientConfig[language==='en'?'services_en':'services_ar'])?clientConfig[language==='en'?'services_en':'services_ar']:[];$('servicesContainer').innerHTML=services.map(x=>`<span class="service">${esc(x)}</span>`).join('');const note=localized('notes');$('note').style.display=note?'block':'none';$('note').textContent=note;launcher.textContent=t.launcher;$('chatName').textContent=assistantName();$('chatStatus').textContent=t.chatStatus;messageInput.placeholder=t.placeholder;$('humanBtn').textContent=t.humanBtn;$('callbackBtn').textContent=t.callbackBtn;submitContactBtn.textContent=t.submit;$('cancelContactBtn').textContent=t.cancel;$('contactFormTitle').textContent=language==='en'?'Contact details':'بيانات التواصل';customerName.placeholder=language==='en'?'Name':'الاسم';customerPhone.placeholder=language==='en'?'Phone number':'رقم الهاتف';contactReason.placeholder=language==='en'?'Reason for contact (optional)':'سبب التواصل (اختياري)';$('privacyNote').textContent=language==='en'?'Your details will be used only to follow up this request.':'ستستخدم بياناتك فقط لمتابعة هذا الطلب.';$('powered').innerHTML=`${esc(t.powered)} · <a href="mailto:${esc(clientConfig?.novaire_email||'info@novaire.ae')}">${esc(clientConfig?.novaire_email||'info@novaire.ae')}</a>`;$('arabicBtn').classList.toggle('active',language==='ar');$('englishBtn').classList.toggle('active',language==='en');renderQuick()}
function welcome(){const c=language==='en'?clientConfig?.welcome_message_en:clientConfig?.welcome_message_ar;return String(c||'').trim()||(language==='en'?`Hi 👋 I'm ${assistantName()}. How can I help you?`:`هلا فيك 👋 أنا ${assistantName()}. كيف أقدر أساعدك؟`)}function addMessage(text,sender){const d=document.createElement('div');d.className='msg '+sender;d.innerHTML=fmt(text);chatBody.appendChild(d);requestAnimationFrame(()=>{chatBody.scrollTop=chatBody.scrollHeight});return d}function showTyping(){removeTyping();const d=document.createElement('div');d.id='typing';d.className='typing';d.textContent=translations[language].typing;chatBody.appendChild(d);chatBody.scrollTop=chatBody.scrollHeight}function removeTyping(){$('typing')?.remove()}
function directAnswer(kind){const location=localized('location'),hours=localized('working_hours'),services=Array.isArray(clientConfig?.[language==='en'?'services_en':'services_ar'])?clientConfig[language==='en'?'services_en':'services_ar']:[],prices=Array.isArray(clientConfig?.rental_prices)?clientConfig.rental_prices:[];if(kind==='location'&&location)return language==='en'?`Our location: ${location}`:`موقعنا: ${location}`;if(kind==='hours'&&hours)return language==='en'?`Opening hours: ${hours}`:`أوقات الدوام: ${hours}`;if(kind==='services'&&services.length)return language==='en'?`Our services: ${services.join(', ')}`:`خدماتنا: ${services.join('، ')}`;if(kind==='prices'&&prices.length){const rows=prices.filter(x=>String(x?.label||'').trim()&&x?.price!==undefined&&x?.price!==null).map(x=>`${x.label}: ${x.price}${language==='en'?(x.unit_en?` ${x.unit_en}`:''):(x.unit_ar?` ${x.unit_ar}`:'')}`);if(rows.length)return (language==='en'?'Prices:\n':'الأسعار:\n')+rows.join('\n')}return ''}
function detectDirect(q){const x=norm(q);const has=arr=>arr.some(v=>x.includes(norm(v)));if(has(language==='en'?['location','located','address','where are you']:['الموقع','موقعكم','العنوان','وين موقع','اين موقع']))return'location';if(has(language==='en'?['opening hours','working hours','hours','open','close']:['اوقات الدوام','ساعات الدوام','الدوام','متى تفتح','متى تسكر','متى تغلق']))return'hours';if(has(language==='en'?['services','what do you provide','what do you offer']:['الخدمات','خدماتكم','ماذا تقدمون','شو تقدمون']))return'services';if(has(language==='en'?['price','prices','cost','how much']:['السعر','الاسعار','كم السعر','التكلفه']))return'prices';return''}
function answerInstant(kind,question){const a=directAnswer(kind);if(!a)return false;markActivity();addMessage(question,'user');addMessage(a,'bot');history.push({role:'user',content:question},{role:'assistant',content:a});messageInput.value='';messageInput.focus();return true}
function renderQuick(){quickArea.innerHTML='';translations[language].quickQuestions.forEach(x=>{const b=document.createElement('button');b.className='quick-btn';b.textContent=x.label;b.onclick=()=>{if(!answerInstant(x.key,x.message))sendMessage(x.message)};quickArea.appendChild(b)})}function changeLanguage(l){language=l;localStorage.setItem('novaire_language',l);render()}function openContactForm(type){selectedContactType=type;contactMessage.textContent='';contactForm.style.display='block';quickArea.style.display='none';contactActions.style.display='none';requestAnimationFrame(()=>{customerName.focus();chatBody.scrollTop=chatBody.scrollHeight})}function closeContactForm(){contactForm.style.display='none';selectedContactType=null;quickArea.style.display='flex';contactActions.style.display='grid';messageInput.focus()}
async function submitContact(){const name=customerName.value.trim(),phone=customerPhone.value.trim();if(!name||!phone){contactMessage.textContent=language==='en'?'Name and phone are required.':'الاسم ورقم الهاتف مطلوبان.';return}submitContactBtn.disabled=true;try{const response=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_slug:clientSlug,session_id:sessionId,request_type:selectedContactType,customer_name:name,phone,reason:contactReason.value.trim(),language})});if(!response.ok){let detail='';try{const d=await response.json();detail=String(d?.error||d?.details||'').trim()}catch{}throw new Error(detail||('HTTP '+response.status))}contactMessage.textContent=language==='en'?'Request sent ✓':'تم تسجيل طلبك ✓';setTimeout(closeContactForm,1000)}catch(error){contactMessage.textContent=language==='en'?'Could not send the request. Please try again.':'تعذر إرسال الطلب. حاول مرة أخرى.'}finally{submitContactBtn.disabled=false}}
async function readStream(r,msg){const reader=r.body.getReader(),decoder=new TextDecoder();let answer='',buffer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){if(!line.trim())continue;try{const e=JSON.parse(line);if(e.type==='delta'){removeTyping();answer+=e.text||'';msg.innerHTML=fmt(answer);chatBody.scrollTop=chatBody.scrollHeight}}catch{}}}return answer.trim()}
async function sendMessage(text){const q=String(text||'').trim();if(!q||sendBtn.disabled)return;const direct=detectDirect(q);if(direct&&answerInstant(direct,q))return;markActivity();addMessage(q,'user');history.push({role:'user',content:q});messageInput.value='';sendBtn.disabled=true;showTyping();let msg=null;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_slug:clientSlug,messages:history,language,session_id:sessionId})});if(r.status===429){removeTyping();let code='';try{code=String((await r.json())?.code||'')}catch{}addMessage(code==='AI_RESPONSE_LIMIT_REACHED'?translations[language].limit:translations[language].rateLimit,'bot');return}if(!r.ok)throw new Error();msg=addMessage('','bot');const a=await readStream(r,msg);history.push({role:'assistant',content:a})}catch{removeTyping();if(msg)msg.remove();addMessage(translations[language].error,'bot')}finally{sendBtn.disabled=false;messageInput.focus();chatBody.scrollTop=chatBody.scrollHeight}}
$('arabicBtn').onclick=()=>changeLanguage('ar');$('englishBtn').onclick=()=>changeLanguage('en');$('humanBtn').onclick=()=>openContactForm('human_handoff');$('callbackBtn').onclick=()=>openContactForm('callback');submitContactBtn.onclick=submitContact;$('cancelContactBtn').onclick=closeContactForm;launcher.onclick=()=>{syncViewport();chat.classList.add('open');launcher.style.display='none';if(!chatBody.children.length)addMessage(welcome(),'bot');requestAnimationFrame(()=>{messageInput.focus();chatBody.scrollTop=chatBody.scrollHeight})};$('closeBtn').onclick=()=>{chat.classList.remove('open');launcher.style.display='block'};sendBtn.onclick=()=>sendMessage(messageInput.value);messageInput.addEventListener('focus',()=>{setTimeout(()=>{syncViewport();chatBody.scrollTop=chatBody.scrollHeight},120)});messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage(messageInput.value)}});(async()=>{try{loadSession();await loadClientConfig();loadingScreen.style.display='none';clientContent.style.display='block';launcher.style.display='block';render()}catch{loadingScreen.className='error-screen';loadingScreen.textContent='تعذر تحميل بيانات المنشأة.'}})();
</script></body></html>
