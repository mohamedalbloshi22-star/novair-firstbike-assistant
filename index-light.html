<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVAIRE Smart Response</title>
<style>
:root{
  --navy:#0b2c5f;--blue:#1769e0;--sky:#49b8ff;--teal:#19b8a6;--gold:#e7b64a;
  --bg:#f4f9ff;--card:#ffffff;--soft:#eaf4ff;--line:#d8e8f7;--text:#17304e;--muted:#6d839b;
  --shadow:0 18px 50px rgba(35,90,145,.14);--shadow-soft:0 8px 24px rgba(35,90,145,.10)
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:Arial,Tahoma,sans-serif;background:
 radial-gradient(circle at 8% 8%,#dff2ff 0,transparent 30%),
 radial-gradient(circle at 92% 16%,#e8fff8 0,transparent 26%),
 linear-gradient(180deg,#fbfdff 0%,var(--bg) 100%);min-height:100vh}
button,input{font-family:inherit}.topbar{background:linear-gradient(90deg,var(--navy),var(--blue));color:white;text-align:center;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.2px;box-shadow:0 3px 18px rgba(11,44,95,.12)}
.container{width:min(900px,calc(100% - 28px));margin:auto;padding:18px 0 120px}.language-area{display:flex;justify-content:flex-end;margin-bottom:14px}html[dir="ltr"] .language-area{justify-content:flex-start}
.language-switch{display:flex;background:rgba(255,255,255,.85);border:1px solid var(--line);padding:4px;border-radius:14px;box-shadow:var(--shadow-soft);backdrop-filter:blur(10px)}
.lang-btn{border:0;padding:9px 15px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.lang-btn.active{background:linear-gradient(135deg,var(--blue),var(--sky));color:white;box-shadow:0 6px 16px rgba(23,105,224,.24)}
.hero{background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(241,249,255,.96));border:1px solid rgba(200,225,245,.9);border-radius:26px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:linear-gradient(135deg,rgba(73,184,255,.18),rgba(25,184,166,.10));top:-140px;left:-70px}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(231,182,74,.08);bottom:-110px;right:-40px}
.brand{display:flex;align-items:center;gap:15px;position:relative;z-index:1}.logo{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,var(--navy),var(--blue) 65%,var(--sky));color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;box-shadow:0 10px 24px rgba(23,105,224,.25);border:3px solid rgba(255,255,255,.9)}
h1{margin:0;font-size:31px;color:var(--navy);letter-spacing:-.4px}.subtitle{color:var(--blue);font-size:14px;font-weight:700;margin-top:6px}.info{position:relative;z-index:1;color:var(--muted);font-size:14px;line-height:1.9;margin-top:20px;padding:14px 16px;border-radius:16px;background:rgba(234,244,255,.72);border:1px solid #deedfa}.info strong{color:var(--navy)}
.section{margin-top:22px}.section h2{font-size:19px;color:var(--navy);margin:0 0 12px}.price-row{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-soft)}.price{background:linear-gradient(135deg,#fff3cb,#ffe4a4);border:1px solid #f4d27c;color:#7a5612;padding:7px 12px;border-radius:11px;font-size:13px;font-weight:800}
.services{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.service{border:1px solid #cfe6f7;background:linear-gradient(180deg,#fff,#f2f9ff);color:var(--navy);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;box-shadow:0 5px 14px rgba(35,90,145,.07)}
.note{margin-top:20px;border:1px solid #d5ece7;background:linear-gradient(135deg,#f4fffc,#eff9ff);padding:16px;border-radius:17px;line-height:1.8;color:#55768a;font-size:14px}.loading-screen,.error-screen{text-align:center;padding:80px 20px;color:var(--muted)}.error-screen{color:#c85050}
.chat-launcher{position:fixed;left:22px;bottom:22px;border:0;border-radius:18px;padding:14px 18px;background:linear-gradient(135deg,var(--blue),#258ef2 58%,var(--teal));color:white;font-weight:800;cursor:pointer;z-index:20;box-shadow:0 18px 38px rgba(23,105,224,.30);transition:.2s}.chat-launcher:hover{transform:translateY(-2px);box-shadow:0 22px 44px rgba(23,105,224,.36)}html[dir="ltr"] .chat-launcher{left:auto;right:22px}
.chat{position:fixed;left:22px;bottom:22px;width:min(430px,calc(100vw - 30px));height:min(700px,calc(100vh - 34px));background:rgba(255,255,255,.98);border:1px solid #d3e7f7;border-radius:24px;overflow:hidden;display:none;flex-direction:column;z-index:30;box-shadow:0 28px 80px rgba(18,67,115,.25);backdrop-filter:blur(16px)}html[dir="ltr"] .chat{left:auto;right:22px}.chat.open{display:flex}
.chat-header{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;position:relative}.chat-header:after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,var(--sky),var(--teal),var(--gold))}.chat-header-title{font-weight:800;font-size:15px}.status{color:#d7efff;font-size:11px;margin-top:4px}.close-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);width:34px;height:34px;border-radius:11px;color:white;font-size:21px;cursor:pointer}
.chat-body{flex:1;padding:15px;overflow-y:auto;background:linear-gradient(180deg,#f9fcff,#f2f8fd);display:flex;flex-direction:column;gap:10px}.msg{max-width:86%;border-radius:17px;padding:11px 13px;line-height:1.65;font-size:14px;box-shadow:0 5px 15px rgba(35,90,145,.07)}.msg.bot{align-self:flex-start;background:white;border:1px solid #dbeaf6;border-bottom-left-radius:6px}.msg.user{align-self:flex-end;background:linear-gradient(135deg,#1769e0,#2c8df2);color:white;border-bottom-right-radius:6px}.typing{align-self:flex-start;color:var(--muted);background:white;border:1px solid #dbeaf6;padding:9px 12px;border-radius:14px;font-size:13px}
.quick-area{padding:9px 12px;background:#f7fbff;display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid #edf4fa}.quick-btn{background:white;border:1px solid #cfe3f4;color:var(--blue);border-radius:999px;padding:7px 11px;cursor:pointer;font-size:12px;font-weight:700}.quick-btn:hover{background:#eef7ff}
.contact-actions{padding:9px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#f7fbff}.contact-action-btn{border:1px solid #d5e6f3;background:white;color:var(--navy);border-radius:12px;padding:10px 8px;cursor:pointer;font-size:12px;font-weight:800}.contact-action-btn:hover{border-color:#9ed0f3;background:#f4fbff}
.contact-form{margin:0 12px 9px;padding:13px;background:#f8fbfe;border:1px solid #d9e9f5;border-radius:15px}.contact-form-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:9px}.contact-form input{width:100%;background:white;border:1px solid #d1e2ef;color:var(--text);border-radius:11px;padding:10px 11px;margin-bottom:8px;outline:none}.contact-form input:focus,.input-area input:focus{border-color:#74baf0;box-shadow:0 0 0 3px rgba(73,184,255,.13)}.privacy-note{color:var(--muted);font-size:10px;line-height:1.5;margin:2px 0 9px}.contact-form-buttons{display:flex;gap:7px}.contact-form-buttons button{flex:1;border:0;border-radius:10px;padding:9px;cursor:pointer;font-weight:800}.submit-contact{background:linear-gradient(135deg,var(--blue),var(--teal));color:white}.cancel-contact{background:#e8f0f6;color:#536b7e}.contact-message{margin-top:8px;font-size:12px}.contact-message.success{color:#16967e}.contact-message.error{color:#c85050}
.input-area{padding:11px;border-top:1px solid #dbeaf4;display:flex;gap:8px;background:white}.input-area input{flex:1;border:1px solid #cfdfeb;background:#fbfdff;color:var(--text);border-radius:13px;padding:11px 12px;outline:none}.input-area button{border:0;width:44px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--sky));color:white;font-size:18px;cursor:pointer;box-shadow:0 7px 16px rgba(23,105,224,.22)}.input-area button:disabled{opacity:.5;cursor:wait}
@media(max-width:560px){.container{width:min(100% - 20px,900px)}.hero{padding:20px;border-radius:21px}.logo{width:52px;height:52px}h1{font-size:25px}.chat{left:10px;bottom:10px;width:calc(100vw - 20px);height:calc(100vh - 20px);border-radius:20px}html[dir="ltr"] .chat{right:10px;left:auto}.chat-launcher{left:14px;bottom:14px}html[dir="ltr"] .chat-launcher{right:14px;left:auto}}
</style>
</head>
<body>
<div class="topbar" id="topbar">NOVAIRE Smart Response</div>
<main class="container">
<div class="loading-screen" id="loadingScreen">جاري تحميل بيانات المنشأة...</div>
<div id="clientContent" style="display:none">
<div class="language-area"><div class="language-switch"><button id="arabicBtn" class="lang-btn">العربية</button><button id="englishBtn" class="lang-btn">English</button></div></div>
<header class="hero"><div class="brand"><div class="logo" id="logo">NV</div><div><h1 id="businessName"></h1><div class="subtitle" id="subtitle"></div></div></div><div class="info" id="info"></div></header>
<section class="section" id="pricesSection"><h2 id="pricesTitle"></h2><div id="pricesContainer"></div></section>
<div class="services" id="servicesContainer"></div><div class="note" id="note"></div>
</div></main>
<button class="chat-launcher" id="launcher" style="display:none"></button>
<section class="chat" id="chat"><div class="chat-header"><div><div class="chat-header-title" id="chatName"></div><div class="status" id="chatStatus"></div></div><button class="close-btn" id="closeBtn">×</button></div><div class="chat-body" id="chatBody"></div><div class="quick-area" id="quickArea"></div><div class="contact-actions"><button id="humanBtn" class="contact-action-btn"></button><button id="callbackBtn" class="contact-action-btn"></button></div><div class="contact-form" id="contactForm" style="display:none"><div class="contact-form-title" id="contactFormTitle"></div><input id="customerName" type="text"><input id="customerPhone" type="tel"><input id="contactReason" type="text"><div class="privacy-note" id="privacyNote"></div><div class="contact-form-buttons"><button id="submitContactBtn" class="submit-contact"></button><button id="cancelContactBtn" class="cancel-contact"></button></div><div class="contact-message" id="contactMessage"></div></div><div class="input-area"><input id="messageInput" type="text" autocomplete="off"><button id="sendBtn">➤</button></div></section>
<script>
const urlParams=new URLSearchParams(location.search);let clientSlug=String(urlParams.get('client')||'first-bike').trim().toLowerCase();if(!/^[a-z0-9_-]{2,80}$/.test(clientSlug))clientSlug='first-bike';let clientConfig=null;
const translations={ar:{dir:'rtl',topbar:'مدعوم بواسطة NOVAIRE Smart Response',locationLabel:'الموقع',hoursLabel:'الدوام',pricesTitle:'الأسعار',noteLabel:'ملاحظة',launcher:'✦ تحدث مع المساعد الذكي',chatStatus:'متصل الآن',placeholder:'اكتب سؤالك هنا...',error:'عذرًا، حدث خطأ. حاول مرة أخرى.',typing:'يكتب...',humanBtn:'👤 التحدث مع مسؤول',callbackBtn:'📞 طلب اتصال',humanTitle:'طلب التحدث مع مسؤول',callbackTitle:'طلب اتصال',namePlaceholder:'الاسم',phonePlaceholder:'رقم الهاتف',reasonPlaceholder:'سبب التواصل (اختياري)',privacy:'سيتم استخدام بيانات التواصل فقط لمعالجة طلبك والتواصل معك.',submit:'إرسال الطلب',cancel:'إلغاء',required:'يرجى إدخال الاسم ورقم الهاتف.',contactSuccess:'تم تسجيل طلبك بنجاح ✓',contactError:'تعذر تسجيل الطلب. حاول مرة أخرى.',loadError:'تعذر تحميل بيانات المنشأة.',quickQuestions:[{label:'📍 الموقع',message:'وين موقعكم؟'},{label:'🕒 أوقات الدوام',message:'ما هي أوقات الدوام؟'},{label:'🧾 الخدمات',message:'ما هي الخدمات التي تقدمونها؟'}]},en:{dir:'ltr',topbar:'Powered by NOVAIRE Smart Response',locationLabel:'Location',hoursLabel:'Hours',pricesTitle:'Prices',noteLabel:'Note',launcher:'✦ Chat with Smart Assistant',chatStatus:'Online now',placeholder:'Type your question here...',error:'Sorry, something went wrong. Please try again.',typing:'Typing...',humanBtn:'👤 Talk to a person',callbackBtn:'📞 Request a callback',humanTitle:'Talk to a representative',callbackTitle:'Request a callback',namePlaceholder:'Your name',phonePlaceholder:'Phone number',reasonPlaceholder:'Reason for contact (optional)',privacy:'Your contact details will only be used to process this request and contact you.',submit:'Send request',cancel:'Cancel',required:'Please enter your name and phone number.',contactSuccess:'Your request has been recorded successfully ✓',contactError:"We couldn't record your request. Please try again.",loadError:'Unable to load business information.',quickQuestions:[{label:'📍 Location',message:'Where are you located?'},{label:'🕒 Opening hours',message:'What are your opening hours?'},{label:'🧾 Services',message:'What services do you provide?'}]}};
let language=localStorage.getItem('novaire_language')||'ar';const SESSION_TIMEOUT=30*60*1000,sessionStorageKey=`novaire_session_${clientSlug}_v6`,activityStorageKey=`novaire_session_activity_${clientSlug}_v6`;let sessionId='',lastActivity=0,history=[],selectedContactType=null;
const $=id=>document.getElementById(id),loadingScreen=$('loadingScreen'),clientContent=$('clientContent'),chat=$('chat'),chatBody=$('chatBody'),launcher=$('launcher'),messageInput=$('messageInput'),sendBtn=$('sendBtn'),quickArea=$('quickArea'),contactForm=$('contactForm'),customerName=$('customerName'),customerPhone=$('customerPhone'),contactReason=$('contactReason'),contactMessage=$('contactMessage'),submitContactBtn=$('submitContactBtn');
function uuid(){return window.crypto?.randomUUID?`${clientSlug}-${crypto.randomUUID()}`:`${clientSlug}-${Date.now()}-${Math.random().toString(36).slice(2,10)}`}
function createNewSession(){sessionId=uuid();lastActivity=Date.now();sessionStorage.setItem(sessionStorageKey,sessionId);sessionStorage.setItem(activityStorageKey,String(lastActivity));history=[];chatBody.innerHTML='';closeContactForm()}
function loadSession(){const s=sessionStorage.getItem(sessionStorageKey),a=Number(sessionStorage.getItem(activityStorageKey)||0);if(!s||!a||Date.now()-a>SESSION_TIMEOUT)createNewSession();else{sessionId=s;lastActivity=a}}
function markActivity(){lastActivity=Date.now();sessionStorage.setItem(activityStorageKey,String(lastActivity))}function ensureActiveSession(){if(!sessionId||!lastActivity||Date.now()-lastActivity>SESSION_TIMEOUT){createNewSession();return false}markActivity();return true}
async function loadClientConfig(){const r=await fetch(`/api/client-config?client=${encodeURIComponent(clientSlug)}`);if(!r.ok)throw new Error('config');const d=await r.json();if(!d?.success||!d.client)throw new Error('invalid');clientConfig=d.client;if(!localStorage.getItem('novaire_language'))language=clientConfig.default_language==='en'?'en':'ar'}
function localized(k){return String(clientConfig?.[`${k}${language==='en'?'_en':'_ar'}`]||'').trim()}function businessName(){return String(clientConfig?.name||'NOVAIRE Client').trim()}function assistantName(){return String((language==='en'?clientConfig?.assistant_name_en:clientConfig?.assistant_name_ar)||businessName()).trim()}function initials(n){return String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'NV'}function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function fmt(t){return esc(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}
function render(){const t=translations[language],name=businessName();document.title=`${name} — NOVAIRE Smart Response`;document.documentElement.lang=language;document.documentElement.dir=t.dir;$('topbar').textContent=t.topbar;$('businessName').textContent=name;$('logo').textContent=initials(name);$('subtitle').textContent=localized('business_type');const lines=[];if(localized('location'))lines.push(`<strong>${t.locationLabel}:</strong> ${esc(localized('location'))}`);if(localized('working_hours'))lines.push(`<strong>${t.hoursLabel}:</strong> ${esc(localized('working_hours'))}`);$('info').innerHTML=lines.join('<br>');const prices=Array.isArray(clientConfig.rental_prices)?clientConfig.rental_prices:[];$('pricesTitle').textContent=t.pricesTitle;$('pricesContainer').innerHTML='';$('pricesSection').style.display=prices.length?'block':'none';prices.forEach(x=>{$('pricesContainer').insertAdjacentHTML('beforeend',`<div class="price-row"><strong>${esc(x.label||'')}</strong><span class="price">${esc(x.price??'')} ${esc(language==='en'?x.unit_en||'':x.unit_ar||'')}</span></div>`)});const services=Array.isArray(clientConfig[language==='en'?'services_en':'services_ar'])?clientConfig[language==='en'?'services_en':'services_ar']:[];$('servicesContainer').innerHTML=services.map(x=>`<span class="service">${esc(x)}</span>`).join('');const note=localized('notes');$('note').style.display=note?'block':'none';$('note').innerHTML=note?`<strong>${t.noteLabel}:</strong> ${esc(note)}`:'';launcher.textContent=t.launcher;$('chatName').textContent=assistantName();$('chatStatus').textContent=t.chatStatus;messageInput.placeholder=t.placeholder;$('humanBtn').textContent=t.humanBtn;$('callbackBtn').textContent=t.callbackBtn;customerName.placeholder=t.namePlaceholder;customerPhone.placeholder=t.phonePlaceholder;contactReason.placeholder=t.reasonPlaceholder;$('privacyNote').textContent=t.privacy;submitContactBtn.textContent=t.submit;$('cancelContactBtn').textContent=t.cancel;$('arabicBtn').classList.toggle('active',language==='ar');$('englishBtn').classList.toggle('active',language==='en');renderQuick()}
function welcome(){const c=language==='en'?clientConfig?.welcome_message_en:clientConfig?.welcome_message_ar;return String(c||'').trim()|| (language==='en'?`Hi 👋 I'm the ${assistantName()}. How can I help you?`:`هلا فيك 👋 أنا ${assistantName()}. كيف أقدر أساعدك؟`)}
function addMessage(text,sender){const d=document.createElement('div');d.className='msg '+sender;d.innerHTML=fmt(text);chatBody.appendChild(d);chatBody.scrollTop=chatBody.scrollHeight;return d}function showTyping(){removeTyping();const d=document.createElement('div');d.id='typing';d.className='typing';d.textContent=translations[language].typing;chatBody.appendChild(d);chatBody.scrollTop=chatBody.scrollHeight}function removeTyping(){$('typing')?.remove()}
function renderQuick(){quickArea.innerHTML='';translations[language].quickQuestions.forEach(x=>{const b=document.createElement('button');b.className='quick-btn';b.textContent=x.label;b.onclick=()=>sendMessage(x.message);quickArea.appendChild(b)})}
function changeLanguage(l){if(!['ar','en'].includes(l))return;language=l;localStorage.setItem('novaire_language',l);markActivity();render()}
function openContactForm(type){ensureActiveSession();selectedContactType=type;const t=translations[language];$('contactFormTitle').textContent=type==='human_handoff'?t.humanTitle:t.callbackTitle;contactMessage.textContent='';contactForm.style.display='block';customerName.focus()}function closeContactForm(){contactForm.style.display='none';selectedContactType=null;contactMessage.textContent=''}
async function submitContact(){ensureActiveSession();const t=translations[language],name=customerName.value.trim(),phone=customerPhone.value.trim(),reason=contactReason.value.trim();if(!name||!phone){contactMessage.textContent=t.required;contactMessage.className='contact-message error';return}submitContactBtn.disabled=true;try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_slug:clientSlug,session_id:sessionId,request_type:selectedContactType,customer_name:name,phone,reason,language})});if(!r.ok)throw 0;markActivity();contactMessage.textContent=t.contactSuccess;contactMessage.className='contact-message success';customerName.value=customerPhone.value=contactReason.value='';setTimeout(closeContactForm,1600)}catch{contactMessage.textContent=t.contactError;contactMessage.className='contact-message error'}finally{submitContactBtn.disabled=false}}
async function readStream(r,msg){const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='',answer='';while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop()||'';for(const line of lines){if(!line.trim())continue;try{const e=JSON.parse(line.trim());if(e.type==='delta'&&typeof e.text==='string'){removeTyping();answer+=e.text;msg.innerHTML=fmt(answer);chatBody.scrollTop=chatBody.scrollHeight}if(e.type==='error')throw new Error(e.error||'stream')}catch(e){if(e.message==='stream')throw e}}}return answer.trim()}
async function sendMessage(text){const q=String(text||'').trim();if(!q||sendBtn.disabled)return;ensureActiveSession();addMessage(q,'user');history.push({role:'user',content:q});messageInput.value='';sendBtn.disabled=true;showTyping();let msg=null,answer='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_slug:clientSlug,messages:history,language,session_id:sessionId})});if(!r.ok)throw new Error(await r.text());msg=addMessage('','bot');answer=await readStream(r,msg);removeTyping();if(!answer){msg.remove();throw 0}history.push({role:'assistant',content:answer});markActivity()}catch(e){console.error(e);removeTyping();if(msg&&!answer)msg.remove();if(!answer)addMessage(translations[language].error,'bot')}finally{sendBtn.disabled=false;messageInput.focus()}}
$('arabicBtn').onclick=()=>changeLanguage('ar');$('englishBtn').onclick=()=>changeLanguage('en');$('humanBtn').onclick=()=>openContactForm('human_handoff');$('callbackBtn').onclick=()=>openContactForm('callback');submitContactBtn.onclick=submitContact;$('cancelContactBtn').onclick=closeContactForm;launcher.onclick=()=>{ensureActiveSession();chat.classList.add('open');launcher.style.display='none';if(!chatBody.children.length)addMessage(welcome(),'bot');messageInput.focus()};$('closeBtn').onclick=()=>{markActivity();chat.classList.remove('open');launcher.style.display='block'};sendBtn.onclick=()=>sendMessage(messageInput.value);messageInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage(messageInput.value)}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&lastActivity&&Date.now()-lastActivity>SESSION_TIMEOUT)createNewSession()});
(async()=>{try{loadSession();await loadClientConfig();loadingScreen.style.display='none';clientContent.style.display='block';launcher.style.display='block';render()}catch(e){console.error(e);loadingScreen.className='error-screen';loadingScreen.textContent=translations[language].loadError}})();
</script>
</body>
</html>
