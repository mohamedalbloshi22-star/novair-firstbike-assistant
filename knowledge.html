<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVAIRE | قاعدة المعرفة</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#1f2937}
.container{max-width:1100px;margin:auto;padding:24px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
h1,h2{margin-top:0}
.muted{color:#6b7280;font-size:14px}
input,textarea,select,button{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin:6px 0 12px}
textarea{min-height:100px;resize:vertical}
button{border:0;cursor:pointer;font-weight:bold}
.primary{background:#111827;color:white}
.secondary{background:#e5e7eb;color:#111827}
.danger{background:#b91c1c;color:white}
.success{background:#047857;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:14px;background:#fafafa}
.item p{line-height:1.6}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#app{display:none}
#message{display:none;padding:12px;border-radius:8px;margin-bottom:15px}
#message.ok{display:block;background:#d1fae5;color:#065f46}
#message.error{display:block;background:#fee2e2;color:#991b1b}
@media(max-width:700px){.grid,.actions{grid-template-columns:1fr}}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loginBox">
<h1>NOVAIRE</h1>
<h2>قاعدة المعرفة</h2>

<input
id="password"
type="password"
placeholder="كلمة مرور الإدارة">

<button class="primary" onclick="login()">
دخول
</button>
</div>


<div id="app">

<div id="message"></div>

<div class="card">

<label>العميل</label>

<select
id="clientSelect"
onchange="clientChanged()">
<option value="">اختر العميل</option>
</select>

<button class="secondary" onclick="logout()">
تسجيل الخروج
</button>

</div>


<div class="card">

<h2>إضافة معلومة</h2>

<label>السؤال</label>
<textarea id="question"></textarea>

<label>الإجابة</label>
<textarea id="answer"></textarea>

<label>اللغة</label>
<select id="language">
<option value="ar">العربية</option>
<option value="en">English</option>
</select>

<button class="primary" onclick="createItem()">
إضافة إلى قاعدة المعرفة
</button>

</div>


<div class="card">

<h2>المعلومات الحالية</h2>

<div id="list">
اختر العميل.
</div>

</div>

</div>
</div>


<script>

let adminPassword = "";

const params = new URLSearchParams(window.location.search);
const requestedClient = params.get("client") || "";


async function api(url,payload){

const response = await fetch(url,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
password:adminPassword,
...payload
})
});

let data={};

try{
data=await response.json();
}catch{}

if(!response.ok){
throw new Error(data.error || data.details || "حدث خطأ");
}

return data;
}


function message(text,type="ok"){

const box=document.getElementById("message");

box.textContent=text;
box.className=type;
box.style.display="block";

setTimeout(()=>{
box.style.display="none";
},3000);

}


async function login(){

const value=document.getElementById("password").value.trim();

if(!value){
alert("أدخل كلمة المرور");
return;
}

adminPassword=value;

try{

await loadClients();

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";

}catch(error){

adminPassword="";
alert(error.message);

}

}


function logout(){

adminPassword="";

document.getElementById("app").style.display="none";
document.getElementById("loginBox").style.display="block";

}


async function loadClients(){

const data=await api("/api/client-admin",{
action:"list"
});

const clients=
Array.isArray(data.clients)
?data.clients
:Array.isArray(data.items)
?data.items
:Array.isArray(data)
?data
:[];

const select=document.getElementById("clientSelect");

select.innerHTML='<option value="">اختر العميل</option>';

clients.forEach(client=>{

const option=document.createElement("option");

option.value=client.slug;

option.textContent=
client.name ||
client.config?.brand_name ||
client.slug;

select.appendChild(option);

});


if(requestedClient){

const exists=clients.some(
client=>client.slug===requestedClient
);

if(exists){
select.value=requestedClient;
await loadKnowledge();
return;
}

}


if(clients.length){

select.value=clients[0].slug;
await loadKnowledge();

}

}


async function clientChanged(){

const slug=document.getElementById("clientSelect").value;

if(slug){

const newUrl=
window.location.pathname+
"?client="+encodeURIComponent(slug);

history.replaceState({}, "", newUrl);

}

await loadKnowledge();

}


async function loadKnowledge(){

const slug=document.getElementById("clientSelect").value;

const list=document.getElementById("list");

if(!slug){
list.innerHTML="اختر العميل.";
return;
}

list.innerHTML="جاري التحميل...";

try{

const data=await api("/api/knowledge-admin",{
action:"list",
client_slug:slug
});

const items=
Array.isArray(data.items)
?data.items
:Array.isArray(data.knowledge)
?data.knowledge
:[];

render(items);

}catch(error){

list.innerHTML="";
message(error.message,"error");

}

}


function render(items){

const list=document.getElementById("list");

list.innerHTML="";

if(!items.length){

list.innerHTML=
'<p class="muted">لا توجد معلومات لهذا العميل.</p>';

return;

}


items.forEach(item=>{

const div=document.createElement("div");
div.className="item";

div.innerHTML=`

<label>السؤال</label>
<textarea id="q-${item.id}">${escapeHtml(item.question || "")}</textarea>

<label>الإجابة</label>
<textarea id="a-${item.id}">${escapeHtml(item.answer || "")}</textarea>

<label>اللغة</label>

<select id="l-${item.id}">
<option value="ar" ${item.language==="ar"?"selected":""}>العربية</option>
<option value="en" ${item.language==="en"?"selected":""}>English</option>
</select>

<p class="muted">
الحالة:
${item.active===false ? "متوقفة" : "فعالة"}
</p>

<div class="actions">

<button class="success"
onclick="updateItem('${item.id}')">
حفظ
</button>

<button class="secondary"
onclick="toggleItem('${item.id}')">
${item.active===false ? "تفعيل" : "إيقاف"}
</button>

<button class="danger"
onclick="deleteItem('${item.id}')">
حذف
</button>

</div>
`;

list.appendChild(div);

});

}


async function createItem(){

const slug=document.getElementById("clientSelect").value;
const question=document.getElementById("question").value.trim();
const answer=document.getElementById("answer").value.trim();
const language=document.getElementById("language").value;

if(!slug || !question || !answer){
alert("اختر العميل واكتب السؤال والإجابة");
return;
}

try{

await api("/api/knowledge-admin",{
action:"create",
client_slug:slug,
question,
answer,
language
});

document.getElementById("question").value="";
document.getElementById("answer").value="";

message("تمت الإضافة بنجاح");

await loadKnowledge();

}catch(error){
message(error.message,"error");
}

}


async function updateItem(id){

const slug=document.getElementById("clientSelect").value;

try{

await api("/api/knowledge-admin",{
action:"update",
client_slug:slug,
id,
question:document.getElementById("q-"+id).value.trim(),
answer:document.getElementById("a-"+id).value.trim(),
language:document.getElementById("l-"+id).value
});

message("تم الحفظ");

await loadKnowledge();

}catch(error){
message(error.message,"error");
}

}


async function toggleItem(id){

const slug=document.getElementById("clientSelect").value;

try{

await api("/api/knowledge-admin",{
action:"toggle",
client_slug:slug,
id
});

await loadKnowledge();

}catch(error){
message(error.message,"error");
}

}


async function deleteItem(id){

if(!confirm("هل تريد حذف هذه المعلومة؟")){
return;
}

const slug=document.getElementById("clientSelect").value;

try{

await api("/api/knowledge-admin",{
action:"delete",
client_slug:slug,
id
});

message("تم الحذف");

await loadKnowledge();

}catch(error){
message(error.message,"error");
}

}


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


document.getElementById("password")
.addEventListener("keydown",event=>{
if(event.key==="Enter"){
login();
}
});

</script>

</body>
</html>
