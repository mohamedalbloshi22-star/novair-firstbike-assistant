<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVAIRE | إدارة قاعدة المعرفة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .muted {
      color: #6b7280;
      font-size: 14px;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 15px;
      margin-top: 7px;
      margin-bottom: 12px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .danger {
      background: #b91c1c;
      color: white;
    }

    .success {
      background: #047857;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .knowledge-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      background: #fafafa;
    }

    .knowledge-item.inactive {
      opacity: 0.6;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      margin: 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .badge.active {
      background: #d1fae5;
      color: #065f46;
    }

    .badge.inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    #app {
      display: none;
    }

    #message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #message.ok {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    #message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 10px;
      align-items: end;
    }

    @media (max-width: 700px) {
      .grid,
      .actions,
      .top-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card" id="loginBox">

    <h1>NOVAIRE</h1>
    <h2>إدارة قاعدة المعرفة</h2>

    <p class="muted">
      هذه الصفحة مخصصة لإدارة معلومات كل عميل بشكل مستقل.
    </p>

    <label>كلمة مرور الإدارة</label>

    <input
      id="password"
      type="password"
      placeholder="أدخل كلمة مرور الإدارة"
    />

    <button
      class="primary"
      onclick="login()"
    >
      دخول
    </button>

  </div>


  <div id="app">

    <div id="message"></div>


    <div class="card">

      <div class="top-actions">

        <div>
          <label>اختر العميل</label>

          <select
            id="clientSelect"
            onchange="loadKnowledge()"
          >
            <option value="">
              اختر العميل
            </option>
          </select>
        </div>

        <button
          class="secondary"
          onclick="logout()"
        >
          تسجيل الخروج
        </button>

      </div>

    </div>


    <div class="card">

      <h2 id="formTitle">
        إضافة معلومة جديدة
      </h2>

      <input
        type="hidden"
        id="editId"
      />


      <div class="grid">

        <div>
          <label>اللغة</label>

          <select id="language">
            <option value="ar">
              العربية
            </option>

            <option value="en">
              English
            </option>
          </select>
        </div>

      </div>


      <label>السؤال</label>

      <textarea
        id="question"
        placeholder="مثال: أين موقعكم؟"
      ></textarea>


      <label>الإجابة المعتمدة</label>

      <textarea
        id="answer"
        placeholder="اكتب الإجابة التي سيستخدمها المساعد"
      ></textarea>


      <div class="grid">

        <button
          class="success"
          onclick="saveKnowledge()"
        >
          حفظ
        </button>

        <button
          class="secondary"
          onclick="resetForm()"
        >
          إلغاء / جديد
        </button>

      </div>

    </div>


    <div class="card">

      <h2>قاعدة المعرفة</h2>

      <p
        id="clientInfo"
        class="muted"
      >
        اختر العميل أولًا.
      </p>

      <div id="knowledgeList"></div>

    </div>

  </div>

</div>


<script>

let adminPassword = "";
let currentItems = [];


/*
==================================================
Message
==================================================
*/

function showMessage(text, type = "ok") {

  const box =
    document.getElementById("message");

  box.textContent =
    text;

  box.className =
    type;

  setTimeout(() => {

    box.className = "";

    box.style.display =
      "none";

  }, 4000);
}


/*
==================================================
API Helper
==================================================
*/

async function postAPI(url, payload) {

  const response =
    await fetch(
      url,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            password:
              adminPassword,

            ...payload
          })
      }
    );


  let data = {};

  try {

    data =
      await response.json();

  } catch (error) {

    data = {};
  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      "حدث خطأ في الاتصال"
    );
  }


  return data;
}


/*
==================================================
Login
==================================================
*/

async function login() {

  const password =
    document
      .getElementById("password")
      .value
      .trim();


  if (!password) {

    alert(
      "أدخل كلمة مرور الإدارة"
    );

    return;
  }


  adminPassword =
    password;


  try {

    await loadClients();

    document
      .getElementById("loginBox")
      .style.display =
        "none";

    document
      .getElementById("app")
      .style.display =
        "block";

  } catch (error) {

    adminPassword = "";

    alert(
      "تعذر تسجيل الدخول: " +
      error.message
    );
  }
}


/*
==================================================
Logout
==================================================
*/

function logout() {

  adminPassword = "";

  currentItems = [];

  document
    .getElementById("password")
    .value =
      "";

  document
    .getElementById("app")
    .style.display =
      "none";

  document
    .getElementById("loginBox")
    .style.display =
      "block";
}


/*
==================================================
Load Clients
==================================================
*/

async function loadClients() {

  const data =
    await postAPI(
      "/api/client-admin",
      {
        action:
          "list"
      }
    );


  const clients =
    Array.isArray(data.clients)
      ? data.clients
      : Array.isArray(data.items)
        ? data.items
        : Array.isArray(data)
          ? data
          : [];


  const select =
    document.getElementById(
      "clientSelect"
    );


  select.innerHTML =
    '<option value="">اختر العميل</option>';


  clients.forEach(
    client => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        client.slug;

      option.textContent =
        client.name ||
        client.config?.brand_name ||
        client.slug;

      select.appendChild(
        option
      );
    }
  );


  /*
  اختيار First Bike تلقائيا إن وجد
  */

  const firstBike =
    clients.find(
      item =>
        item.slug ===
        "first-bike"
    );


  if (firstBike) {

    select.value =
      "first-bike";

    await loadKnowledge();
  }
}


/*
==================================================
Load Knowledge
==================================================
*/

async function loadKnowledge() {

  const clientSlug =
    document
      .getElementById(
        "clientSelect"
      )
      .value;


  const list =
    document.getElementById(
      "knowledgeList"
    );


  if (!clientSlug) {

    list.innerHTML = "";

    document
      .getElementById(
        "clientInfo"
      )
      .textContent =
        "اختر العميل أولًا.";

    return;
  }


  list.innerHTML =
    "جاري التحميل...";


  resetForm();


  try {

    const data =
      await postAPI(
        "/api/knowledge-admin",
        {
          action:
            "list",

          client_slug:
            clientSlug
        }
      );


    currentItems =
      Array.isArray(data.items)
        ? data.items
        : [];


    document
      .getElementById(
        "clientInfo"
      )
      .textContent =
        `العميل: ${
          data.client?.name ||
          clientSlug
        } — عدد المعلومات: ${
          currentItems.length
        }`;


    renderKnowledge();

  } catch (error) {

    list.innerHTML = "";

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
==================================================
Render
==================================================
*/

function renderKnowledge() {

  const list =
    document.getElementById(
      "knowledgeList"
    );


  list.innerHTML = "";


  if (
    currentItems.length === 0
  ) {

    list.innerHTML =
      "<p>لا توجد معلومات مسجلة لهذا العميل حتى الآن.</p>";

    return;
  }


  currentItems.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "knowledge-item " +
        (
          item.active === false
            ? "inactive"
            : ""
        );


      const badge =
        item.active === false
          ? '<span class="badge inactive">متوقفة</span>'
          : '<span class="badge active">فعالة</span>';


      div.innerHTML = `
        ${badge}

        <h3>
          ${escapeHtml(item.question)}
        </h3>

        <p>
          ${escapeHtml(item.answer).replace(/\n/g, "<br>")}
        </p>

        <p class="muted">
          اللغة:
          ${
            item.language === "en"
              ? "English"
              : "العربية"
          }
        </p>

        <div class="actions">

          <button
            class="secondary"
            onclick="editKnowledge('${item.id}')"
          >
            تعديل
          </button>

          <button
            class="primary"
            onclick="toggleKnowledge('${item.id}')"
          >
            ${
              item.active === false
                ? "تشغيل"
                : "إيقاف"
            }
          </button>

          <button
            class="danger"
            onclick="deleteKnowledge('${item.id}')"
          >
            حذف
          </button>

        </div>
      `;


      list.appendChild(
        div
      );
    }
  );
}


/*
==================================================
Save
==================================================
*/

async function saveKnowledge() {

  const clientSlug =
    document
      .getElementById(
        "clientSelect"
      )
      .value;


  if (!clientSlug) {

    alert(
      "اختر العميل أولًا"
    );

    return;
  }


  const id =
    document
      .getElementById("editId")
      .value;


  const question =
    document
      .getElementById("question")
      .value
      .trim();


  const answer =
    document
      .getElementById("answer")
      .value
      .trim();


  const language =
    document
      .getElementById("language")
      .value;


  if (
    !question ||
    !answer
  ) {

    alert(
      "اكتب السؤال والإجابة"
    );

    return;
  }


  try {

    await postAPI(
      "/api/knowledge-admin",
      {
        action:
          id
            ? "update"
            : "create",

        client_slug:
          clientSlug,

        id:
          id || undefined,

        question,
        answer,
        language
      }
    );


    showMessage(
      id
        ? "تم تحديث المعلومة بنجاح"
        : "تمت إضافة المعلومة بنجاح"
    );


    resetForm();

    await loadKnowledge();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
==================================================
Edit
==================================================
*/

function editKnowledge(id) {

  const item =
    currentItems.find(
      row =>
        row.id === id
    );


  if (!item) {
    return;
  }


  document
    .getElementById("editId")
    .value =
      item.id;


  document
    .getElementById("question")
    .value =
      item.question || "";


  document
    .getElementById("answer")
    .value =
      item.answer || "";


  document
    .getElementById("language")
    .value =
      item.language === "en"
        ? "en"
        : "ar";


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "تعديل المعلومة";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/*
==================================================
Toggle
==================================================
*/

async function toggleKnowledge(id) {

  const clientSlug =
    document
      .getElementById(
        "clientSelect"
      )
      .value;


  try {

    await postAPI(
      "/api/knowledge-admin",
      {
        action:
          "toggle",

        client_slug:
          clientSlug,

        id
      }
    );


    await loadKnowledge();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
==================================================
Delete
==================================================
*/

async function deleteKnowledge(id) {

  const confirmed =
    confirm(
      "هل تريد حذف هذه المعلومة نهائيًا؟"
    );


  if (!confirmed) {
    return;
  }


  const clientSlug =
    document
      .getElementById(
        "clientSelect"
      )
      .value;


  try {

    await postAPI(
      "/api/knowledge-admin",
      {
        action:
          "delete",

        client_slug:
          clientSlug,

        id
      }
    );


    showMessage(
      "تم حذف المعلومة"
    );


    await loadKnowledge();

  } catch (error) {

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
==================================================
Reset
==================================================
*/

function resetForm() {

  document
    .getElementById("editId")
    .value =
      "";

  document
    .getElementById("question")
    .value =
      "";

  document
    .getElementById("answer")
    .value =
      "";

  document
    .getElementById("language")
    .value =
      "ar";

  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "إضافة معلومة جديدة";
}


/*
==================================================
Escape HTML
==================================================
*/

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value || "";

  return div.innerHTML;
}


/*
==================================================
Enter Login
==================================================
*/

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        login();
      }
    }
  );

</script>

</body>
</html>
