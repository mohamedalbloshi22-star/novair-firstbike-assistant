<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASEERA | قاعدة المعرفة</title><link rel="stylesheet" href="/novaire-light.css"><style>.brand-head{display:flex;align-items:center;gap:12px}.brand-head img{width:210px;max-width:55vw;height:auto;background:#fff;border-radius:12px;padding:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin-bottom:12px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .nv-btn{padding:8px 11px}.item textarea{min-height:90px}@media(max-width:720px){.brand-head,.grid{display:block}.brand-head img{margin-bottom:10px}.actions .nv-btn{flex:1}}</style></head><body><header class="nv-header"><div class="nv-header-inner"><div class="brand-head"><img src="/baseera-logo.svg" alt="BASEERA Digital Solutions"><div><h1>قاعدة المعرفة</h1><p>إدارة معلومات المساعد لكل عميل</p></div></div></div></header><main class="nv-container"><div id="msg"></div><section class="nv-panel"><div class="nv-row"><div style="flex:1"><label><b>العميل</b></label><select id="client" class="nv-select"></select></div><div class="nv-actions"><button id="home" class="nv-btn secondary">مركز الإدارة</button><button id="logout" class="nv-btn danger">تسجيل الخروج</button></div></div></section><section class="nv-section"><h2>إضافة معلومة</h2><div class="grid"><div><label><b>السؤال</b></label><textarea id="q" class="nv-input"></textarea></div><div><label><b>الإجابة</b></label><textarea id="a" class="nv-input"></textarea></div></div><div class="grid"><div><label><b>اللغة</b></label><select id="lang" class="nv-select"><option value="ar">العربية</option><option value="en">English</option></select></div><div style="display:flex;align-items:end"><button id="add" class="nv-btn success" style="width:100%">إضافة إلى قاعدة المعرفة</button></div></div></section><section class="nv-section"><h2>المعلومات الحالية</h2><div id="list">جاري التحميل...</div></section></main><script>const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,e=false){$('msg').innerHTML=`<div class="nv-message${e?' error':''}">${esc(t)}</div>`}async function auth(){const r=await fetch('/api/admin-auth',{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok||!d.authenticated){location='/control.html';return false}return true}async function api(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(r.status===401){location='/control.html';throw Error('Unauthorized')}if(!r.ok)throw Error(d.error||d.details||'تعذر تنفيذ الطلب');return d}async function clients(){const d=await api('/api/client-admin',{action:'list'});const rows=d.clients||[];$('client').innerHTML=rows.map(x=>`<option value="${esc(x.slug)}">${esc(x.name||x.slug)}</option>`).join('');const wanted=new URLSearchParams(location.search).get('client')||localStorage.getItem('novaire_control_client');if(wanted&&[...$('client').options].some(o=>o.value===wanted))$('client').value=wanted;if($('client').value)await load()}async function load(){const slug=$('client').value;if(!slug)return;localStorage.setItem('novaire_control_client',slug);const d=await api('/api/knowledge-admin',{action:'list',client_slug:slug});const rows=d.items||d.knowledge||[];$('list').innerHTML=rows.length?rows.map(x=>`<div class="item"><label><b>السؤال</b></label><textarea id="q-${esc(x.id)}" class="nv-input">${esc(x.question||'')}</textarea><label><b>الإجابة</b></label><textarea id="a-${esc(x.id)}" class="nv-input">${esc(x.answer||'')}</textarea><label><b>اللغة</b></label><select id="l-${esc(x.id)}" class="nv-select"><option value="ar" ${x.language==='ar'?'selected':''}>العربية</option><option value="en" ${x.language==='en'?'selected':''}>English</option></select><div class="actions"><button class="nv-btn success" onclick="save('${esc(x.id)}')">حفظ</button><button class="nv-btn secondary" onclick="toggle('${esc(x.id)}')">${x.active===false?'تفعيل':'إيقاف'}</button><button class="nv-btn danger" onclick="del('${esc(x.id)}')">حذف</button></div></div>`).join(''):'<div class="nv-message">لا توجد معلومات لهذا العميل.</div>'}async function add(){const question=$('q').value.trim(),answer=$('a').value.trim();if(!question||!answer)return msg('اكتب السؤال والإجابة.',true);await api('/api/knowledge-admin',{action:'create',client_slug:$('client').value,question,answer,language:$('lang').value});$('q').value='';$('a').value='';msg('تمت الإضافة بنجاح.');await load()}async function save(id){await api('/api/knowledge-admin',{action:'update',client_slug:$('client').value,id,question:$(`q-${id}`).value.trim(),answer:$(`a-${id}`).value.trim(),language:$(`l-${id}`).value});msg('تم الحفظ.');await load()}async function toggle(id){await api('/api/knowledge-admin',{action:'toggle',client_slug:$('client').value,id});await load()}async function del(id){if(!confirm('هل تريد حذف هذه المعلومة؟'))return;await api('/api/knowledge-admin',{action:'delete',client_slug:$('client').value,id});msg('تم الحذف.');await load()}$('client').onchange=load;$('add').onclick=()=>add().catch(e=>msg(e.message,true));$('home').onclick=()=>location='/control.html';$('logout').onclick=async()=>{await fetch('/api/admin-auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})});location='/control.html'};(async()=>{if(!(await auth()))return;try{await clients()}catch(e){if(e.message!=='Unauthorized')msg(e.message,true)}})();</script></body></html>
