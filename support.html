<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVAIRE | الدعم والاستفسارات</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#eef6fb;color:#10233f}header{background:linear-gradient(135deg,#0f2747,#0f6fa6);color:#fff;padding:24px 5%}main{width:min(820px,92%);margin:28px auto}.card{background:#fff;border:1px solid #d7e6ef;border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(16,35,63,.07)}textarea{width:100%;min-height:130px;border:1px solid #cadde8;border-radius:12px;padding:12px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#0f6fa6;color:#fff}.btn.secondary{background:#e8f4fa;color:#0f5f91}.reply{margin-top:18px;padding:16px;border-radius:12px;background:#f7fbfd;border:1px solid #dbe9f2;display:none;line-height:1.8}.muted{color:#64798d;line-height:1.7}.bad{background:#fff0ef;color:#a13a33;border-color:#f2c9c6}@media(max-width:600px){.btn{width:100%}}</style></head><body><header><h1 style="margin:0">الدعم والاستفسارات</h1><p style="margin:6px 0 0;color:#d8efff">NOVAIRE Smart Response — NSR-1</p></header><main><div class="card"><h2 style="margin-top:0">كيف نساعدك؟</h2><p class="muted">اكتب استفسارًا قصيرًا عن النظام أو الاشتراك أو الاستخدام. إذا كانت الإجابة معروفة سيرد النظام فورًا، وإذا لم تكن معروفة سيحوّلها تلقائيًا إلى إدارة NOVAIRE.</p><textarea id="message" maxlength="800" placeholder="اكتب استفسارك هنا..."></textarea><div class="actions"><button id="send" class="btn">إرسال الاستفسار</button><button class="btn secondary" onclick="location='/client-portal.html'">العودة للوحة العميل</button></div><div id="reply" class="reply"></div></div></main><script>const m=document.getElementById('message'),b=document.getElementById('send'),r=document.getElementById('reply');b.onclick=async()=>{const message=m.value.trim();if(message.length<2){r.className='reply bad';r.style.display='block';r.textContent='اكتب استفسارًا قصيرًا أولًا.';return}b.disabled=true;b.textContent='جاري الإرسال...';r.style.display='none';try{const x=await fetch('/api/support-client',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await x.json();if(x.status===401){location='/client-login.html';return}if(!x.ok||!d.success)throw Error(d.error||'تعذر إرسال الاستفسار');r.className='reply';r.style.display='block';r.textContent=d.answer||'تم استلام طلبك.';if(d.escalated)m.value='';}catch(e){r.className='reply bad';r.style.display='block';r.textContent=e.message||'تعذر إرسال الاستفسار';}finally{b.disabled=false;b.textContent='إرسال الاستفسار'}};m.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)b.click()});</script></body></html>
