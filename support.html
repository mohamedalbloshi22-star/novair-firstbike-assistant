<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASEERA | الدعم والاستفسارات</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#eef6fb;color:#10233f}header{background:linear-gradient(135deg,#0f2747,#0f6fa6);color:#fff;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand img{width:220px;max-width:44vw;height:auto;background:#fff;border-radius:14px;padding:6px}.brand p{margin:6px 0 0;color:#d8efff}main{width:min(900px,92%);margin:28px auto}.card{background:#fff;border:1px solid #d7e6ef;border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(16,35,63,.07);margin-bottom:18px}textarea{width:100%;min-height:120px;border:1px solid #cadde8;border-radius:12px;padding:12px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#0f6fa6;color:#fff}.btn.secondary{background:#e8f4fa;color:#0f5f91}.reply{margin-top:18px;padding:16px;border-radius:12px;background:#f7fbfd;border:1px solid #dbe9f2;display:none;line-height:1.8}.muted{color:#64798d;line-height:1.7}.bad{background:#fff0ef;color:#a13a33;border-color:#f2c9c6}.item{padding:14px 0;border-bottom:1px solid #e4eef4}.item:last-child{border-bottom:0}.q{font-weight:700}.a{margin-top:7px;line-height:1.7}.pending{color:#966414}.answered{color:#16765f}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.brand img{width:190px;max-width:80vw}.btn{width:100%}}</style></head><body><header><div class="brand"><img src="/baseera-logo.svg" alt="BASEERA Digital Solutions"><p>الدعم والاستفسارات — NSR-1</p></div></header><main><div class="card"><h2 style="margin-top:0">كيف نساعدك؟</h2><p class="muted">اكتب استفسارًا قصيرًا عن النظام أو الاشتراك أو الاستخدام. إذا كانت الإجابة معروفة سيرد النظام فورًا، وإذا لم تكن معروفة سيحوّلها تلقائيًا إلى إدارة BASEERA.</p><textarea id="message" maxlength="800" placeholder="اكتب استفسارك هنا..."></textarea><div class="actions"><button id="send" class="btn">إرسال الاستفسار</button><button class="btn secondary" onclick="location='/client-portal.html'">العودة للوحة العميل</button></div><div id="reply" class="reply"></div></div><div class="card"><h2 style="margin-top:0">سجل الدعم والردود</h2><div id="history" class="muted">جاري التحميل...</div></div></main><script>const m=document.getElementById('message'),b=document.getElementById('send'),r=document.getElementById('reply'),h=document.getElementById('history');const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function load(){try{const x=await fetch('/api/support-client',{credentials:'same-origin',cache:'no-store'});const d=await x.json();if(x.status===401){location='/client-login.html';return}if(!x.ok||!d.success)throw Error(d.error||'تعذر تحميل السجل');const rows=d.requests||[];if(!rows.length){h.innerHTML='<div class="muted">لا توجد استفسارات سابقة.</div>';return}h.innerHTML=rows.map(i=>{const answer=i.admin_reply||i.auto_answer||'';const status=answer?'تم الرد':'بانتظار رد الإدارة';return `<div class="item"><div class="q">${esc(i.message)}</div><div class="a ${answer?'answered':'pending'}">${answer?esc(answer):esc(status)}</div></div>`}).join('')}catch(e){h.textContent=e.message||'تعذر تحميل السجل'}}b.onclick=async()=>{const message=m.value.trim();if(message.length<2){r.className='reply bad';r.style.display='block';r.textContent='اكتب استفسارًا قصيرًا أولًا.';return}b.disabled=true;b.textContent='جاري الإرسال...';r.style.display='none';try{const x=await fetch('/api/support-client',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const d=await x.json();if(x.status===401){location='/client-login.html';return}if(!x.ok||!d.success)throw Error(d.error||'تعذر إرسال الاستفسار');r.className='reply';r.style.display='block';r.textContent=d.answer||'تم استلام طلبك.';m.value='';await load()}catch(e){r.className='reply bad';r.style.display='block';r.textContent=e.message||'تعذر إرسال الاستفسار'}finally{b.disabled=false;b.textContent='إرسال الاستفسار'}};m.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)b.click()});load();</script></body></html>
