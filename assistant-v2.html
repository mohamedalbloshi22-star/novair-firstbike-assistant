<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSR-1 Assistant</title><style>:root{--c:#1769e0;--navy:#0b2c5f;--bg:#f4f8fc;--line:#d8e5f0;--text:#17304e;--muted:#6e8296}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f9fcff,var(--bg));font-family:Arial,Tahoma,sans-serif;color:var(--text);min-height:100vh}.wrap{width:min(760px,94%);margin:24px auto}.chat{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 70px rgba(20,70,120,.12)}.head{background:linear-gradient(135deg,var(--navy),var(--c));color:#fff;padding:17px;display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border-radius:13px;background:#fff;object-fit:contain}.grow{flex:1}.head h1{font-size:19px;margin:0}.head p{margin:4px 0 0;color:#dceaff;font-size:12px}.body{height:480px;overflow:auto;padding:16px;background:#f8fbfe;display:flex;flex-direction:column;gap:10px}.msg{max-width:86%;padding:11px 13px;border-radius:16px;line-height:1.6;white-space:pre-wrap}.bot{align-self:flex-start;background:#fff;border:1px solid var(--line)}.user{align-self:flex-end;background:var(--c);color:#fff}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:11px;padding:10px;font-weight:800;cursor:pointer;background:#edf4fb;color:var(--text)}.primary{background:var(--c);color:#fff}.input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.input input{flex:1;border:1px solid #cbdbe8;border-radius:11px;padding:11px}.input button{width:48px}.panel{display:none;padding:14px;border-top:1px solid var(--line);background:#fbfdff}.panel.open{display:block}.panel input,.panel select,.panel textarea{width:100%;margin:5px 0;padding:10px;border:1px solid #cadbe8;border-radius:10px}.feedback{display:none;padding:14px;border-top:1px solid var(--line)}.feedback.show{display:block}.feedback .yn{display:flex;gap:8px}.muted{color:var(--muted);font-size:12px}.status{font-size:12px;color:#dceaff}.powered{text-align:center;padding:8px;font-size:10px;color:#7c8b99;border-top:1px solid #eef3f7}@media(max-width:560px){.wrap{width:100%;margin:0}.chat{border-radius:0;min-height:100vh}.body{height:calc(100vh - 315px)}} </style></head><body><main class="wrap"><section class="chat"><header class="head"><img class="logo" id="logo" src="/baseera-logo.svg"><div class="grow"><h1 id="assistantName">المساعد الذكي</h1><p id="brandName">—</p></div><span class="status" id="status">متصل</span></header><div class="body" id="body"></div><div class="tools"><button class="btn" id="helpBtn">👤 طلب مساعدة</button><button class="btn" id="callbackBtn">📞 طلب اتصال</button></div><div class="panel" id="contactPanel"><b id="contactTitle"></b><input id="custName" placeholder="الاسم"><input id="custPhone" placeholder="رقم الهاتف (اختياري)"><input id="custEmail" placeholder="البريد الإلكتروني (اختياري)"><select id="reason"><option value="استفسار عن خدمة">استفسار عن خدمة</option><option value="استفسار عن سعر">استفسار عن سعر</option><option value="مشكلة أو شكوى">مشكلة أو شكوى</option><option value="طلب معلومات إضافية">طلب معلومات إضافية</option><option value="other">سبب آخر</option></select><textarea id="otherReason" placeholder="اكتب السبب" style="display:none"></textarea><div style="display:flex;gap:8px"><button class="btn primary" id="submitContact">إرسال</button><button class="btn" id="cancelContact">إلغاء</button></div><p class="muted" id="contactMsg"></p></div><div class="feedback" id="feedback"><b id="feedbackQ">هل تم حل طلبك؟</b><div class="yn"><button class="btn primary" data-resolved="true">نعم</button><button class="btn" data-resolved="false">لا</button></div><textarea id="feedbackNote" placeholder="ملاحظة اختيارية" style="width:100%;margin-top:8px;padding:10px;border:1px solid #cadbe8;border-radius:10px"></textarea><p class="muted" id="feedbackMsg"></p></div><div class="input"><input id="message" placeholder="اكتب سؤالك هنا..."><button class="btn primary" id="send">➤</button></div><div class="powered">Powered by BASEERA BSR-1</div></section></main><script>const $=x=>document.getElementById(x),params=new URLSearchParams(location.search);let slug=String(params.get('client')||'').trim().toLowerCase(),cfg={},lang='ar',history=[],contactType='callback';const visitorKey=`bsr_visitor_${slug}`,sessionKey=`bsr_session_${slug}`;function uid(prefix){return `${prefix}-${crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}`}let visitorId=localStorage.getItem(visitorKey)||uid('v');localStorage.setItem(visitorKey,visitorId);let sessionId=sessionStorage.getItem(sessionKey)||uid('s');sessionStorage.setItem(sessionKey,sessionId);function add(text,type){const d=document.createElement('div');d.className=`msg ${type}`;d.textContent=text;$('body').appendChild(d);$('body').scrollTop=$('body').scrollHeight;return d}async function load(){const r=await fetch(`/api/client-config?client=${encodeURIComponent(slug)}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Client not found');cfg=d.client||{};lang=cfg.default_language==='en'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.style.setProperty('--c',cfg.primary_color||'#1769e0');$('assistantName').textContent=lang==='ar'?(cfg.assistant_name_ar||'المساعد الذكي'):(cfg.assistant_name_en||'AI Assistant');$('brandName').textContent=cfg.brand_name||cfg.name||'';if(cfg.logo_url)$('logo').src=cfg.logo_url;const welcome=lang==='ar'?(cfg.welcome_message_ar||'مرحبًا، كيف أستطيع مساعدتك؟'):(cfg.welcome_message_en||'Hello, how can I help you?');add(welcome,'bot');$('message').placeholder=lang==='ar'?'اكتب سؤالك هنا...':'Type your question...';$('helpBtn').textContent=lang==='ar'?'👤 طلب مساعدة':'👤 Request help';$('callbackBtn').textContent=lang==='ar'?'📞 طلب اتصال':'📞 Request callback';$('feedbackQ').textContent=lang==='ar'?'هل تم حل طلبك؟':'Was your request resolved?';fetch('/api/assistant-events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'visit',client_slug:slug,visitor_id:visitorId,session_id:sessionId})}).catch(()=>{});}async function send(){const text=$('message').value.trim();if(!text)return;$('message').value='';add(text,'user');history.push({role:'user',content:text});$('send').disabled=true;const bot=add(lang==='ar'?'جاري الرد...':'Replying...','bot');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,language:lang,session_id:sessionId,client_slug:slug})});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(r.status===429?(lang==='ar'?'تم الوصول إلى حد استخدام AI لهذه الباقة.':'AI usage limit reached.'):(d.error||'Error'))}bot.textContent='';const reader=r.body.getReader(),dec=new TextDecoder();let buf='',answer='';while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.trim())continue;let e;try{e=JSON.parse(line)}catch{continue}if(e.type==='delta'){answer+=e.text||'';bot.textContent=answer;$('body').scrollTop=$('body').scrollHeight}}}history.push({role:'assistant',content:answer||bot.textContent});$('feedback').classList.add('show')}catch(e){bot.textContent=e.message}finally{$('send').disabled=false}}function openContact(type){contactType=type;$('contactPanel').classList.add('open');$('contactTitle').textContent=type==='callback'?(lang==='ar'?'طلب اتصال':'Request callback'):(lang==='ar'?'طلب مساعدة':'Request help')}async function submitContact(){const reason=$('reason').value==='other'?$('otherReason').value:$('reason').value;const payload={client_slug:slug,session_id:sessionId,request_type:contactType,customer_name:$('custName').value,phone:$('custPhone').value,email:$('custEmail').value,reason,language:lang};const r=await fetch('/api/contact-v2',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok){$('contactMsg').textContent=d.error||'Error';return}$('contactMsg').textContent=lang==='ar'?'تم إرسال الطلب بنجاح ✓':'Request sent ✓';setTimeout(()=>$('contactPanel').classList.remove('open'),900)}$('send').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter')send()};$('helpBtn').onclick=()=>openContact('human_handoff');$('callbackBtn').onclick=()=>openContact('callback');$('cancelContact').onclick=()=>$('contactPanel').classList.remove('open');$('submitContact').onclick=submitContact;$('reason').onchange=()=>$('otherReason').style.display=$('reason').value==='other'?'block':'none';document.querySelectorAll('[data-resolved]').forEach(b=>b.onclick=async()=>{const resolved=b.dataset.resolved==='true';const r=await fetch('/api/assistant-events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'feedback',client_slug:slug,session_id:sessionId,resolved,note:$('feedbackNote').value})});$('feedbackMsg').textContent=r.ok?(lang==='ar'?'شكرًا لتقييمك ✓':'Thank you ✓'):(lang==='ar'?'تعذر حفظ التقييم':'Unable to save feedback');if(r.ok)document.querySelectorAll('[data-resolved]').forEach(x=>x.disabled=true)});load().catch(e=>add(e.message,'bot'));</script></body></html>
