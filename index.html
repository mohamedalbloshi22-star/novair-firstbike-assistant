<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVAIRE Smart Response</title>

  <style>
    :root{
      --bg:#171717;
      --card:#232323;
      --line:#3a3a3a;
      --gold:#f2a93b;
      --text:#f5f1e8;
      --muted:#b9b2a7;
      --red:#bf4936;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Tahoma,sans-serif;
    }

    button,
    input{
      font-family:inherit;
    }

    .topbar{
      background:var(--gold);
      color:#161616;
      text-align:center;
      padding:8px 12px;
      font-size:13px;
      font-weight:bold;
    }

    .container{
      width:min(760px,calc(100% - 32px));
      margin:auto;
      padding-bottom:120px;
    }

    .language-area{
      display:flex;
      justify-content:flex-end;
      margin-top:16px;
    }

    html[dir="ltr"] .language-area{
      justify-content:flex-start;
    }

    .language-switch{
      display:flex;
      border:1px solid var(--line);
      border-radius:8px;
      overflow:hidden;
    }

    .lang-btn{
      border:0;
      padding:9px 14px;
      cursor:pointer;
      background:var(--card);
      color:var(--muted);
      font-weight:bold;
    }

    .lang-btn.active{
      background:var(--gold);
      color:#161616;
    }

    .header{
      padding:24px 0;
      border-bottom:2px solid var(--line);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:13px;
    }

    .logo{
      width:48px;
      height:48px;
      border-radius:8px;
      background:var(--gold);
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      font-size:18px;
    }

    h1{
      margin:0;
      font-size:29px;
    }

    .subtitle{
      color:var(--gold);
      font-size:14px;
      margin-top:5px;
    }

    .info{
      color:var(--muted);
      font-size:14px;
      margin-top:18px;
      line-height:1.8;
    }

    .info strong{
      color:var(--text);
    }

    .section{
      margin-top:30px;
    }

    .section h2{
      font-size:19px;
      margin-bottom:14px;
    }

    .price-row{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:9px;
      padding:13px 14px;
      margin-bottom:9px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .price{
      background:var(--red);
      padding:6px 11px;
      border-radius:6px;
      font-size:13px;
      font-weight:bold;
    }

    .services{
      display:flex;
      flex-wrap:wrap;
      gap:9px;
      margin-top:28px;
    }

    .service{
      border:1px solid var(--line);
      background:var(--card);
      border-radius:20px;
      padding:9px 14px;
      font-size:13px;
    }

    .note{
      margin-top:28px;
      border:1px solid var(--line);
      background:var(--card);
      padding:16px;
      border-radius:9px;
      line-height:1.7;
      color:var(--muted);
      font-size:14px;
    }

    .empty-state{
      color:var(--muted);
      font-size:14px;
      padding:14px 0;
    }

    .loading-screen{
      text-align:center;
      padding:80px 20px;
      color:var(--muted);
    }

    .error-screen{
      text-align:center;
      padding:80px 20px;
      color:#ff8170;
    }

    .chat-launcher{
      position:fixed;
      left:20px;
      bottom:20px;
      background:var(--gold);
      color:#111;
      border:0;
      border-radius:10px;
      padding:14px 17px;
      cursor:pointer;
      font-weight:bold;
      z-index:20;
      box-shadow:0 8px 30px rgba(0,0,0,.4);
    }

    html[dir="ltr"] .chat-launcher{
      left:auto;
      right:20px;
    }

    .chat{
      position:fixed;
      left:20px;
      bottom:20px;
      width:min(390px,calc(100vw - 32px));
      height:min(650px,calc(100vh - 40px));
      background:var(--card);
      border:1px solid var(--line);
      border-radius:13px;
      overflow:hidden;
      display:none;
      flex-direction:column;
      z-index:30;
      box-shadow:0 20px 60px rgba(0,0,0,.6);
    }

    html[dir="ltr"] .chat{
      left:auto;
      right:20px;
    }

    .chat.open{
      display:flex;
    }

    .chat-header{
      background:#191919;
      border-bottom:2px solid var(--gold);
      padding:13px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .chat-header-title{
      font-weight:bold;
      font-size:14px;
    }

    .status{
      color:var(--muted);
      font-size:11px;
      margin-top:4px;
    }

    .close-btn{
      background:transparent;
      border:0;
      color:var(--text);
      font-size:20px;
      cursor:pointer;
    }

    .chat-body{
      flex:1;
      padding:14px;
      overflow-y:auto;
      background:var(--bg);
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .msg{
      max-width:85%;
      border-radius:10px;
      padding:10px 12px;
      line-height:1.6;
      font-size:14px;
    }

    .msg.bot{
      align-self:flex-start;
      background:var(--card);
      border:1px solid var(--line);
    }

    .msg.user{
      align-self:flex-end;
      background:var(--gold);
      color:#111;
    }

    .typing{
      align-self:flex-start;
      color:var(--muted);
      background:var(--card);
      border:1px solid var(--line);
      padding:9px 12px;
      border-radius:9px;
      font-size:13px;
    }

    .quick-area{
      padding:8px 12px;
      background:var(--bg);
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .quick-btn{
      background:transparent;
      border:1px solid var(--gold);
      color:var(--gold);
      border-radius:20px;
      padding:7px 10px;
      cursor:pointer;
      font-size:12px;
    }

    .contact-actions{
      padding:8px 12px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      background:var(--bg);
    }

    .contact-action-btn{
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      border-radius:8px;
      padding:9px 7px;
      cursor:pointer;
      font-size:12px;
      font-weight:bold;
    }

    .contact-form{
      margin:0 12px 8px;
      padding:12px;
      background:#191919;
      border:1px solid var(--line);
      border-radius:9px;
    }

    .contact-form-title{
      font-size:13px;
      font-weight:bold;
      margin-bottom:9px;
    }

    .contact-form input{
      width:100%;
      background:var(--bg);
      border:1px solid var(--line);
      color:var(--text);
      border-radius:7px;
      padding:9px 10px;
      margin-bottom:7px;
      outline:none;
    }

    .privacy-note{
      color:var(--muted);
      font-size:10px;
      line-height:1.5;
      margin:2px 0 9px;
    }

    .contact-form-buttons{
      display:flex;
      gap:7px;
    }

    .contact-form-buttons button{
      flex:1;
      border:0;
      border-radius:7px;
      padding:9px;
      cursor:pointer;
      font-weight:bold;
    }

    .submit-contact{
      background:var(--gold);
      color:#111;
    }

    .cancel-contact{
      background:#333;
      color:var(--text);
    }

    .contact-message{
      margin-top:8px;
      font-size:12px;
      line-height:1.5;
    }

    .contact-message.success{
      color:#76c893;
    }

    .contact-message.error{
      color:#ff8170;
    }

    .input-area{
      padding:11px;
      border-top:1px solid var(--line);
      display:flex;
      gap:8px;
    }

    .input-area input{
      flex:1;
      border:1px solid var(--line);
      background:var(--bg);
      color:var(--text);
      border-radius:8px;
      padding:10px 12px;
      outline:none;
    }

    .input-area button{
      border:0;
      width:42px;
      border-radius:8px;
      background:var(--gold);
      color:#111;
      font-size:18px;
      cursor:pointer;
    }

    .input-area button:disabled{
      opacity:.5;
      cursor:wait;
    }

    @media(max-width:500px){
      .chat{
        left:16px;
        bottom:16px;
        width:calc(100vw - 32px);
        height:calc(100vh - 32px);
      }

      html[dir="ltr"] .chat{
        right:16px;
        left:auto;
      }
    }
  </style>
</head>

<main class="container" id="mainContent">

<script>

/*
==================================================
CLIENT FROM URL
==================================================
*/

const urlParams =
  new URLSearchParams(
    window.location.search
  );

let clientSlug =
  String(
    urlParams.get("client") ||
    "first-bike"
  )
    .trim()
    .toLowerCase();


if(
  !/^[a-z0-9_-]{2,80}$/.test(
    clientSlug
  )
){
  clientSlug =
    "first-bike";
}


/*
==================================================
CLIENT CONFIG
==================================================
*/

let clientConfig = null;


/*
==================================================
TRANSLATIONS
==================================================
*/

const translations = {

  ar:{

    topbar:

    humanTitle:

      "طلب اتصال",

    namePlaceholder:

    phonePlaceholder:

    reasonPlaceholder:

    privacy:

    submit:

    cancel:
      "إلغاء",

    required:
      "يرجى إدخال الاسم ورقم الهاتف.",

    contactSuccess:
      "تم تسجيل طلبك بنجاح ✓",

    contactError:
      "تعذر تسجيل الطلب. حاول مرة أخرى.",

    loadError:
      "تعذر تحميل بيانات المنشأة.",

    quickQuestions:[
      {
        label:"📍 الموقع",
        message:"وين موقعكم؟"
      },
      {
        label:"🕒 أوقات الدوام",
        message:"ما هي أوقات الدوام؟"
      },
      {
        label:"🧾 الخدمات",
        message:"ما هي الخدمات التي تقدمونها؟"
      }
    ]
  },


  en:{
    dir:"ltr",

    topbar:
      "Powered by NOVAIRE Smart Response",

    locationLabel:
      "Location",

    hoursLabel:
      "Hours",

    pricesTitle:
      "Prices",

    noPrices:
      "No public prices are currently available.",

    noServices:
      "No services are currently listed.",

    noteLabel:
      "Note",

    launcher:
      "⚡ Chat with Smart Assistant",

    chatStatus:
      "Online now",

    placeholder:
      "Type your question here...",

    defaultWelcome:
      "Hi 👋 How can I help you?",

    error:
      "Sorry, something went wrong. Please try again.",

    typing:
      "Typing...",

    humanBtn:
      "👤 Talk to a person",

    callbackBtn:
      "📞 Request a callback",

    humanTitle:
      "Talk to a representative",

    callbackTitle:
      "Request a callback",

    namePlaceholder:
      "Your name",

    phonePlaceholder:
      "Phone number",

    reasonPlaceholder:
      "Reason for contact (optional)",

    privacy:
      "Your contact details will only be used to process this request and contact you.",

    submit:
      "Send request",

    cancel:
      "Cancel",

    required:
      "Please enter your name and phone number.",

    contactSuccess:
      "Your request has been recorded successfully ✓",

    contactError:
      "We couldn't record your request. Please try again.",

    loadError:
      "Unable to load business information.",

    quickQuestions:[
      {
        label:"📍 Location",
        message:"Where are you located?"
      },
      {
        label:"🕒 Opening hours",
        message:"What are your opening hours?"
      },
      {
        label:"🧾 Services",
        message:"What services do you provide?"
      }
    ]
  }
};


/*
==================================================
LANGUAGE
==================================================
*/

let language =
  localStorage.getItem(
    "novaire_language"
  ) || "ar";


/*
==================================================
SESSION
==================================================
*/

const sessionStorageKey =
  `novaire_session_${clientSlug}_v4`;

let sessionId =
  sessionStorage.getItem(
    sessionStorageKey
  );


if(!sessionId){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
    "function"
  ){

    sessionId =
      `${clientSlug}-` +
      window.crypto.randomUUID();

  }else{

    sessionId =
      `${clientSlug}-` +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,10);
  }

  sessionStorage.setItem(
    sessionStorageKey,
    sessionId
  );
}


/*
==================================================
STATE
==================================================
*/

let history = [];
let selectedContactType = null;


/*
==================================================
ELEMENTS
==================================================
*/

const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );

const clientContent =
  document.getElementById(
    "clientContent"
  );

const chat =
  document.getElementById(
    "chat"
  );

const chatBody =
  document.getElementById(
    "chatBody"
  );

const launcher =
  document.getElementById(

  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const sendBtn =
  document.getElementById(
    "sendBtn"
  );

const quickArea =
  document.getElementById(
    "quickArea"
  );

const contactForm =
  document.getElementById(
    "contactForm"
  );

const customerName =
  document.getElementById(
    "customerName"
  );

const customerPhone =
  document.getElementById(
    "customerPhone"
  );

const contactReason =
  document.getElementById(
    "contactReason"
  );

const contactMessage =
  document.getElementById(
    "contactMessage"
  );

const submitContactBtn =
  document.getElementById(
    "submitContactBtn"
  );


/*
==================================================
CLIENT CONFIG LOAD
==================================================
*/

async function loadClientConfig(){

  const response =
    await fetch(
      `/api/client-config?client=${encodeURIComponent(clientSlug)}`
    );

  if(!response.ok){

    throw new Error(
      "Unable to load client"
    );
  }

  const data =
    await response.json();

  if(
    !data ||
    !data.success ||
    !data.client
  ){
    throw new Error(
      "Invalid client response"
    );
  }

  clientConfig =
    data.client;

  if(
    !localStorage.getItem(
      "novaire_language"
    )
  ){
    language =
      clientConfig.default_language === "en"
        ? "en"
        : "ar";
  }
}


/*
==================================================
HELPERS
==================================================
*/

function localized(
  key
){

  if(!clientConfig){
    return "";
  }

  const suffix =
    language === "en"
      ? "_en"
      : "_ar";

  return String(
    clientConfig[
      `${key}${suffix}`
    ] || ""
  ).trim();
}


function businessName(){

  return String(
    clientConfig?.name ||
    "NOVAIRE Client"
  ).trim();
}


function assistantName(){

  const value =
    language === "en"
      ? clientConfig?.assistant_name_en
      : clientConfig?.assistant_name_ar;

  return String(
    value ||
    businessName()
  ).trim();
}


function getInitials(name){

  const parts =
    String(name || "")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(parts.length === 0){
    return "NV";
  }

  return parts
    .slice(0,2)
    .map(
      part =>
        part.charAt(0)
    )
    .join("")
    .toUpperCase();
}


/*
==================================================
SAFE HTML
==================================================
*/

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatMessage(text){

  return escapeHtml(text)
    .replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    )
    .replace(/\n/g,"<br>");
}


/*
==================================================
CLIENT PAGE RENDER
==================================================
*/

function renderClientPage(){

  const t =
    translations[language];

  const name =
    businessName();

  document.title =
    `${name} — NOVAIRE Smart Response`;

  document.documentElement.lang =
    language;

  document.documentElement.dir =
    t.dir;

  document.getElementById(
    "topbar"
  ).textContent =
    t.topbar;

  document.getElementById(
    "businessName"
  ).textContent =
    name;

  document.getElementById(
    "logo"
  ).textContent =
    getInitials(name);

  document.getElementById(
    "subtitle"
  ).textContent =
    localized(
      "business_type"
    );


  /*
  ----------------------------------------------
  Location + Hours
  ----------------------------------------------
  */

  const infoLines = [];

  const location =
    localized("location");

  const hours =
    localized(
      "working_hours"
    );

  if(location){

    infoLines.push(
      `<strong>${escapeHtml(t.locationLabel)}:</strong> ${escapeHtml(location)}`
    );
  }

  if(hours){

    infoLines.push(
      `<strong>${escapeHtml(t.hoursLabel)}:</strong> ${escapeHtml(hours)}`
    );
  }

  document.getElementById(
    "info"
  ).innerHTML =
    infoLines.join("<br>");


  /*
  ----------------------------------------------
  Prices
  ----------------------------------------------
  */

  const prices =
    Array.isArray(
      clientConfig.rental_prices
    )
      ? clientConfig.rental_prices
      : [];

  const pricesContainer =
    document.getElementById(
      "pricesContainer"
    );

  const pricesSection =
    document.getElementById(
      "pricesSection"
    );

  document.getElementById(
    "pricesTitle"
  ).textContent =
    t.pricesTitle;

  pricesContainer.innerHTML =
    "";

  if(prices.length === 0){

    pricesSection.style.display =
      "none";

  }else{

    pricesSection.style.display =
      "block";

    prices.forEach(
      item => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "price-row";

        const label =
          document.createElement(
            "strong"
          );

        label.textContent =
          String(
            item.label || ""
          );

        const price =
          document.createElement(
            "span"
          );

        price.className =
          "price";

        const unit =
          language === "en"
            ? item.unit_en
            : item.unit_ar;

        price.textContent =
          `${item.price ?? ""}${unit ? " " + unit : ""}`;

        row.appendChild(
          label
        );

        row.appendChild(
          price
        );

        pricesContainer.appendChild(
          row
        );
      }
    );
  }


  /*
  ----------------------------------------------
  Services
  ----------------------------------------------
  */

  const services =
    Array.isArray(
      clientConfig[
        language === "en"
          ? "services_en"
          : "services_ar"
      ]
    )
      ? clientConfig[
          language === "en"
            ? "services_en"
            : "services_ar"
        ]
      : [];

  const servicesContainer =
    document.getElementById(
      "servicesContainer"
    );

  servicesContainer.innerHTML =
    "";

  services.forEach(
    service => {

      const item =
        document.createElement(
          "span"
        );

      item.className =
        "service";

      item.textContent =
        service;

      servicesContainer.appendChild(
        item
      );
    }
  );


  /*
  ----------------------------------------------
  Notes
  ----------------------------------------------
  */

  const note =
    localized("notes");

  const noteElement =
    document.getElementById(
      "note"
    );

  if(note){

    noteElement.style.display =
      "block";

    noteElement.innerHTML =
      `<strong>${escapeHtml(t.noteLabel)}:</strong> ${escapeHtml(note)}`;

  }else{

    noteElement.style.display =
      "none";
  }


  /*
  ----------------------------------------------
  Chat
  ----------------------------------------------
  */

  launcher.textContent =
    t.launcher;

  document.getElementById(
    "chatName"
  ).textContent =
    assistantName();

  document.getElementById(
    "chatStatus"
  ).textContent =
    t.chatStatus;

  messageInput.placeholder =
    t.placeholder;

  document.getElementById(
    "humanBtn"
  ).textContent =
    t.humanBtn;

  document.getElementById(
    "callbackBtn"
  ).textContent =
    t.callbackBtn;

  customerName.placeholder =
    t.namePlaceholder;

  customerPhone.placeholder =
    t.phonePlaceholder;

  contactReason.placeholder =
    t.reasonPlaceholder;

  document.getElementById(
    "privacyNote"
  ).textContent =
    t.privacy;

  submitContactBtn.textContent =
    t.submit;

  document.getElementById(
    "cancelContactBtn"
  ).textContent =
    t.cancel;

  document.getElementById(
    "arabicBtn"
  ).classList.toggle(
    "active",
    language === "ar"
  );

  document.getElementById(
    "englishBtn"
  ).classList.toggle(
    "active",
    language === "en"
  );


  renderQuickQuestions();
}


/*
==================================================
WELCOME
==================================================
*/

function getWelcomeMessage(){

  const custom =
    language === "en"
      ? clientConfig?.welcome_message_en
      : clientConfig?.welcome_message_ar;

  if(
    String(custom || "").trim()
  ){
    return String(
      custom
    ).trim();
  }

  if(language === "en"){

    return `Hi 👋 I'm the ${assistantName()}. How can I help you?`;
  }

  return `هلا فيك 👋 أنا ${assistantName()}. كيف أقدر أساعدك؟`;
}


/*
==================================================
MESSAGES
==================================================
*/

function addMessage(
  text,
  sender
){

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "msg " + sender;

  message.innerHTML =
    formatMessage(text);

  chatBody.appendChild(
    message
  );

  chatBody.scrollTop =
    chatBody.scrollHeight;

  return message;
}


function createStreamingMessage(){

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "msg bot";

  chatBody.appendChild(
    message
  );

  chatBody.scrollTop =
    chatBody.scrollHeight;

  return message;
}


function updateStreamingMessage(
  element,
  text
){

  if(!element){
    return;
  }

  element.innerHTML =
    formatMessage(text);

  chatBody.scrollTop =
    chatBody.scrollHeight;
}


/*
==================================================
TYPING
==================================================
*/

function showTyping(){

  removeTyping();

  const typing =
    document.createElement(
      "div"
    );

  typing.className =
    "typing";

  typing.id =
    "typing";

  typing.textContent =
    translations[
      language
    ].typing;

  chatBody.appendChild(
    typing
  );

  chatBody.scrollTop =
    chatBody.scrollHeight;
}


function removeTyping(){

  const typing =
    document.getElementById(
      "typing"
    );

  if(typing){
    typing.remove();
  }
}


/*
==================================================
QUICK QUESTIONS
==================================================
*/

function renderQuickQuestions(){

  quickArea.innerHTML =
    "";

  translations[
    language
  ].quickQuestions.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "quick-btn";

      button.type =
        "button";

      button.textContent =
        item.label;

      button.addEventListener(
        "click",
        () => {
          sendMessage(
            item.message
          );
        }
      );

      quickArea.appendChild(
        button
      );
    }
  );
}


/*
==================================================
LANGUAGE
==================================================
*/

function changeLanguage(
  newLanguage
){

  if(
    newLanguage !== "ar" &&
    newLanguage !== "en"
  ){
    return;
  }

  language =
    newLanguage;

  localStorage.setItem(
    "novaire_language",
    language
  );

  renderClientPage();

  if(selectedContactType){

    const t =
      translations[
        language
      ];

    document.getElementById(
      "contactFormTitle"
    ).textContent =

      selectedContactType ===
      "human_handoff"
        ? t.humanTitle
        : t.callbackTitle;
  }
}


/*
==================================================
CONTACT
==================================================
*/

function openContactForm(
  type
){

  selectedContactType =
    type;

  const t =
    translations[
      language
    ];

  document.getElementById(
    "contactFormTitle"
  ).textContent =

    type === "human_handoff"
      ? t.humanTitle
      : t.callbackTitle;

  contactMessage.textContent =
    "";

  contactForm.style.display =
    "block";

  customerName.focus();
}


function closeContactForm(){

  contactForm.style.display =
    "none";

  selectedContactType =
    null;

  contactMessage.textContent =
    "";
}


async function submitContactRequest(){

  const t =
    translations[
      language
    ];

  const name =
    customerName.value.trim();

  const phone =
    customerPhone.value.trim();

  const reason =
    contactReason.value.trim();

  if(!name || !phone){

    contactMessage.textContent =
      t.required;

    contactMessage.className =
      "contact-message error";

    return;
  }

  submitContactBtn.disabled =
    true;

  try{

    const response =
      await fetch(
        "/api/contact",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              client_slug:
                clientSlug,

              session_id:
                sessionId,

              request_type:
                selectedContactType,

              customer_name:
                name,

              phone,
              reason
            })
        }
      );

    if(!response.ok){

      throw new Error(
        "Contact request failed"
      );
    }

    contactMessage.textContent =
      t.contactSuccess;

    contactMessage.className =
      "contact-message success";

    customerName.value =
      "";

    customerPhone.value =
      "";

    contactReason.value =
      "";

    setTimeout(
      closeContactForm,
      1800
    );

  }catch(error){

    console.error(error);

    contactMessage.textContent =
      t.contactError;

    contactMessage.className =
      "contact-message error";

  }finally{

    submitContactBtn.disabled =
      false;
  }
}


/*
==================================================
STREAM
==================================================
*/

async function readChatStream(
  response,
  streamingMessage
){

  if(!response.body){

    throw new Error(
      "Streaming not supported"
    );
  }

  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder();

  let buffer = "";
  let fullAnswer = "";
  let receivedDelta = false;


  while(true){

    const {
      value,
      done
    } = await reader.read();

    if(done){
      break;
    }

    buffer +=
      decoder.decode(
        value,
        {
          stream:true
        }
      );

    const lines =
      buffer.split("\n");

    buffer =
      lines.pop() || "";

    for(const rawLine of lines){

      const line =
        rawLine.trim();

      if(!line){
        continue;
      }

      let event;

      try{

        event =
          JSON.parse(line);

      }catch{

        continue;
      }

      if(
        event.type === "delta" &&
        typeof event.text === "string"
      ){

        if(!receivedDelta){

          receivedDelta =
            true;

          removeTyping();
        }

        fullAnswer +=
          event.text;

        updateStreamingMessage(
          streamingMessage,
          fullAnswer
        );
      }

      if(
        event.type === "error"
      ){

        throw new Error(
          event.error ||
          "Chat stream error"
        );
      }
    }
  }


  const finalLine =
    buffer.trim();

  if(finalLine){

    try{

      const event =
        JSON.parse(
          finalLine
        );

      if(
        event.type === "delta" &&
        typeof event.text === "string"
      ){

        removeTyping();

        fullAnswer +=
          event.text;

        updateStreamingMessage(
          streamingMessage,
          fullAnswer
        );
      }

    }catch{}
  }


  return fullAnswer.trim();
}


/*
==================================================
SEND MESSAGE
==================================================
*/

async function sendMessage(
  text
){

  const cleanText =
    String(text || "")
      .trim();

  if(
    !cleanText ||
    sendBtn.disabled
  ){
    return;
  }

  addMessage(
    cleanText,
    "user"
  );

  history.push({
    role:"user",
    content:cleanText
  });

  messageInput.value =
    "";

  sendBtn.disabled =
    true;

  showTyping();

  let streamingMessage =
    null;

  let fullAnswer =
    "";


  try{

    const response =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              client_slug:
                clientSlug,

              messages:
                history,

              language,

              session_id:
                sessionId
            })
        }
      );


    if(!response.ok){

      const text =
        await response.text();

      throw new Error(
        `Request failed ${response.status}: ${text}`
      );
    }


    streamingMessage =
      createStreamingMessage();


    fullAnswer =
      await readChatStream(
        response,
        streamingMessage
      );


    removeTyping();


    if(!fullAnswer){

      if(streamingMessage){
        streamingMessage.remove();
      }

      throw new Error(
        "Empty assistant response"
      );
    }


    history.push({
      role:"assistant",
      content:
        fullAnswer
    });


  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );

    removeTyping();


    if(
      streamingMessage &&
      !fullAnswer
    ){
      streamingMessage.remove();
    }


    if(!fullAnswer){

      addMessage(
        translations[
          language
        ].error,
        "bot"
      );
    }

  }finally{

    sendBtn.disabled =
      false;

    messageInput.focus();
  }
}


/*
==================================================
EVENTS
==================================================
*/

document.getElementById(
  "arabicBtn"
).addEventListener(
  "click",
  () => changeLanguage(
    "ar"
  )
);


document.getElementById(
  "englishBtn"
).addEventListener(
  "click",
  () => changeLanguage(
    "en"
  )
);


document.getElementById(
  "humanBtn"
).addEventListener(
  "click",
  () => openContactForm(
    "human_handoff"
  )
);


document.getElementById(
  "callbackBtn"
).addEventListener(
  "click",
  () => openContactForm(
    "callback"
  )
);


submitContactBtn.addEventListener(
  "click",
  submitContactRequest
);


document.getElementById(
  "cancelContactBtn"
).addEventListener(
  "click",
  closeContactForm
);


launcher.addEventListener(
  "click",
  () => {

    chat.classList.add(
      "open"
    );

    launcher.style.display =
      "none";


    if(
      chatBody.children.length === 0
    ){

      addMessage(
        getWelcomeMessage(),
        "bot"
      );
    }


    messageInput.focus();
  }
);


document.getElementById(
  "closeBtn"
).addEventListener(
  "click",
  () => {

    chat.classList.remove(
      "open"
    );

    launcher.style.display =
      "block";
  }
);


sendBtn.addEventListener(
  "click",
  () => sendMessage(
    messageInput.value
  )
);


messageInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage(
        messageInput.value
      );
    }
  }
);


/*
==================================================
START
==================================================
*/

async function startApp(){

  try{

    await loadClientConfig();

    loadingScreen.style.display =
      "none";

    clientContent.style.display =
      "block";

    launcher.style.display =
      "block";

    renderClientPage();

  }catch(error){

    console.error(
      "APP START ERROR:",
      error
    );

    loadingScreen.className =
      "error-screen";

    loadingScreen.textContent =
      translations[
        language
      ].loadError;
  }
}


startApp();

</script>
