<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVAIRE | إدارة العملاء</title><link rel="stylesheet" href="/novaire-light.css"></head><body><header class="nv-header"><div class="nv-header-inner"><h1>NOVAIRE | إدارة العملاء والباقات</h1><p>إضافة العميل، اختيار الباقة، ومتابعة حالة الاشتراك من مكان واحد</p></div></header><main class="nv-container"><div id="msg"></div><section class="nv-panel"><div class="nv-actions"><button id="back" class="nv-btn secondary">لوحة الإدارة</button><button id="refresh" class="nv-btn">تحديث العملاء</button><button id="logout" class="nv-btn danger">تسجيل الخروج</button></div></section><section class="nv-section"><h2>إضافة عميل جديد</h2><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div><label><b>اسم العميل *</b></label><input id="name" class="nv-input" placeholder="مثال: Al Ain Clinic"></div><div><label><b>الرابط / Slug *</b></label><input id="slug" class="nv-input" placeholder="al-ain-clinic"></div><div><label><b>الباقة *</b></label><select id="plan" class="nv-select"><option value="">— اختر الباقة —</option></select></div><div><label><b>حد مخصص لردود AI</b></label><input id="customLimit" type="number" class="nv-input" placeholder="اختياري"></div><div><label><b>رسوم تأسيس مخصصة</b></label><input id="setupOverride" type="number" class="nv-input" placeholder="اختياري"></div><div><label><b>اشتراك شهري مخصص</b></label><input id="monthlyOverride" type="number" class="nv-input" placeholder="اختياري"></div></div><div id="planSummary" class="nv-message" style="margin-top:14px">اختر الباقة لعرض تفاصيلها.</div><button id="create" class="nv-btn success">إنشاء العميل وتفعيل الباقة</button></section><section class="nv-section"><h2>العملاء الحاليون</h2><div class="nv-table-wrap"><table class="nv-table"><thead><tr><th>العميل</th><th>الباقة</th><th>الحد</th><th>المستخدم</th><th>المتبقي</th><th>الاستهلاك</th><th>التجديد</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="clients"><tr><td colspan="9">جاري التحميل...</td></tr></tbody></table></div></section></main><script>const $=id=>document.getElementById(id);let plans=[];function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function msg(t,error=false){$('msg').innerHTML=`<div class="nv-message${error?' error':''}">${esc(t)}</div>`}async function auth(){const r=await fetch('/api/admin-auth',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok||!d.authenticated){location='/control.html';return false}return true}async function loadPlans(){const r=await fetch('/api/packages',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل الباقات');plans=d.plans||[];$('plan').innerHTML='<option value="">— اختر الباقة —</option>'+plans.map(p=>`<option value="${esc(p.code)}">${esc(p.name)} — ${Number(p.monthly_ai_responses).toLocaleString()} رد / ${Number(p.monthly_fee_aed).toLocaleString()} درهم</option>`).join('')}function showPlan(){const p=plans.find(x=>x.code===$('plan').value);if(!p){$('planSummary').textContent='اختر الباقة لعرض تفاصيلها.';return}$('planSummary').innerHTML=`<b>${esc(p.name)}</b> — حد شهري ${Number(p.monthly_ai_responses).toLocaleString()} رد AI — تأسيس ${Number(p.setup_fee_aed).toLocaleString()} درهم — اشتراك ${Number(p.monthly_fee_aed).toLocaleString()} درهم شهرياً.`}async function loadAdminUsage(){const r=await fetch('/api/admin-usage',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل بيانات الباقات');return d.clients||[]}function usageMap(rows){const m=new Map();for(const x of rows)m.set(String(x.slug||'').toLowerCase(),x);return m}function stateBadge(active,u){if(active===false)return '<span class="nv-badge danger">موقوف</span>';if(!u?.plan_code)return '<span class="nv-badge danger">بدون باقة</span>';if(u.warning_level==='CAP_REACHED')return '<span class="nv-badge danger">عند الحد</span>';return '<span class="nv-badge success">نشط</span>'}async function listClients(){const [r,usageRows]=await Promise.all([fetch('/api/client-admin',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'list'})}),loadAdminUsage()]);const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تحميل العملاء');const c=d.clients||[],um=usageMap(usageRows);$('clients').innerHTML=c.length?c.map(x=>{const u=um.get(String(x.slug||'').toLowerCase())||{},limit=Number(u.monthly_limit||0),used=Number(u.used||0),remaining=Number(u.remaining||Math.max(limit-used,0)),pct=Number(u.usage_percent||0);return `<tr><td><b>${esc(x.name||x.slug)}</b><div class="nv-sub">${esc(x.slug)}</div></td><td>${esc(u.plan_name||'—')}</td><td>${limit?limit.toLocaleString():'—'}</td><td>${used.toLocaleString()}</td><td>${limit?remaining.toLocaleString():'—'}</td><td><span class="nv-badge ${pct>=95?'danger':pct>=70?'warn':'success'}">${pct.toFixed(1)}%</span></td><td>${esc(u.cycle_end||'—')}</td><td>${stateBadge(x.active,u)}</td><td><button class="nv-btn secondary" onclick="openClient('${esc(x.slug)}')">فتح</button></td></tr>`}).join(''):'<tr><td colspan="9">لا يوجد عملاء.</td></tr>'}function openClient(slug){localStorage.setItem('novaire_control_client',slug);location='/admin-light.html'}async function createClient(){const name=$('name').value.trim(),slug=$('slug').value.trim(),plan_code=$('plan').value;if(!name||!slug){msg('أدخل اسم العميل والرابط.',true);return}if(!plan_code){msg('يجب تحديد الباقة قبل إضافة العميل.',true);return}$('create').disabled=true;try{const r=await fetch('/api/client-create-with-plan',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name,slug,plan_code,custom_ai_limit:$('customLimit').value||null,setup_fee_override_aed:$('setupOverride').value||null,monthly_fee_override_aed:$('monthlyOverride').value||null})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر إنشاء العميل');msg(`تم إنشاء ${d.client.name} وتفعيل ${d.plan.name} بنجاح.`);$('name').value=$('slug').value=$('customLimit').value=$('setupOverride').value=$('monthlyOverride').value='';$('plan').value='';showPlan();await listClients()}catch(e){msg(e.message,true)}finally{$('create').disabled=false}}$('plan').onchange=showPlan;$('create').onclick=createClient;$('refresh').onclick=listClients;$('back').onclick=()=>location='/admin-light.html';$('logout').onclick=async()=>{await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'logout'})});location='/control.html'};(async()=>{if(!(await auth()))return;try{await Promise.all([loadPlans(),listClients()])}catch(e){msg(e.message,true)}})();</script></body></html>
