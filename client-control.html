<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BASEERA | Client Control</title><link rel="stylesheet" href="/novaire-light.css"><style>body{background:#eef6fb}.shell{width:min(1100px,94%);margin:24px auto}.hero,.card{background:#fff;border:1px solid #dbe8f2;border-radius:18px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#0b2c5f,#1769e0);color:#fff;display:flex;align-items:center;gap:14px}.hero img{width:64px;background:#fff;border-radius:14px}.hero button{margin-inline-start:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;background:#e9f2fb;color:#17304e;font-weight:700;cursor:pointer}.primary,.active{background:#1769e0;color:#fff}.pane{display:none}.pane.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi,.item{background:#f7fbff;border:1px solid #dbe8f2;border-radius:13px;padding:14px}.kpi b{display:block;font-size:22px;margin-top:6px}label{display:block;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;padding:11px;border:1px solid #cadde8;border-radius:10px;font:inherit}textarea{min-height:90px}.item{margin-top:9px}.muted{color:#64798d}@media(max-width:700px){.grid,.kpis{grid-template-columns:1fr}.hero{flex-wrap:wrap}.hero button{margin-inline-start:0}}</style></head><body><main class="shell"><header class="hero"><img src="/baseera-logo.svg"><div><h1 id="heading">مركز تحكم العميل</h1><div id="clientName"></div></div><button class="btn" id="lang">English</button><button class="btn" id="logout">خروج</button></header><nav class="card tabs" id="tabs"></nav><div id="msg"></div>
<section class="card pane active" data-pane="overview"><h2 data-ar="نظرة عامة" data-en="Overview">نظرة عامة</h2><div class="kpis"><div class="kpi"><span data-ar="مرحلة الخدمة" data-en="Service stage">مرحلة الخدمة</span><b id="stage">—</b></div><div class="kpi"><span data-ar="الجاهزية" data-en="Readiness">الجاهزية</span><b id="ready">—</b></div><div class="kpi"><span data-ar="الباقة" data-en="Package">الباقة</span><b id="planName">—</b></div><div class="kpi"><span data-ar="استخدام AI" data-en="AI usage">استخدام AI</span><b id="usage">—</b></div><div class="kpi"><span data-ar="عناصر المعرفة" data-en="Knowledge items">عناصر المعرفة</span><b id="kc">—</b></div><div class="kpi"><span data-ar="طلبات الدعم" data-en="Support requests">طلبات الدعم</span><b id="sc">—</b></div></div><p><button class="btn primary" id="assistant" data-ar="فتح المساعد" data-en="Open assistant">فتح المساعد</button> <button class="btn" onclick="location='/client-portal.html'" data-ar="الإحصائيات والاستخدام والمحادثات" data-en="Analytics, usage & conversations">الإحصائيات والاستخدام والمحادثات</button> <button class="btn" onclick="location='/support.html'" data-ar="الدعم" data-en="Support">الدعم</button></p></section>
<section class="card pane" data-pane="profile"><h2 data-ar="بيانات المنشأة والإعدادات" data-en="Business profile & settings"></h2><div class="grid" id="profile"></div><p><button class="btn primary" id="save" data-ar="حفظ" data-en="Save"></button></p></section>
<section class="card pane" data-pane="knowledge"><h2 data-ar="قاعدة المعرفة" data-en="Knowledge base"></h2><div class="grid"><textarea id="q" placeholder="Question"></textarea><textarea id="a" placeholder="Answer"></textarea><select id="kl"><option value="ar">العربية</option><option value="en">English</option></select><button class="btn primary" id="add" data-ar="إضافة" data-en="Add"></button></div><div id="knowledge"></div></section>
<section class="card pane" data-pane="support"><h2 data-ar="طلبات الدعم" data-en="Support requests"></h2><div id="support"></div></section></main><script>
const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let D={},L='ar';const F=[['brand_name','الاسم التجاري','Brand name'],['contact_email','البريد','Email'],['billing_email','بريد الفواتير','Billing email'],['contact_phone','الهاتف','Phone'],['location_ar','الموقع — عربي','Location — Arabic'],['location_en','الموقع — إنجليزي','Location — English'],['working_hours_ar','ساعات العمل — عربي','Hours — Arabic'],['working_hours_en','ساعات العمل — إنجليزي','Hours — English']];async function api(action,x={}){const r=await fetch('/api/client-operations',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...x})}),d=await r.json();if(r.status===401)location='/client-login.html';if(!r.ok)throw Error(d.error||'Failed');return d}function i18n(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';$('lang').textContent=L==='ar'?'English':'العربية';$('heading').textContent=L==='ar'?'مركز تحكم العميل':'Client Control Center';$('logout').textContent=L==='ar'?'خروج':'Logout';document.querySelectorAll('[data-ar]').forEach(x=>x.textContent=x.dataset[L]);tabs()}function tabs(){const A=[['overview','نظرة عامة','Overview'],['profile','بيانات المنشأة','Profile'],['knowledge','قاعدة المعرفة','Knowledge'],['support','الدعم','Support']];const active=document.querySelector('[data-tab].active')?.dataset.tab||'overview';$('tabs').innerHTML=A.map(x=>`<button class="btn ${x[0]===active?'active':''}" data-tab="${x[0]}">${L==='ar'?x[1]:x[2]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pane,[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector(`[data-pane=${b.dataset.tab}]`).classList.add('active')})}function render(){const c=D.client||{},cfg=c.config||{},life=D.lifecycle||{},u=D.usage||{};$('clientName').textContent=c.name;$('stage').textContent=life.stage||'—';$('ready').textContent=(life.readiness_percent||0)+'%';$('planName').textContent=u.plan_name||u.plan_code||'—';$('usage').textContent=`${Number(u.used||0).toLocaleString()} / ${Number(u.monthly_limit||0).toLocaleString()}`;$('kc').textContent=(D.knowledge||[]).length;$('sc').textContent=(D.support||[]).length;$('assistant').onclick=()=>location=`/index-light.html?client=${encodeURIComponent(c.slug)}`;$('profile').innerHTML=F.map(f=>`<div><label>${L==='ar'?f[1]:f[2]}</label><input id="f-${f[0]}" value="${esc(cfg[f[0]]||'')}"></div>`).join('')+`<div><label>${L==='ar'?'اللغة الافتراضية':'Default language'}</label><select id="f-default_language"><option value="ar" ${cfg.default_language==='ar'?'selected':''}>العربية</option><option value="en" ${cfg.default_language==='en'?'selected':''}>English</option></select></div>`;$('knowledge').innerHTML=(D.knowledge||[]).map(x=>`<div class="item"><b>${esc(x.question)}</b><p>${esc(x.answer)}</p><span class="muted">${esc(x.language)}</span></div>`).join('')||'—';$('support').innerHTML=(D.support||[]).map(x=>`<div class="item"><b>${esc(x.message)}</b><p>${esc(x.admin_reply||x.auto_answer||x.status)}</p></div>`).join('')||'—';i18n()}async function load(){D=await api('overview');render()}$('save').onclick=async()=>{try{const x={};F.forEach(f=>x[f[0]]=$('f-'+f[0]).value);x.default_language=$('f-default_language').value;await api('profile_update',x);await load()}catch(e){$('msg').textContent=e.message}};$('add').onclick=async()=>{try{await api('knowledge_create',{question:$('q').value,answer:$('a').value,language:$('kl').value});$('q').value=$('a').value='';await load()}catch(e){$('msg').textContent=e.message}};$('lang').onclick=()=>{L=L==='ar'?'en':'ar';render()};$('logout').onclick=async()=>{await fetch('/api/client-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:'{"action":"logout"}'});location='/client-login.html'};i18n();load().catch(e=>$('msg').textContent=e.message);
</script></body></html>
