<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVAIRE — إدارة العملاء</title>

<style>
:root{
  --bg:#0f1115;
  --card:#191c22;
  --card2:#20242c;
  --line:#303641;
  --gold:#d7a84b;
  --text:#f4f4f4;
  --muted:#aab0bb;
  --green:#42b883;
  --red:#e05b62;
  --blue:#5d9cec;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

button,input,textarea,select{
  font-family:inherit;
}

.container{
  width:min(1200px,calc(100% - 28px));
  margin:auto;
  padding:28px 0 60px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.header h1{
  margin:0;
  font-size:26px;
}

.sub{
  color:var(--muted);
  margin-top:6px;
  font-size:13px;
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}

.btn-gold{
  background:var(--gold);
  color:#111;
}

.btn-gray{
  background:#303641;
  color:white;
}

.btn-green{
  background:var(--green);
  color:#08130e;
}

.btn-red{
  background:var(--red);
  color:white;
}

.btn-blue{
  background:var(--blue);
  color:white;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  padding:18px;
  margin-bottom:18px;
}

.login{
  max-width:420px;
  margin:90px auto;
}

.login h2{
  margin-top:0;
}

input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  background:#11141a;
  color:var(--text);
  padding:11px 12px;
  border-radius:8px;
  outline:none;
}

textarea{
  min-height:85px;
  resize:vertical;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.clients-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.client-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
}

.client-card.inactive{
  opacity:.6;
}

.client-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

.slug{
  color:var(--gold);
  direction:ltr;
  text-align:right;
  font-size:12px;
}

.meta{
  color:var(--muted);
  font-size:13px;
  margin:12px 0;
  line-height:1.8;
}

.status{
  display:inline-block;
  border-radius:15px;
  padding:5px 10px;
  font-size:11px;
  margin-bottom:12px;
}

.status.active{
  background:rgba(66,184,131,.15);
  color:#6bd3a4;
}

.status.inactive{
  background:rgba(224,91,98,.15);
  color:#ff858b;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.actions button{
  flex:1;
  min-width:80px;
  padding:8px;
  font-size:11px;
}

.form-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.form-title h2{
  margin:0;
  font-size:20px;
}

.section-title{
  color:var(--gold);
  border-bottom:1px solid var(--line);
  padding-bottom:8px;
  margin:24px 0 14px;
}

.services-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.price-row{
  display:grid;
  grid-template-columns:1fr 120px 1fr 1fr 45px;
  gap:8px;
  margin-bottom:8px;
}

.remove-price{
  background:var(--red);
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:7px;
  display:none;
}

.message.success{
  display:block;
  background:rgba(66,184,131,.12);
  color:#72d7a9;
}

.message.error{
  display:block;
  background:rgba(224,91,98,.12);
  color:#ff858b;
}

.top-actions{
  display:flex;
  gap:8px;
}

.empty{
  color:var(--muted);
  padding:30px;
  text-align:center;
}

.small{
  font-size:11px;
  color:var(--muted);
}

@media(max-width:900px){
  .clients-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  .grid,
  .services-box,
  .clients-grid{
    grid-template-columns:1fr;
  }

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .price-row{
    grid-template-columns:1fr 90px;
  }

  .price-row input:nth-child(3),
  .price-row input:nth-child(4){
    grid-column:span 1;
  }

  .remove-price{
    grid-column:span 2;
    height:36px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <section id="loginView" class="card login">
    <h2>NOVAIRE Admin</h2>
    <div class="sub">إدارة عملاء Smart Response</div>

    <div class="field" style="margin-top:20px">
      <label>كلمة مرور الإدارة</label>
      <input
        id="passwordInput"
        type="password"
        autocomplete="current-password"
        placeholder="••••••••"
      >
    </div>

    <button
      id="loginBtn"
      class="btn btn-gold"
      style="width:100%"
    >
      دخول
    </button>

    <div id="loginMessage" class="message"></div>
  </section>


  <!-- APP -->
  <section id="appView" style="display:none">

    <div class="header">
      <div>
        <h1>إدارة العملاء</h1>
        <div class="sub">
          NOVAIRE Smart Response — Multi Client
        </div>
      </div>

      <div class="top-actions">
        <button
          id="refreshBtn"
          class="btn btn-gray"
        >
          تحديث
        </button>

        <button
          id="newClientBtn"
          class="btn btn-gold"
        >
          + إضافة عميل جديد
        </button>

        <button
          id="logoutBtn"
          class="btn btn-red"
        >
          خروج
        </button>
      </div>
    </div>


    <!-- CLIENTS -->
    <div class="card">
      <div class="form-title">
        <h2>العملاء</h2>
        <span
          id="clientCount"
          class="small"
        ></span>
      </div>

      <div id="clientsContainer">
        <div class="empty">جاري التحميل...</div>
      </div>
    </div>


    <!-- FORM -->
    <div
      id="clientFormCard"
      class="card"
      style="display:none"
    >

      <div class="form-title">
        <h2 id="formHeading">
          إضافة عميل جديد
        </h2>

        <button
          id="closeFormBtn"
          class="btn btn-gray"
        >
          إغلاق
        </button>
      </div>


      <input
        id="clientId"
        type="hidden"
      >


      <div class="section-title">
        البيانات الأساسية
      </div>

      <div class="grid">

        <div class="field">
          <label>اسم العميل *</label>
          <input id="name">
        </div>

        <div class="field">
          <label>
            رابط العميل / Slug *
          </label>
          <input
            id="slug"
            dir="ltr"
            placeholder="example-client"
          >
        </div>

        <div class="field">
          <label>اسم العلامة</label>
          <input id="brandName">
        </div>

        <div class="field">
          <label>اللغة الافتراضية</label>
          <select id="defaultLanguage">
            <option value="ar">
              العربية
            </option>
            <option value="en">
              English
            </option>
          </select>
        </div>

      </div>


      <div class="section-title">
        المساعد الذكي
      </div>

      <div class="grid">

        <div class="field">
          <label>
            اسم المساعد بالعربية
          </label>
          <input id="assistantAr">
        </div>

        <div class="field">
          <label>
            Assistant Name — English
          </label>
          <input id="assistantEn">
        </div>

        <div class="field">
          <label>
            رسالة الترحيب بالعربية
          </label>
          <textarea id="welcomeAr"></textarea>
        </div>

        <div class="field">
          <label>
            Welcome Message — English
          </label>
          <textarea id="welcomeEn"></textarea>
        </div>

      </div>


      <div class="section-title">
        نشاط العميل
      </div>

      <div class="grid">

        <div class="field">
          <label>
            نوع النشاط بالعربية
          </label>
          <input id="businessAr">
        </div>

        <div class="field">
          <label>
            Business Type — English
          </label>
          <input id="businessEn">
        </div>

        <div class="field">
          <label>
            الموقع بالعربية
          </label>
          <input id="locationAr">
        </div>

        <div class="field">
          <label>
            Location — English
          </label>
          <input id="locationEn">
        </div>

        <div class="field">
          <label>
            أوقات العمل بالعربية
          </label>
          <input id="hoursAr">
        </div>

        <div class="field">
          <label>
            Working Hours — English
          </label>
          <input id="hoursEn">
        </div>

      </div>


      <div class="section-title">
        الخدمات
      </div>

      <div class="services-box">

        <div class="field">
          <label>
            الخدمات بالعربية
            — خدمة في كل سطر
          </label>
          <textarea
            id="servicesAr"
            placeholder="الخدمة الأولى&#10;الخدمة الثانية"
          ></textarea>
        </div>

        <div class="field">
          <label>
            Services in English
            — one per line
          </label>
          <textarea
            id="servicesEn"
            placeholder="Service One&#10;Service Two"
          ></textarea>
        </div>

      </div>


      <div class="section-title">
        الأسعار
      </div>

      <div id="pricesContainer"></div>

      <button
        id="addPriceBtn"
        type="button"
        class="btn btn-gray"
      >
        + إضافة سعر
      </button>


      <div class="section-title">
        الملاحظات
      </div>

      <div class="grid">

        <div class="field">
          <label>
            ملاحظات بالعربية
          </label>
          <textarea id="notesAr"></textarea>
        </div>

        <div class="field">
          <label>
            Notes — English
          </label>
          <textarea id="notesEn"></textarea>
        </div>

      </div>


      <div class="field">
        <label>
          <input
            id="active"
            type="checkbox"
            checked
            style="width:auto;margin-left:6px"
          >
          العميل فعال
        </label>
      </div>


      <button
        id="saveClientBtn"
        class="btn btn-green"
        style="min-width:180px"
      >
        حفظ العميل
      </button>

      <div
        id="formMessage"
        class="message"
      ></div>

    </div>

  </section>

</div>


<script>

let adminPassword = "";
let clients = [];


/* ==============================
   ELEMENT HELPERS
============================== */

const $ = id =>
  document.getElementById(id);

function value(id){
  return $(id).value.trim();
}

function showMessage(
  element,
  text,
  type
){
  element.textContent = text;
  element.className =
    `message ${type}`;
}

function clearMessage(element){
  element.textContent = "";
  element.className = "message";
}


/* ==============================
   API
============================== */

async function adminRequest(payload){

  const response =
    await fetch(
      "/api/client-admin",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({
          password:
            adminPassword,
          ...payload
        })
      }
    );

  let data = {};

  try{
    data =
      await response.json();
  }catch{}

  if(!response.ok){

    const error =
      new Error(
        data.error ||
        `Request failed ${response.status}`
      );

    error.status =
      response.status;

    throw error;
  }

  return data;
}


/* ==============================
   LOGIN
============================== */

async function login(){

  clearMessage(
    $("loginMessage")
  );

  const password =
    $("passwordInput").value;

  if(!password){

    showMessage(
      $("loginMessage"),
      "أدخل كلمة المرور.",
      "error"
    );

    return;
  }

  adminPassword =
    password;

  $("loginBtn").disabled =
    true;

  try{

    const data =
      await adminRequest({
        action:"list"
      });

    clients =
      data.clients || [];

    $("loginView").style.display =
      "none";

    $("appView").style.display =
      "block";

    renderClients();

  }catch(error){

    adminPassword = "";

    showMessage(
      $("loginMessage"),
      error.status === 401
        ? "كلمة المرور غير صحيحة."
        : "تعذر الاتصال بخدمة الإدارة.",
      "error"
    );

  }finally{

    $("loginBtn").disabled =
      false;
  }
}


/* ==============================
   LOAD CLIENTS
============================== */

async function loadClients(){

  $("clientsContainer").innerHTML =
    `<div class="empty">جاري التحميل...</div>`;

  try{

    const data =
      await adminRequest({
        action:"list"
      });

    clients =
      data.clients || [];

    renderClients();

  }catch(error){

    $("clientsContainer").innerHTML =
      `<div class="empty">تعذر تحميل العملاء.</div>`;
  }
}


/* ==============================
   ESCAPE
============================== */

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ==============================
   CLIENT LIST
============================== */

function renderClients(){

  const container =
    $("clientsContainer");

  $("clientCount").textContent =
    `${clients.length} عميل`;

  if(!clients.length){

    container.innerHTML =
      `<div class="empty">لا يوجد عملاء.</div>`;

    return;
  }

  container.innerHTML =
    `<div class="clients-grid">${
      clients.map(client => {

        const active =
          client.active !== false;

        return `
          <div class="client-card ${active ? "" : "inactive"}">

            <div class="client-title">
              ${escapeHtml(client.name)}
            </div>

            <div class="slug">
              ${escapeHtml(client.slug)}
            </div>

            <div class="meta">

              ${
                client.business_type_ar
                  ? `<div>${escapeHtml(client.business_type_ar)}</div>`
                  : ""
              }

              ${
                client.location_ar
                  ? `<div>📍 ${escapeHtml(client.location_ar)}</div>`
                  : ""
              }

            </div>

            <span class="status ${active ? "active" : "inactive"}">
              ${active ? "فعال" : "متوقف"}
            </span>

            <div class="actions">

              <button
                class="btn btn-blue"
                onclick="openClient('${client.slug}')"
              >
                فتح
              </button>

              <button
                class="btn btn-gray"
                onclick="editClient('${client.id}')"
              >
                تعديل
              </button>

              <button
                class="btn ${active ? "btn-red" : "btn-green"}"
                onclick="toggleClient('${client.id}')"
              >
                ${active ? "إيقاف" : "تشغيل"}
              </button>

              ${
                client.slug !== "first-bike"
                  ? `
                    <button
                      class="btn btn-red"
                      onclick="deleteClient('${client.id}','${escapeHtml(client.name)}')"
                    >
                      حذف
                    </button>
                  `
                  : ""
              }

            </div>

          </div>
        `;
      }).join("")
    }</div>`;
}


/* ==============================
   OPEN CLIENT
============================== */

function openClient(slug){

  const url =
    `${window.location.origin}/?client=${encodeURIComponent(slug)}`;

  window.open(
    url,
    "_blank"
  );
}


/* ==============================
   NEW CLIENT
============================== */

function resetForm(){

  $("clientId").value = "";
  $("name").value = "";
  $("slug").value = "";
  $("brandName").value = "";

  $("defaultLanguage").value =
    "ar";

  $("assistantAr").value = "";
  $("assistantEn").value = "";

  $("welcomeAr").value = "";
  $("welcomeEn").value = "";

  $("businessAr").value = "";
  $("businessEn").value = "";

  $("locationAr").value = "";
  $("locationEn").value = "";

  $("hoursAr").value = "";
  $("hoursEn").value = "";

  $("servicesAr").value = "";
  $("servicesEn").value = "";

  $("notesAr").value = "";
  $("notesEn").value = "";

  $("active").checked = true;

  $("pricesContainer").innerHTML =
    "";

  clearMessage(
    $("formMessage")
  );
}


function newClient(){

  resetForm();

  $("formHeading").textContent =
    "إضافة عميل جديد";

  $("clientFormCard").style.display =
    "block";

  $("clientFormCard").scrollIntoView({
    behavior:"smooth"
  });
}


/* ==============================
   PRICE ROWS
============================== */

function addPriceRow(
  price = {}
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "price-row";

  wrapper.innerHTML = `
    <input
      class="price-label"
      placeholder="مثال: 220cc"
      value="${escapeHtml(price.label || "")}"
    >

    <input
      class="price-value"
      type="number"
      step="0.01"
      placeholder="السعر"
      value="${price.price ?? ""}"
    >

    <input
      class="price-unit-ar"
      placeholder="درهم / ساعة"
      value="${escapeHtml(price.unit_ar || "")}"
    >

    <input
      class="price-unit-en"
      placeholder="AED / hour"
      value="${escapeHtml(price.unit_en || "")}"
    >

    <button
      type="button"
      class="remove-price"
      title="حذف"
    >
      ×
    </button>
  `;

  wrapper
    .querySelector(".remove-price")
    .addEventListener(
      "click",
      () => wrapper.remove()
    );

  $("pricesContainer")
    .appendChild(wrapper);
}


function collectPrices(){

  return [
    ...document.querySelectorAll(
      ".price-row"
    )
  ]
  .map(row => {

    const label =
      row.querySelector(
        ".price-label"
      ).value.trim();

    const rawPrice =
      row.querySelector(
        ".price-value"
      ).value;

    if(
      !label ||
      rawPrice === ""
    ){
      return null;
    }

    return {
      label,

      price:
        Number(rawPrice),

      unit_ar:
        row.querySelector(
          ".price-unit-ar"
        ).value.trim(),

      unit_en:
        row.querySelector(
          ".price-unit-en"
        ).value.trim()
    };
  })
  .filter(Boolean);
}


/* ==============================
   EDIT CLIENT
============================== */

async function editClient(clientId){

  resetForm();

  $("formHeading").textContent =
    "تعديل بيانات العميل";

  $("clientFormCard").style.display =
    "block";

  showMessage(
    $("formMessage"),
    "جاري تحميل بيانات العميل...",
    "success"
  );

  try{

    const data =
      await adminRequest({
        action:"get",
        client_id:clientId
      });

    const client =
      data.client;

    const config =
      client.config || {};

    $("clientId").value =
      client.id || "";

    $("name").value =
      client.name || "";

    $("slug").value =
      client.slug || "";

    $("brandName").value =
      config.brand_name || "";

    $("defaultLanguage").value =
      config.default_language === "en"
        ? "en"
        : "ar";

    $("assistantAr").value =
      config.assistant_name_ar || "";

    $("assistantEn").value =
      config.assistant_name_en || "";

    $("welcomeAr").value =
      config.welcome_message_ar || "";

    $("welcomeEn").value =
      config.welcome_message_en || "";

    $("businessAr").value =
      config.business_type_ar || "";

    $("businessEn").value =
      config.business_type_en || "";

    $("locationAr").value =
      config.location_ar || "";

    $("locationEn").value =
      config.location_en || "";

    $("hoursAr").value =
      config.working_hours_ar || "";

    $("hoursEn").value =
      config.working_hours_en || "";

    $("servicesAr").value =
      Array.isArray(
        config.services_ar
      )
        ? config.services_ar.join("\n")
        : "";

    $("servicesEn").value =
      Array.isArray(
        config.services_en
      )
        ? config.services_en.join("\n")
        : "";

    $("notesAr").value =
      config.notes_ar || "";

    $("notesEn").value =
      config.notes_en || "";

    $("active").checked =
      config.active !== false;

    $("pricesContainer").innerHTML =
      "";

    if(
      Array.isArray(
        config.rental_prices
      )
    ){
      config.rental_prices
        .forEach(addPriceRow);
    }

    clearMessage(
      $("formMessage")
    );

    $("clientFormCard")
      .scrollIntoView({
        behavior:"smooth"
      });

  }catch(error){

    showMessage(
      $("formMessage"),
      "تعذر تحميل بيانات العميل.",
      "error"
    );
  }
}


/* ==============================
   SAVE CLIENT
============================== */

function lines(id){

  return $(id)
    .value
    .split("\n")
    .map(x => x.trim())
    .filter(Boolean);
}


async function saveClient(){

  clearMessage(
    $("formMessage")
  );

  const clientId =
    value("clientId");

  const name =
    value("name");

  const slug =
    value("slug");

  if(!name || !slug){

    showMessage(
      $("formMessage"),
      "اسم العميل والـ Slug مطلوبان.",
      "error"
    );

    return;
  }

  $("saveClientBtn").disabled =
    true;

  try{

    await adminRequest({

      action:
        clientId
          ? "update"
          : "create",

      client_id:
        clientId || undefined,

      name,

      slug,

      brand_name:
        value("brandName"),

      assistant_name_ar:
        value("assistantAr"),

      assistant_name_en:
        value("assistantEn"),

      business_type_ar:
        value("businessAr"),

      business_type_en:
        value("businessEn"),

      location_ar:
        value("locationAr"),

      location_en:
        value("locationEn"),

      working_hours_ar:
        value("hoursAr"),

      working_hours_en:
        value("hoursEn"),

      services_ar:
        lines("servicesAr"),

      services_en:
        lines("servicesEn"),

      rental_prices:
        collectPrices(),

      notes_ar:
        value("notesAr"),

      notes_en:
        value("notesEn"),

      welcome_message_ar:
        value("welcomeAr"),

      welcome_message_en:
        value("welcomeEn"),

      default_language:
        $("defaultLanguage").value,

      active:
        $("active").checked
    });

    showMessage(
      $("formMessage"),
      clientId
        ? "تم تحديث العميل بنجاح ✓"
        : "تم إنشاء العميل بنجاح ✓",
      "success"
    );

    await loadClients();

    if(!clientId){

      setTimeout(
        () => {
          $("clientFormCard")
            .style.display =
            "none";
        },
        1200
      );
    }

  }catch(error){

    let message =
      "تعذر حفظ العميل.";

    if(
      error.message.includes(
        "slug already exists"
      )
    ){
      message =
        "هذا الـ Slug مستخدم لعميل آخر.";
    }

    showMessage(
      $("formMessage"),
      message,
      "error"
    );

  }finally{

    $("saveClientBtn").disabled =
      false;
  }
}


/* ==============================
   TOGGLE
============================== */

async function toggleClient(
  clientId
){

  try{

    await adminRequest({
      action:"toggle",
      client_id:clientId
    });

    await loadClients();

  }catch(error){

    alert(
      "تعذر تغيير حالة العميل."
    );
  }
}


/* ==============================
   DELETE
============================== */

async function deleteClient(
  clientId,
  name
){

  const confirmed =
    confirm(
      `هل أنت متأكد من حذف العميل "${name}"؟\n\nلا تستخدم الحذف للعميل الفعلي إلا إذا كنت متأكدًا.`
    );

  if(!confirmed){
    return;
  }

  try{

    await adminRequest({
      action:"delete",
      client_id:clientId
    });

    await loadClients();

  }catch(error){

    alert(
      "تعذر حذف العميل. قد تكون هناك بيانات مرتبطة به."
    );
  }
}
