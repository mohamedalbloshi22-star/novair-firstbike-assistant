<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVAIRE | الأسئلة غير المجابة</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f6f8;
  color:#1f2937
}
.container{
  max-width:1000px;
  margin:auto;
  padding:24px
}
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06)
}
.item{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
  background:#fafafa
}
input,textarea,select,button{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
  margin:6px 0 12px
}
textarea{
  min-height:90px;
  resize:vertical
}
button{
  border:0;
  cursor:pointer;
  font-weight:bold
}
.primary{
  background:#111827;
  color:white
}
.success{
  background:#047857;
  color:white
}
.secondary{
  background:#e5e7eb;
  color:#111827
}
.danger{
  background:#b91c1c;
  color:white
}
.muted{
  color:#6b7280;
  font-size:14px
}
.top-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
#app{
  display:none
}
#loadingBox{
  max-width:420px;
  margin:90px auto;
  text-align:center
}
#message{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px
}
#message.ok{
  display:block;
  background:#d1fae5;
  color:#065f46
}
#message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b
}
@media(max-width:700px){
  .top-actions{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loadingBox">
<h1>NOVAIRE</h1>
<h2>الأسئلة غير المجابة</h2>
<p class="muted">جاري التحقق من جلسة الإدارة...</p>
</div>


<div id="app">

<div id="message"></div>


<div class="card">

<h1>NOVAIRE</h1>
<h2>الأسئلة غير المجابة</h2>

<label>العميل</label>

<select
id="clientSelect"
onchange="clientChanged()">
<option value="">اختر العميل</option>
</select>

<div class="top-actions">

<button
class="secondary"
onclick="goControl()">
لوحة التحكم
</button>

<button
class="danger"
onclick="logout()">
تسجيل الخروج
</button>

</div>

</div>


<div class="card">

<h2>الأسئلة التي تحتاج إجابة</h2>

<div id="list">
جاري التحميل...
</div>

</div>

</div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const requestedClient =
  params.get("client") || "";


/*
================================
AUTH
================================
*/

async function checkAuth(){

  try{

    const response =
      await fetch(
        "/api/admin-auth",
        {
          method:"GET",
          credentials:"same-origin",
          cache:"no-store"
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.authenticated
    ){

      window.location.href =
        "/control.html";

      return false;
    }

    return true;

  }catch{

    window.location.href =
      "/control.html";

    return false;
  }
}


async function logout(){

  try{

    await fetch(
      "/api/admin-auth",
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        credentials:"same-origin",

        body:JSON.stringify({
          action:"logout"
        })
      }
    );

  }catch{}

  window.location.href =
    "/control.html";
}


function goControl(){

  window.location.href =
    "/control.html";
}


/*
================================
API
================================
*/

async function api(
  url,
  payload
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        credentials:"same-origin",

        body:JSON.stringify(
          payload
        )
      }
    );

  let data = {};

  try{
    data =
      await response.json();
  }catch{}

  if(!response.ok){

    if(
      response.status === 401
    ){

      window.location.href =
        "/control.html";
    }

    throw new Error(
      data.error ||
      data.details ||
      "حدث خطأ"
    );
  }

  return data;
}


/*
================================
MESSAGE
================================
*/

function showMessage(
  text,
  type="ok"
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.className =
    type;

  box.style.display =
    "block";

  setTimeout(
    ()=>{
      box.style.display =
        "none";
    },
    3000
  );
}


/*
================================
CLIENTS
================================
*/

async function loadClients(){

  const data =
    await api(
      "/api/client-admin",
      {
        action:"list"
      }
    );

  const clients =
    Array.isArray(data.clients)
      ? data.clients
      : Array.isArray(data.items)
        ? data.items
        : Array.isArray(data)
          ? data
          : [];

  const select =
    document.getElementById(
      "clientSelect"
    );

  select.innerHTML =
    '<option value="">اختر العميل</option>';


  clients.forEach(
    client=>{

      const option =
        document.createElement(
          "option"
        );

      option.value =
        client.slug;

      option.textContent =
        client.name ||
        client.config?.brand_name ||
        client.slug;

      select.appendChild(
        option
      );
    }
  );


  if(requestedClient){

    const exists =
      clients.some(
        client =>
          client.slug ===
          requestedClient
      );

    if(exists){

      select.value =
        requestedClient;

      await loadQuestions();

      return;
    }
  }


  if(clients.length){

    select.value =
      clients[0].slug;

    await loadQuestions();

  }else{

    document.getElementById(
      "list"
    ).innerHTML =
      "لا يوجد عملاء.";
  }
}


/*
================================
CLIENT CHANGE
================================
*/

async function clientChanged(){

  const slug =
    document.getElementById(
      "clientSelect"
    ).value;

  if(slug){

    history.replaceState(
      {},
      "",
      window.location.pathname +
      "?client=" +
      encodeURIComponent(slug)
    );
  }

  await loadQuestions();
}


/*
================================
LOAD QUESTIONS
================================
*/

async function loadQuestions(){

  const slug =
    document.getElementById(
      "clientSelect"
    ).value;

  const list =
    document.getElementById(
      "list"
    );

  if(!slug){

    list.innerHTML =
      "اختر العميل.";

    return;
  }

  list.innerHTML =
    "جاري التحميل...";

  try{

    const data =
      await api(
        "/api/unanswered-admin",
        {
          action:"list",
          client_slug:slug
        }
      );

    const items =
      Array.isArray(
        data.questions
      )
        ? data.questions
        : Array.isArray(
            data.items
          )
          ? data.items
          : [];

    render(items);

  }catch(error){

    list.innerHTML = "";

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
================================
RENDER
================================
*/

function render(items){

  const list =
    document.getElementById(
      "list"
    );

  list.innerHTML = "";

  if(!items.length){

    list.innerHTML =
      '<p class="muted">لا توجد أسئلة غير مجابة لهذا العميل.</p>';

    return;
  }


  items.forEach(
    item=>{

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "item";

      div.innerHTML = `

<h3>${escapeHtml(
  item.question || ""
)}</h3>

<p class="muted">
تاريخ السؤال:
${item.created_at
  ? escapeHtml(
      new Date(
        item.created_at
      ).toLocaleString(
        "ar-AE"
      )
    )
  : ""}
</p>

<label>الإجابة المعتمدة</label>

<textarea
id="answer-${item.id}"
placeholder="اكتب الإجابة التي تريد أن يتعلمها المساعد"
></textarea>

<label>اللغة</label>

<select
id="language-${item.id}">
<option value="ar">العربية</option>
<option value="en">English</option>
</select>

<button
class="success"
onclick="resolveQuestion('${item.id}')">
اعتماد الإجابة وإضافتها لقاعدة المعرفة
</button>
`;

      list.appendChild(
        div
      );
    }
  );
}


/*
================================
RESOLVE
================================
*/

async function resolveQuestion(id){

  const slug =
    document.getElementById(
      "clientSelect"
    ).value;

  const answer =
    document.getElementById(
      "answer-"+id
    ).value.trim();

  const language =
    document.getElementById(
      "language-"+id
    ).value;


  if(!answer){

    alert(
      "اكتب الإجابة أولًا"
    );

    return;
  }


  try{

    await api(
      "/api/unanswered-admin",
      {
        action:"resolve",

        client_slug:
          slug,

        question_id:
          id,

        approved_answer:
          answer,

        language
      }
    );


    showMessage(
      "تم اعتماد الإجابة وإضافتها لقاعدة المعرفة."
    );

    await loadQuestions();

  }catch(error){

    showMessage(
      error.message,
      "error"
    );
  }
}


/*
================================
ESCAPE
================================
*/

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/*
================================
START
================================
*/

async function start(){

  const authenticated =
    await checkAuth();

  if(!authenticated){
    return;
  }

  document.getElementById(
    "loadingBox"
  ).style.display =
    "none";

  document.getElementById(
    "app"
  ).style.display =
    "block";


  try{

    await loadClients();

  }catch(error){

    showMessage(
      error.message,
      "error"
    );
  }
}


start();

</script>

</body>
</html>
