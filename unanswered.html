<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVAIRE | الأسئلة غير المجابة</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6f8;color:#1f2937}
.container{max-width:1000px;margin:auto;padding:24px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:14px;background:#fafafa}
input,textarea,select,button{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin:6px 0 12px}
textarea{min-height:90px}
button{border:0;cursor:pointer;font-weight:bold}
.primary{background:#111827;color:white}
.success{background:#047857;color:white}
.secondary{background:#e5e7eb;color:#111827}
.muted{color:#6b7280;font-size:14px}
#app{display:none}
#message{display:none;padding:12px;border-radius:8px;margin-bottom:15px}
#message.ok{display:block;background:#d1fae5;color:#065f46}
#message.error{display:block;background:#fee2e2;color:#991b1b}
</style>
</head>

<body>

<div class="container">

<div class="card" id="loginBox">
<h1>NOVAIRE</h1>
<h2>الأسئلة غير المجابة</h2>

<input id="password" type="password" placeholder="كلمة مرور الإدارة">

<button class="primary" onclick="login()">
دخول
</button>
</div>


<div id="app">

<div id="message"></div>

<div class="card">

<label>العميل</label>

<select id="clientSelect" onchange="clientChanged()">
<option value="">اختر العميل</option>
</select>

<button class="secondary" onclick="logout()">
تسجيل الخروج
</button>

</div>


<div class="card">

<h2>الأسئلة التي تحتاج إجابة</h2>

<div id="list">
اختر العميل.
</div>

</div>

</div>

</div>


<script>

let adminPassword="";

const params=new URLSearchParams(window.location.search);
const requestedClient=params.get("client")||"";


async function api(url,payload){

const response=await fetch(url,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
password:adminPassword,
...payload
})
});

let data={};

try{
data=await response.json();
}catch{}

if(!response.ok){
throw new Error(data.error||data.details||"حدث خطأ");
}

return data;
}


function showMessage(text,type="ok"){

const box=document.getElementById("message");

box.textContent=text;
box.className=type;
box.style.display="block";

setTimeout(()=>{
box.style.display="none";
},3000);

}


async function login(){

const value=document.getElementById("password").value.trim();

if(!value){
alert("أدخل كلمة المرور");
return;
}

adminPassword=value;

try{

await loadClients();

document.getElementById("loginBox").style.display="none";
document.getElementById("app").style.display="block";

}catch(error){

adminPassword="";
alert(error.message);

}

}


function logout(){

adminPassword="";

document.getElementById("app").style.display="none";
document.getElementById("loginBox").style.display="block";

}


async function loadClients(){

const data=await api("/api/client-admin",{
action:"list"
});

const clients=
Array.isArray(data.clients)
?data.clients
:Array.isArray(data.items)
?data.items
:Array.isArray(data)
?data
:[];

const select=document.getElementById("clientSelect");

select.innerHTML='<option value="">اختر العميل</option>';

clients.forEach(client=>{

const option=document.createElement("option");

option.value=client.slug;

option.textContent=
client.name||
client.config?.brand_name||
client.slug;

select.appendChild(option);

});


if(requestedClient){

const exists=clients.some(
client=>client.slug===requestedClient
);

if(exists){

select.value=requestedClient;

await loadQuestions();

return;

}

}


if(clients.length){

select.value=clients[0].slug;

await loadQuestions();

}

}


async function clientChanged(){

const slug=document.getElementById("clientSelect").value;

if(slug){

history.replaceState(
{},
"",
window.location.pathname+
"?client="+encodeURIComponent(slug)
);

}

await loadQuestions();

}


async function loadQuestions(){

const slug=document.getElementById("clientSelect").value;

const list=document.getElementById("list");

if(!slug){

list.innerHTML="اختر العميل.";

return;

}

list.innerHTML="جاري التحميل...";

try{

const data=await api("/api/unanswered-admin",{
action:"list",
client_slug:slug
});

const items=
Array.isArray(data.questions)
?data.questions
:Array.isArray(data.items)
?data.items
:[];

render(items);

}catch(error){

list.innerHTML="";

showMessage(error.message,"error");

}

}


function render(items){

const list=document.getElementById("list");

list.innerHTML="";

if(!items.length){

list.innerHTML=
'<p class="muted">لا توجد أسئلة غير مجابة لهذا العميل.</p>';

return;

}


items.forEach(item=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<h3>${escapeHtml(item.question||"")}</h3>

<p class="muted">
تاريخ السؤال:
${item.created_at
?escapeHtml(new Date(item.created_at).toLocaleString("ar-AE"))
:""}
</p>

<label>الإجابة المعتمدة</label>

<textarea
id="answer-${item.id}"
placeholder="اكتب الإجابة التي تريد أن يتعلمها المساعد"
></textarea>

<label>اللغة</label>

<select id="language-${item.id}">
<option value="ar">العربية</option>
<option value="en">English</option>
</select>

<button
class="success"
onclick="resolveQuestion('${item.id}')"
>
اعتماد الإجابة وإضافتها لقاعدة المعرفة
</button>
`;

list.appendChild(div);

});

}


async function resolveQuestion(id){

const slug=document.getElementById("clientSelect").value;

const answer=document.getElementById("answer-"+id).value.trim();

const language=document.getElementById("language-"+id).value;

if(!answer){

alert("اكتب الإجابة أولًا");

return;

}

try{

await api("/api/unanswered-admin",{
action:"resolve",
client_slug:slug,
id,
answer,
language
});

showMessage("تم اعتماد الإجابة وإضافتها لقاعدة المعرفة.");

await loadQuestions();

}catch(error){

showMessage(error.message,"error");

}

}


function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


document.getElementById("password")
.addEventListener("keydown",event=>{

if(event.key==="Enter"){
login();
}

});

</script>

</body>
</html>
